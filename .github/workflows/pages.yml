# Builds and publishes dist/ to GitHub Pages on every push to main.
#
# Pages can serve a branch folder directly, but only / or /docs, never /dist,
# so the deploy runs as a workflow instead. Building here rather than shipping
# the committed dist/ means a stale commit cannot quietly go live.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than canceling it half published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      # the same gate CI applies, run again against what is about to go live
      - run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
