  const MOSS = {
    sky: ['#0A0E06', '#141A0A', '#252D14', '#31391B', '#10150A'],
    glow: '134,133,82', wood: ['#4A4A28', '#33351A', '#1A1C0D'],
    silhouette: '#0C1107', rim: '200,214,150'
  };

  let cv = null, ctx = null, W = 0, H = 0, dpr = 1;
  let kind = 'cellar', rows = [], drawn = '';

  function mount(){
    if (cv) return;
    cv = document.createElement('canvas');
    cv.className = 'backdrop';
    ctx = cv.getContext('2d');
    document.body.insertBefore(cv, document.body.firstChild);
    /* The room has to follow the window. Without this it drew once at whatever
       size the page happened to be during boot, which on a first paint can be
       nothing at all, and then never again. */
    addEventListener('resize', render);
    addEventListener('orientationchange', render);
  }

  const rand = seed => RNG.mulberry32(RNG.hashSeed(seed));

  /* An offscreen canvas at the same pixel density, drawn in CSS pixels. Used
     wherever a group of shapes has to be flattened before it is composited, so
     that overlaps merge instead of stacking their alphas. */
  function layer(w, h, draw){
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.ceil(w * dpr));
    off.height = Math.max(1, Math.ceil(h * dpr));
    const c = off.getContext('2d');
    c.scale(dpr, dpr);
    draw(c);
    return off;
  }

  /* A bottle profile: body, shoulder, neck, lip. The silhouettes used to be a
     rounded rectangle with a rectangular neck laid over the top, which is a
     large part of why the room read as generated rather than furnished. */
  function flask(c, x, y, bw, bh, squat){
    const neck = bw * (squat ? 0.40 : 0.30);
    const nx0 = x + (bw - neck) / 2, nx1 = nx0 + neck;
    const bottom = y + bh;
    const foot = Math.min(bw * 0.22, bh * 0.14);
    const shoulder = y + bh * (squat ? 0.34 : 0.24);
    const rise = bh * (squat ? 0.16 : 0.26);
    const lipY = y - rise;
    const flare = neck * 0.16;
    c.beginPath();
    c.moveTo(x, bottom - foot);
    c.quadraticCurveTo(x, bottom, x + foot, bottom);
    c.lineTo(x + bw - foot, bottom);
    c.quadraticCurveTo(x + bw, bottom, x + bw, bottom - foot);
    c.lineTo(x + bw, shoulder);
    c.quadraticCurveTo(x + bw, y, nx1, y - rise * 0.25);
    c.lineTo(nx1, lipY + flare);
    c.lineTo(nx1 + flare, lipY + flare);
    c.lineTo(nx1 + flare, lipY);
    c.lineTo(nx0 - flare, lipY);
    c.lineTo(nx0 - flare, lipY + flare);
    c.lineTo(nx0, lipY + flare);
    c.lineTo(nx0, y - rise * 0.25);
    c.quadraticCurveTo(x, y, x, shoulder);
    c.closePath();
  }

  function sky(p){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    p.sky.forEach((c, i) => g.addColorStop(i / (p.sky.length - 1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* the back wall is boards, which is what stops it reading as a gradient */
  function panelling(p){
    const r = rand('boards');
    const step = Math.max(46, W / 11);
    for (let x = step * r(); x < W; x += step * (0.7 + r() * 0.6)){
      /* A seam of one flat alpha from ceiling to floor reads as a ruled line
         rather than a join between boards, so it fades where the light does. */
      const a = 0.16 + r() * 0.2;
      const dark = ctx.createLinearGradient(0, 0, 0, H);
      dark.addColorStop(0, `rgba(0,0,0,${a * 0.3})`);
      dark.addColorStop(0.45, `rgba(0,0,0,${a})`);
      dark.addColorStop(1, `rgba(0,0,0,${a * 0.45})`);
      ctx.fillStyle = dark;
      ctx.fillRect(x, 0, 1.4, H);
      const b = 0.02 + r() * 0.03;
      const lit = ctx.createLinearGradient(0, 0, 0, H);
      lit.addColorStop(0, `rgba(${p.rim},0)`);
      lit.addColorStop(0.5, `rgba(${p.rim},${b})`);
      lit.addColorStop(1, `rgba(${p.rim},0)`);
      ctx.fillStyle = lit;
      ctx.fillRect(x + 1.4, 0, 1, H);
    }
  }

  function candle(p){
    const g = ctx.createRadialGradient(W * 0.32, H * 0.30, 0, W * 0.32, H * 0.30, Math.max(W, H) * 0.6);
    g.addColorStop(0, `rgba(${p.glow},.15)`);
    g.addColorStop(0.4, `rgba(${p.glow},.05)`);
    g.addColorStop(1, `rgba(${p.glow},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* Jars and demijohns standing further back.

     Each shape used to be drawn straight onto the room at its own alpha, so
     where two overlapped you could read the outline of the one behind through
     the one in front. Nothing in a dark room looks like that; it reads as glass
     ghosts rather than as objects standing behind other objects. A pass is now
     flattened opaque in its own layer and composited once, so overlaps merge
     into a single mass, and the nearer shape simply covers what is behind it.

     Two passes rather than one, so there is still depth: the far pass is smaller
     and dimmer, and within a pass the taller shapes are drawn last so the bigger
     thing is the one in front. */
  function clutter(p, baseY, seed){
    const passes = [{ tag: 'far', scale: 0.72, alpha: 0.34 },
                    { tag: 'near', scale: 1.05, alpha: 0.55 }];
    for (const pass of passes){
      const r = rand('clutter' + seed + pass.tag);
      const n = Math.round(W / 58) + 5;
      const shapes = [];
      for (let i = 0; i < n; i++){
        const squat = r() < 0.42;
        const bw = W * (squat ? 0.035 + r() * 0.05 : 0.02 + r() * 0.032) * pass.scale;
        const bh = bw * (squat ? 0.9 + r() * 0.8 : 2.1 + r() * 2.6);
        shapes.push({ squat, bw, bh, x: r() * (W + bw) - bw / 2, lit: 0.05 + r() * 0.07 });
      }
      shapes.sort((a, b) => a.bh - b.bh);
      const h = baseY + 4;
      if (h <= 0) continue;
      const off = layer(W, h, c => {
        for (const sh of shapes){
          const y = baseY - sh.bh;
          c.fillStyle = p.silhouette;
          flask(c, sh.x, y, sh.bw, sh.bh, sh.squat);
          c.fill();
          /* the light catches one side, and the next shape along covers it if it
             happens to stand in front, which is what makes the depth read */
          c.save();
          flask(c, sh.x, y, sh.bw, sh.bh, sh.squat);
          c.clip();
          c.globalAlpha = sh.lit;
          c.fillStyle = `rgb(${p.rim})`;
          c.fillRect(sh.x + sh.bw * 0.14, y, Math.max(1, sh.bw * 0.05), sh.bh);
          c.restore();
        }
      });
      ctx.globalAlpha = pass.alpha;
      ctx.drawImage(off, 0, 0, W, h);
      ctx.globalAlpha = 1;
    }
  }

  /* Directly behind the bottles being played the room steps back, so nothing
     behind them shows through the glass and competes for the same plane. */
  function pocket(row){
    if (!row.spots || !row.spots.length) return;
    const x0 = Math.min(...row.spots.map(s => s[0])) - 34;
    const x1 = Math.max(...row.spots.map(s => s[1])) + 34;
    const top = (row.top == null ? row.y - 150 : row.top) - 26;
    const w = x1 - x0, h = row.y - top;
    if (w <= 0 || h <= 0) return;
    /* A plain rectangle here put a hard vertical edge down each side of the
       playing row, which read as a dark frame drawn around the bottles. The
       recess has to have no edges of its own, so it is faded out at the sides
       and along the top. */
    const off = layer(w, h, c => {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(0,0,0,.10)');
      g.addColorStop(0.5, 'rgba(0,0,0,.42)');
      g.addColorStop(1, 'rgba(0,0,0,.54)');
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'destination-out';
      const sides = c.createLinearGradient(0, 0, w, 0);
      sides.addColorStop(0, 'rgba(0,0,0,1)');
      sides.addColorStop(0.18, 'rgba(0,0,0,0)');
      sides.addColorStop(0.82, 'rgba(0,0,0,0)');
      sides.addColorStop(1, 'rgba(0,0,0,1)');
      c.fillStyle = sides;
      c.fillRect(0, 0, w, h);
      const above = c.createLinearGradient(0, 0, 0, h * 0.24);
      above.addColorStop(0, 'rgba(0,0,0,1)');
      above.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = above;
      c.fillRect(0, 0, w, h * 0.24);
    });
    ctx.drawImage(off, x0, top, w, h);
  }

  function cobweb(p, x, y, size, flip){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -1 : 1, 1);
    ctx.strokeStyle = `rgba(${p.rim},.035)`;
    ctx.lineWidth = 0.7;
    for (let i = 1; i <= 4; i++){
      ctx.beginPath();
      ctx.arc(0, 0, (size / 4) * i, 0.06, 1.51);
      ctx.stroke();
    }
    for (let a = 0.1; a < 1.5; a += 0.34){
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* A plank with an edge to it, brackets under, and a shadow cast by whatever
     stands on it. The contact shadows are what put the bottles on the shelf
     rather than in front of a picture of one. */
  function shelfUnit(p, row, seed, last){
    const y = row.y;
    const t = Math.min(32, Math.max(14, H * 0.038));
    const r = rand('shelf' + seed);

    ctx.save();
    ctx.beginPath(); ctx.rect(0, y, W, H - y); ctx.clip();
    const under = ctx.createLinearGradient(0, y, 0, y + t * 3.4);
    under.addColorStop(0, 'rgba(0,0,0,.66)');
    under.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = under;
    ctx.fillRect(0, y, W, t * 3.4);
    ctx.restore();

    /* brackets, drawn before the plank so the plank sits on them */
    const bn = Math.max(2, Math.round(W / 320));
    for (let i = 0; i <= bn; i++){
      const bx = (W / bn) * i;
      const bwid = t * 0.55, bhgt = t * 2.6;
      ctx.fillStyle = 'rgba(18,11,4,.78)';
      ctx.beginPath();
      ctx.moveTo(bx - bwid, y + t);
      ctx.lineTo(bx + bwid, y + t);
      ctx.lineTo(bx + bwid * 0.5, y + t + bhgt);
      ctx.lineTo(bx - bwid * 0.5, y + t + bhgt);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = `rgba(${p.rim},.05)`;
      ctx.fillRect(bx - bwid, y + t, bwid * 2, 1);
    }

    /* on the plank, under each bottle */
    (row.spots || []).forEach(([x0, x1]) => {
      const cx = (x0 + x1) / 2, wid = x1 - x0;
      const g = ctx.createRadialGradient(cx, y, 0, cx, y, wid * 0.9);
      g.addColorStop(0, 'rgba(0,0,0,.72)');
      g.addColorStop(0.55, 'rgba(0,0,0,.28)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, y + t * 0.22, wid * 0.85, t * 0.6, 0, 0, 6.283);
      ctx.fill();
    });

    const face = ctx.createLinearGradient(0, y, 0, y + t);
    face.addColorStop(0, p.wood[0]);
    face.addColorStop(0.28, p.wood[1]);
    face.addColorStop(1, p.wood[2]);
    ctx.fillStyle = face;
    ctx.fillRect(0, y, W, t);

    /* the front edge, which is what gives the plank thickness */
    ctx.fillStyle = `rgba(${p.rim},.13)`;
    ctx.fillRect(0, y, W, 1.3);
    ctx.fillStyle = 'rgba(0,0,0,.34)';
    ctx.fillRect(0, y + t * 0.62, W, 1);
    ctx.fillStyle = `rgba(${p.rim},.05)`;
    ctx.fillRect(0, y + t * 0.66, W, 1);

    for (let i = 0; i < Math.round(W / 22); i++){
      const gy = y + 2 + r() * (t - 4);
      ctx.strokeStyle = `rgba(18,10,3,${0.09 + r() * 0.24})`;
      ctx.lineWidth = 0.6 + r() * 1.2;
      ctx.beginPath();
      const sx = r() * W, len = W * (0.04 + r() * 0.2);
      ctx.moveTo(sx, gy);
      ctx.bezierCurveTo(sx + len * 0.3, gy + 0.9, sx + len * 0.7, gy - 0.9, sx + len, gy);
      ctx.stroke();
    }
    for (let i = 0; i < Math.round(W / 150) + 2; i++){
      const dx = r() * W, dl = t * (0.5 + r() * 2.6);
      ctx.fillStyle = `rgba(138,90,34,${0.14 + r() * 0.2})`;
      ctx.fillRect(dx, y + t, 1 + r() * 2, dl);
    }
    cobweb(p, 4, y - 3, t * 1.7, false);
    if (seed % 2 === 0) cobweb(p, W - 4, y - 3, t * 1.4, true);

    if (last){
      const below = ctx.createLinearGradient(0, y + t, 0, H);
      below.addColorStop(0, 'rgba(4,3,2,.70)');
      below.addColorStop(0.45, 'rgba(6,4,3,.85)');
      below.addColorStop(1, 'rgba(2,1,1,.93)');
      ctx.fillStyle = below;
      ctx.fillRect(0, y + t, W, H - y - t);
    }
  }

  function blotches(p){
    const r = rand('moss');
    const n = Math.round((W * H) / 17000) + 10;
    for (let i = 0; i < n; i++){
      const x = r() * W, y = r() * H;
      const rad = Math.min(W, H) * (0.02 + r() * 0.075);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      const light = r() < 0.42;
      g.addColorStop(0, light ? `rgba(${p.glow},.14)` : 'rgba(3,5,2,.16)');
      g.addColorStop(1, light ? `rgba(${p.glow},0)` : 'rgba(3,5,2,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad * (0.5 + r() * 0.5), r() * 3.14, 0, 6.283);
      ctx.fill();
    }
  }

  function motes(p){
    const r = rand('motes');
    const n = Math.round(W / 26);
    for (let i = 0; i < n; i++){
      const x = r() * W, y = r() * H * 0.8, rad = 0.6 + r() * 1.6;
      ctx.fillStyle = `rgba(${p.rim},${0.04 + r() * 0.10})`;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, 6.283);
      ctx.fill();
    }
  }

  function vignette(strong){
    const g = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.24,
                                       W / 2, H * 0.46, Math.max(W, H) * 0.80);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, `rgba(0,0,0,${strong ? .32 : .20})`);
    g.addColorStop(1, `rgba(0,0,0,${strong ? .88 : .66})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function grain(){
    const r = rand('grain');
    const n = Math.round((W * H) / 900);
    ctx.globalAlpha = 0.045;
    for (let i = 0; i < n; i++){
      ctx.fillStyle = r() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(r() * W, r() * H, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  const key = () => `${kind}|${W}|${H}|` +
    rows.map(r => `${r.y}:${(r.spots || []).map(s => s.join('-')).join(',')}`).join('|');

  function render(){
    if (!cv) return;
    const w = Math.round(innerWidth), h = Math.round(innerHeight);
    if (w < 8 || h < 8) return;              /* no viewport yet: wait to be asked again */
    W = w; H = h;
    const k = key();
    if (k === drawn) return;                 /* nothing moved, nothing to redraw */
    drawn = k;

    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);

    const p = kind === 'moss' ? MOSS : CELLAR;
    sky(p);
    if (kind === 'cellar') panelling(p);
    candle(p);
    if (rows.length){
      rows.forEach((row, i) => {
        clutter(p, row.y + 2, i);
        pocket(row);
        shelfUnit(p, row, i, i === rows.length - 1);
      });
      motes(p);
    } else {
      blotches(p);
      motes(p);
    }
    vignette(rows.length > 0);
    grain();
  }

  return {
    mount,
    set kind(k){ if (k !== kind){ kind = k; drawn = ''; render(); } },
    get kind(){ return kind; },
    /* Every row the bottles stand on: { y, top, spots: [[x0,x1], ...] } in
       viewport pixels. Plain numbers are accepted for a bare shelf. */
    setShelf(next){
      rows = (next == null ? [] : [].concat(next))
        .map(r => (typeof r === 'number' ? { y: Math.round(r) } : { ...r, y: Math.round(r.y) }))
        .filter(r => Number.isFinite(r.y))
        .sort((a, b) => a.y - b.y);
      render();
    },
    render
  };
})();
globalThis.Backdrop = Backdrop;


/* ---- 70-board.js ---- */
/* Everything that draws bottles and animates a pour. Owns the *view* state,
   which trails the logical state while queued animations catch up. */
const Board = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let root = null, fx = null, fluidOn = false;
  let view = [], selected = null;
  let onTap = () => {};

  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

  /* Drives a frame loop from 0 to 1 over ms, backstopped by a timer.
     requestAnimationFrame stops firing in a hidden tab, so a pour started just
     before the screen locks would otherwise never finish, and the queue waiting
     on it would never drain. Timers still fire when hidden, so one is kept as a
     floor: the animation jumps to its end state rather than hanging. */
  function frames(ms, onFrame){
    return new Promise(res => {
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        onFrame(1);
        res();
      };
      const bail = setTimeout(finish, ms + 500);
      (function step(now){
        if (done) return;
        const p = Math.min(1, (now - t0) / ms);
        if (p < 1){ onFrame(p); requestAnimationFrame(step); }
        else finish();
      })(t0);
    });
  }
  const el = i => root.querySelector(`.bottle[data-i="${i}"]`);
  const colorVar = c => `var(--c${c})`;

  /* --- layout: pick the row count that yields the largest bottles for the space
     available. Rows no longer have to divide the bottle count exactly: buying a
     vessel makes the count odd, and insisting on equal rows meant an eleven
     bottle board became one row of eleven and every bottle shrank to fit. A
     short last row is centred instead. --- */
  function layout(n){
    const W = root.clientWidth || window.innerWidth - 24;
    const H = root.clientHeight || 360;
    let best = null;
    for (let rows = 1; rows <= 4; rows++){
      if (rows > n) break;
      const cols = Math.ceil(n / rows);
      /* rows that would leave the last one nearly empty look like a mistake */
      if (cols * (rows - 1) >= n) continue;
      const gx = cols > 6 ? 7 : 11, gy = rows > 2 ? 12 : 20;
      const bw = Math.min((W - (cols - 1) * gx) / cols, ((H - (rows - 1) * gy) / rows) / 3.62, 58);
      if (!best || bw > best.bw) best = { bw, rows, cols, gx, gy };
    }
    if (!best) best = { bw:30, rows:1, cols:n, gx:8, gy:14 };
    document.documentElement.style.setProperty('--bw', Math.max(22, best.bw).toFixed(1) + 'px');
    root.style.setProperty('--cols', best.cols);
    root.style.columnGap = best.gx + 'px';
    root.style.rowGap = best.gy + 'px';
    return best;
  }
  /* contiguous runs of one color draw as a single band, so no seam shows
     between two units of the same liquid */
  function bandsOf(tube){
    const out = [];
    for (const c of tube){
      const last = out[out.length - 1];
      if (last && last.c === c) last.n++; else out.push({ c, n:1 });
    }
    return out;
  }
  const bandHeight = n => `calc(var(--bh) / var(--units) * ${n})`;

  function render(){
    const grid = layout(view.length);
    /* a last row that does not fill the track set is centred under the rest,
       rather than left hanging against the first column */
    const spare = view.length % grid.cols;
    const firstOfLast = spare ? view.length - spare : -1;
    const indent = spare ? Math.floor((grid.cols - spare) / 2) + 1 : 1;
    root.innerHTML = '';
    view.forEach((tube, i) => {
      const b = document.createElement('button');
      b.className = 'bottle';
      b.dataset.i = i;
      b.type = 'button';
      b.setAttribute('aria-label', `Bottle ${i + 1}, ${tube.length} of ${Rules.CAP} full`);
      const full = Rules.isFull(tube);
      if (full) b.classList.add('done');
      if (selected === i) b.classList.add('lifted');
      b.innerHTML = '<div class="collar"></div>';
      const glass = document.createElement('div'); glass.className = 'glass';
      const fill = document.createElement('div'); fill.className = 'fill';
      const bands = bandsOf(tube);
      bands.forEach((bd, idx) => {
        const d = document.createElement('div');
        d.className = 'band' + (idx === bands.length - 1 ? ' crest' : '');
        d.dataset.c = bd.c; d.dataset.n = bd.n;
        d.style.background = colorVar(bd.c);
        d.style.height = bandHeight(bd.n);
        fill.appendChild(d);
      });
      glass.appendChild(fill);
      if (full){ const p = document.createElement('div'); p.className = 'plug'; glass.appendChild(p); }
      const sheen = document.createElement('div'); sheen.className = 'sheen'; glass.appendChild(sheen);
      const gloss = document.createElement('div'); gloss.className = 'gloss'; glass.appendChild(gloss);
      b.appendChild(glass);
      if (full){ const c = document.createElement('div'); c.className = 'corktop'; b.appendChild(c); }
      if (i === firstOfLast) b.style.gridColumnStart = indent;
      b.addEventListener('click', () => onTap(i));
      root.appendChild(b);
    });
    root.appendChild(fx);
    fx.setAttribute('width', root.clientWidth);
    fx.setAttribute('height', root.clientHeight);
    /* the glass moved, so the liquid has to be re-measured and re-seeded */
    if (fluidOn) Fluid.sync(view);
    /* Every row, with the footprint of each bottle on it, so the shelving can be
       built underneath and each bottle given a shadow where it meets the wood. */
    const byRow = new Map();
    root.querySelectorAll('.bottle').forEach(b => {
      const g = b.querySelector('.glass'); if (!g) return;
      const r = g.getBoundingClientRect();
      const y = Math.round(r.bottom);
      if (!byRow.has(y)) byRow.set(y, { y, top: Math.round(r.top), spots: [] });
      byRow.get(y).spots.push([Math.round(r.left), Math.round(r.right)]);
    });
    Backdrop.setShelf([...byRow.values()]);
  }

  /* --- stream geometry: a tapering ribbon along a quadratic arc --- */
  function qpoint(p0, c, p1, t){
    const m = 1 - t;
    return { x: m*m*p0.x + 2*m*t*c.x + t*t*p1.x, y: m*m*p0.y + 2*m*t*c.y + t*t*p1.y };
  }
  function ribbon(p0, c, p1, w0, w1, t0, t1, off){
    const N = 18, L = [], R = [];
    for (let i = 0; i <= N; i++){
      const u = t0 + (t1 - t0) * (i / N);
      const p = qpoint(p0, c, p1, u);
      const dx = 2*(1-u)*(c.x-p0.x) + 2*u*(p1.x-c.x);
      const dy = 2*(1-u)*(c.y-p0.y) + 2*u*(p1.y-c.y);
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const w = (w0 + (w1 - w0) * u) / 2;
      const o = (off || 0) * w;
      L.push([(p.x + nx*(w+o)).toFixed(1), (p.y + ny*(w+o)).toFixed(1)]);
      R.push([(p.x - nx*(w-o)).toFixed(1), (p.y - ny*(w-o)).toFixed(1)]);
    }
    return 'M' + L.map(p => p.join(' ')).join('L') + 'L' + R.reverse().map(p => p.join(' ')).join('L') + 'Z';
  }

  /* The stream is drawn the same way whether the sim is on or not. With the sim
     on the bands it updates are invisible (the fill is transparent) and the
     liquid you see is the sim's, moved bottle to bottle alongside this. */
  async function animate(move){
    if (!fluidOn) return scripted(move);
    /* the level starts falling when the bottle has finished tipping and the
       stream actually leaves the lip, not while it is still on its way over */
    const tilt = reduce ? 120 : 520;
    const moved = sleep(tilt).then(() => Fluid.transfer(move));
    await scripted(move);
    await moved;
  }

  async function scripted(move){
    const src = el(move.from), dst = el(move.to);
    if (!src || !dst) return;
    const w = src.offsetWidth, h = src.offsetHeight;
    const glassH = src.querySelector('.glass').offsetHeight;
    const unitH = glassH / Rules.CAP, capH = h - glassH;
    const raw = CONFIG.palette[move.color];
    const dir = dst.offsetLeft > src.offsetLeft ? 1 : -1;
    /* A full bottle pours off the lip almost as soon as it leaves upright; an
       almost empty one has to go right over before anything reaches the lip.
       Tilting the same amount either way is what made the stream look like it
       was leaving a bottle whose liquid was nowhere near the spout. */
    const fill = Math.max(0, Math.min(1, view[move.from].length / Rules.CAP));
    const ang = dir * (56 + 30 * (1 - fill)), rad = ang * Math.PI / 180;
    /* The waits and the transitions have to be the same length. They were not:
       the waits collapsed to 60ms under reduced motion while the transitions
       stayed where they were, so the stream was drawn while the bottle was still
       on its way over and appeared to pour out of thin air. */
    const lean = reduce ? 60 : 220;
    const tip = reduce ? 60 : 300;

    /* the lip stops beside the target, not over it, so liquid arcs across */
    const lipX = dst.offsetLeft + w/2 - dir * w * 0.82;
    const lipY = dst.offsetTop - w * 0.42;
    const dx = (lipX - (h/2) * Math.sin(rad)) - (src.offsetLeft + w/2);
    const dy = (lipY + (h/2) * Math.cos(rad)) - (src.offsetTop + h/2);

    src.classList.add('pouring');
    src.classList.remove('lifted');
    src.style.transition = `transform ${lean}ms cubic-bezier(.3,0,.4,1)`;
    src.style.transform = `translate(${dx*0.4}px, ${dy-16}px) rotate(${ang*0.22}deg)`;
    await sleep(lean);
    src.style.transition = `transform ${tip}ms cubic-bezier(.35,.05,.3,1)`;
    src.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    await sleep(tip);

    const startFill = view[move.to].length;
    const impactX = dst.offsetLeft + w/2;
    const surfaceY = k => dst.offsetTop + capH + glassH - k * unitH;
    const P0 = { x: lipX, y: lipY };
    let P1 = { x: impactX, y: surfaceY(startFill) };
    const ctrl = () => ({ x: P0.x + (P1.x - P0.x) * 0.78, y: P0.y + (P1.y - P0.y) * 0.10 });
    /* A falling stream narrows: it speeds up under gravity and the same liquid
       per second has to fit through a smaller section. A ribbon of near constant
       width reads as a painted stripe rather than as something pouring. */
    const w0 = w * 0.19, w1 = w * 0.07;

    const body = document.createElementNS(NS, 'path'); body.setAttribute('fill', raw);
    const shine = document.createElementNS(NS, 'path');
    shine.setAttribute('fill', '#fff'); shine.setAttribute('opacity', '.32');
    fx.appendChild(body); fx.appendChild(shine);

    const bead = document.createElement('div');
    bead.className = 'bead';
    bead.style.background = raw;
    bead.style.width = (w*0.30) + 'px'; bead.style.height = (w*0.24) + 'px';
    bead.style.left = (P0.x - w*0.15) + 'px'; bead.style.top = (P0.y - w*0.12) + 'px';
    root.appendChild(bead);

    const pool = document.createElement('div');
    pool.className = 'pool';
    pool.style.background = raw;
    pool.style.width = (w*0.5) + 'px';
    pool.style.left = impactX + 'px';
    root.appendChild(pool);

    let head = 0, tail = 0;
    const paint = () => {
      const c = ctrl();
      body.setAttribute('d', ribbon(P0, c, P1, w0, w1, tail, head, 0));
      shine.setAttribute('d', ribbon(P0, c, P1, w0*0.34, w1*0.3, tail, head, -0.85));
      pool.style.top = (P1.y - 4) + 'px';
      pool.style.opacity = head >= 1 ? '.7' : '0';
    };
    /* the leading edge falls, it does not appear all at once */
    await frames(reduce ? 40 : 190, p => { head = p; paint(); });
    Audio.pourStart();

    const srcBand = src.querySelector('.fill').lastElementChild;
    const srcCount = srcBand ? +srcBand.dataset.n : 0;
    const dstFill = dst.querySelector('.fill');
    let dstBand = dstFill.lastElementChild;
    const merging = dstBand && +dstBand.dataset.c === move.color;
    const dstCount = merging ? +dstBand.dataset.n : 0;
    if (!merging){
      dstBand = document.createElement('div');
      dstBand.className = 'band crest';
      dstBand.dataset.c = move.color;
      dstBand.style.background = colorVar(move.color);
      dstBand.style.height = '0px';
      dstFill.querySelector('.band.crest')?.classList.remove('crest');
      dstFill.appendChild(dstBand);
    }
    const per = reduce ? 40 : 165;
    for (let k = 0; k < move.n; k++){
      await sleep(per);
      if (srcBand) srcBand.style.height = ((srcCount - k - 1) * unitH) + 'px';
      dstBand.style.height = ((dstCount + k + 1) * unitH) + 'px';
      dstBand.dataset.n = dstCount + k + 1;
      P1 = { x: impactX, y: surfaceY(startFill + k + 1) };
      paint();
      const p = (startFill + k + 1) / Rules.CAP;
      Audio.pourAt(p); Audio.glug(p);
      if (!reduce) splash(impactX, P1.y, raw, w);
    }
    /* the tail lets go of the lip and falls away */
    bead.style.transition = 'opacity .18s'; bead.style.opacity = '0';
    await frames(reduce ? 40 : 240, p => { tail = p; paint(); });
    Audio.pourEnd();
    body.remove(); shine.remove(); bead.remove(); pool.remove();
    src.style.transition = 'transform .34s cubic-bezier(.3,.6,.3,1)';
    src.style.transform = '';
    await sleep(reduce ? 60 : 340);
    src.classList.remove('pouring');
    src.style.transition = '';
  }

  function splash(x, y, color, w){
    for (let i = 0; i < 4; i++){
      const d = document.createElement('div');
      d.className = 'drop';
      d.style.background = color;
      const s = 2 + Math.random() * 3;
      d.style.width = s + 'px'; d.style.height = (s * 1.3) + 'px';
      d.style.left = (x - s/2) + 'px'; d.style.top = (y - 4) + 'px';
      root.appendChild(d);
      const ux = (Math.random() - 0.5) * w * 1.1, uy = -(8 + Math.random() * 16);
      d.animate([
        { transform:'translate(0,0)', opacity:0.95 },
        { transform:`translate(${ux*0.55}px,${uy}px)`, opacity:0.9, offset:0.4 },
        { transform:`translate(${ux}px,${6 + Math.random()*8}px)`, opacity:0 }
      ], { duration: 420 + Math.random()*180, easing:'cubic-bezier(.3,.5,.5,1)' })
       .onfinish = () => d.remove();
    }
  }

  function seal(i){
    const b = el(i);
    if (!b) return;
    b.querySelector('.plug')?.classList.add('pop');
    b.querySelector('.corktop')?.classList.add('pop');
    setTimeout(() => {
      Audio.cork();
      b.classList.add('thunk');
      if (fluidOn) Fluid.wake();   /* the bounce moves the glass; bring the liquid */
      b.querySelector('.sheen')?.classList.add('run');
      const ring = document.createElement('div');
      ring.className = 'ring';
      b.appendChild(ring);
      setTimeout(() => ring.remove(), 700);
      const r = b.getBoundingClientRect();
      Confetti.burst(r.left + r.width/2, r.top + 6, 14,
        [CONFIG.palette[view[i][0]], '#F7DEB4', '#D8A76D', '#FFFFFF'], 95);
      setTimeout(() => b.classList.remove('thunk'), 520);
    }, reduce ? 40 : 330);
  }

  function nudge(i){
    const b = el(i);
    if (!b) return;
    b.animate([{ transform:'translateX(0)' }, { transform:'translateX(-5px)' },
               { transform:'translateX(5px)' }, { transform:'translateX(0)' }],
              { duration:220, easing:'ease-in-out' });
  }
  return {
    mount(node){
      root = node;
      fx = document.createElementNS(NS, 'svg');
      fx.setAttribute('class', 'fx');
      fluidOn = Fluid.supported();
      if (fluidOn){ Fluid.mount(root); root.classList.add('simulated'); }
    },
    get fluid(){ return fluidOn; },
    get view(){ return view; },
    set view(v){ view = v; },
    get selected(){ return selected; },
    /* lifting a bottle moves its glass, so the liquid has to be told to follow */
    set selected(v){ selected = v; if (fluidOn) Fluid.wake(); },
    set onTap(fn){ onTap = fn; },
    el, render, animate, seal, nudge, reduce
  };
})();
globalThis.Board = Board;


/* ---- 72-fluid.js ---- */
/* The liquid.

   This draws the contents of every bottle onto one canvas behind the glass. It
   is a mask, not a simulation, which is how liquid in a container is normally
   done: the shape of the glass is the clip, and the surface is a line in world
   space. A tilting bottle turns its clip and leaves the line alone, so the
   liquid stays level while the glass rotates, without that having to be
   arranged. See docs/design/06-bottles.md for what this replaced and why.

   Everything follows from the clip. Liquid is only ever drawn through a glass,
   so liquid outside a glass is not a thing this code can express: it is not
   guarded against, it has no representation. */
const Fluid = (() => {
  function supported(){
    try { return !!document.createElement('canvas').getContext('2d'); }
    catch (e) { return false; }
  }

  let root = null, cv = null, ctx = null;
  let W = 0, H = 0, dpr = 1;
  let bottles = [];        /* geometry, measured from the DOM */
  let state = [];          /* per bottle: bands bottom to top, units may be fractional */
  let anim = null;         /* the pour being animated, if any */
  let running = false, raf = 0, last = 0, idle = 0;

  const colorOf = c => CONFIG.palette[c] || '#888';

  function mount(el){
    root = el;
    cv = document.createElement('canvas');
    cv.className = 'fluidLayer';
    ctx = cv.getContext('2d');
  }
  /* render() rebuilds the board with innerHTML, so the canvas is put back as the
     first child: behind the bottles, where the glass and its sheen sit over the
     liquid rather than under it. */
  function attach(){
    if (root && cv.parentNode !== root) root.insertBefore(cv, root.firstChild);
  }

  /* Offsets, not bounding rects: offsets are layout values and ignore
     transforms, so this is the glass at rest even if a bottle is lifted or
     mid-bounce right now. */
  function measure(){
    if (!root) return false;
    attach();
    const box = root.getBoundingClientRect();
    if (box.width < 8 || box.height < 8) return false;
    W = Math.round(box.width);
    H = Math.round(box.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);

    bottles = [];
    root.querySelectorAll('.bottle').forEach((b, i) => {
      const glass = b.querySelector('.glass');
      if (!glass) return;
      const bx = b.offsetLeft, by = b.offsetTop;
      const gx = bx + glass.offsetLeft, gy = by + glass.offsetTop;
      const gw = glass.offsetWidth, gh = glass.offsetHeight;
      const cs = getComputedStyle(glass);
      const r = k => Math.max(0, (parseFloat(cs[k]) || 0) - 1);
      bottles[i] = {
        i, el: b,
        x0: gx + 1, x1: gx + gw - 1,
        yTop: gy + 1, yBot: gy + gh - 1,
        radii: [r('borderTopLeftRadius'), r('borderTopRightRadius'),
                r('borderBottomRightRadius'), r('borderBottomLeftRadius')],
        cx: bx + b.offsetWidth / 2,
        cy: by + b.offsetHeight / 2,
        m: null
      };
    });
    return bottles.length > 0;
  }

  /* Any transform on a bottle moves its glass: pouring tips it, selecting lifts
     it, sealing bounces it. All of them have to move the liquid with it. */
  function readTransforms(){
    for (let i = 0; i < bottles.length; i++){
      const b = bottles[i];
      if (!b || !b.el) continue;
      const t = getComputedStyle(b.el).transform;
      if (!t || t === 'none' || t === 'matrix(1, 0, 0, 1, 0, 0)'){ b.m = null; continue; }
      try { b.m = new DOMMatrixReadOnly(t); } catch (e) { b.m = null; }
    }
  }
  function toWorld(b, x, y){
    if (!b.m) return { x, y };
    const p = b.m.transformPoint(new DOMPoint(x - b.cx, y - b.cy));
    return { x: p.x + b.cx, y: p.y + b.cy };
  }
  const corners = b => [[b.x0, b.yTop], [b.x1, b.yTop], [b.x1, b.yBot], [b.x0, b.yBot]]
    .map(([x, y]) => toWorld(b, x, y));

  /* ---- where the surface sits ----

     For an upright bottle the fill line is simple arithmetic. For a tipped one
     the glass is a rotated quad and the line is still horizontal, so the level
     is whichever height leaves the right *area* underneath it. That is solved by
     bisection: a dozen polygon clips, which is nothing next to what a particle
     solver cost, and it is exact rather than approximated. */
  function polyArea(p){
    let a = 0;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++)
      a += (p[j].x + p[i].x) * (p[j].y - p[i].y);
    return Math.abs(a / 2);
  }
  /* the part of a convex polygon at or below a horizontal line */
  function clipBelow(poly, y){
    const out = [];
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
      const a = poly[j], b = poly[i];
      const ain = a.y >= y, bin = b.y >= y;
      if (ain !== bin){
        const t = (y - a.y) / (b.y - a.y);
        out.push({ x: a.x + (b.x - a.x) * t, y });
      }
      if (bin) out.push(b);
    }
    return out;
  }
  function levelFor(b, quad, frac){
    if (frac <= 0) return b.m ? Math.max(...quad.map(p => p.y)) : b.yBot;
    if (frac >= 1) return b.m ? Math.min(...quad.map(p => p.y)) : b.yTop;
    if (!b.m) return b.yBot - (b.yBot - b.yTop) * frac;      /* upright: no search needed */
    let lo = Math.min(...quad.map(p => p.y)), hi = Math.max(...quad.map(p => p.y));
    const want = polyArea(quad) * frac;
    for (let k = 0; k < 18; k++){
      const mid = (lo + hi) / 2;
      if (polyArea(clipBelow(quad, mid)) > want) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  /* ---- contents ---- */
  const bandsOf = tube => {
    const out = [];
    for (const c of tube){
      const last = out[out.length - 1];
      if (last && last.c === c) last.units++; else out.push({ c, units: 1 });
    }
    return out;
  };
  const clone = bands => bands.map(x => ({ c: x.c, units: x.units }));

  function shrinkTop(bands, amount){
    const out = clone(bands);
    let left = amount;
    for (let i = out.length - 1; i >= 0 && left > 0; i--){
      const take = Math.min(out[i].units, left);
      out[i].units -= take; left -= take;
      if (out[i].units <= 1e-6) out.splice(i, 1);
    }
    return out;
  }
  function growTop(bands, c, amount){
    const out = clone(bands);
    const last = out[out.length - 1];
    if (last && last.c === c) last.units += amount;
    else if (amount > 1e-6) out.push({ c, units: amount });
    return out;
  }

  let retry = 0;
  function sync(view){
    clearTimeout(retry);
    if (!measure()){ retry = setTimeout(() => sync(view), 120); return; }
    state = view.map(bandsOf);
    anim = null;
    readTransforms();
    draw();
  }

  /* ---- drawing ---- */
  function glassPath(b){
    ctx.save();
    if (b.m){
      ctx.translate(b.cx, b.cy);
      ctx.transform(b.m.a, b.m.b, b.m.c, b.m.d, b.m.e, b.m.f);
      ctx.translate(-b.cx, -b.cy);
    }
    const w = b.x1 - b.x0, h = b.yBot - b.yTop;
    if (ctx.roundRect) ctx.roundRect(b.x0, b.yTop, w, h, b.radii);
    else ctx.rect(b.x0, b.yTop, w, h);
    ctx.restore();
  }

  function drawBottle(b, bands){
    if (!b || !bands || !bands.length) return;
    const quad = corners(b);
    ctx.save();
    ctx.beginPath();
    glassPath(b);
    ctx.clip();

    let below = 0;
    bands.forEach(band => {
      const f0 = below / Rules.CAP;
      const f1 = (below + band.units) / Rules.CAP;
      below += band.units;
      const yLo = levelFor(b, quad, f0);
      const yHi = levelFor(b, quad, f1);
      if (yLo - yHi < 0.2) return;
      ctx.fillStyle = colorOf(band.c);
      ctx.fillRect(-4, yHi, W + 8, yLo - yHi);
      /* a brighter line where one liquid meets the next, so the layers read as
         surfaces rather than as stacked blocks */
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(-4, yHi, W + 8, Math.min(2.5, yLo - yHi));
    });

    /* Lit on the left, shaded on the right, only where there is liquid.

       Kept light on purpose. This washes every band with the same warm white and
       the same dark, whatever colour is underneath, so it pulls the whole palette
       toward one muddy brown and colours that are far apart on paper arrive
       looking alike. It was heavy enough to undo a palette chosen for contrast. */
    const g = ctx.createLinearGradient(b.x0, 0, b.x1, 0);
    g.addColorStop(0, 'rgba(28,17,7,.13)');
    g.addColorStop(0.24, 'rgba(255,240,206,.07)');
    g.addColorStop(0.6, 'rgba(255,224,170,.02)');
    g.addColorStop(1, 'rgba(8,5,10,.17)');
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = g;
    ctx.fillRect(-4, 0, W + 8, H);
    ctx.restore();
  }

  function draw(){
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < bottles.length; i++) drawBottle(bottles[i], state[i]);
  }

  /* ---- the pour ----
     One number moving, not a stream: the source's level falls while the target's
     rises. The stream between them is drawn by the scripted ribbon, which is how
     games draw a pour. */
  function transfer(move){
    return new Promise(resolve => {
      const src = bottles[move.from], dst = bottles[move.to];
      if (!src || !dst || !state[move.from]){ resolve(); return; }
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        anim = null;
        resolve();
      };
      anim = {
        from: move.from, to: move.to, c: move.color, n: move.n,
        src: clone(state[move.from]), dst: clone(state[move.to] || []),
        t: 0, dur: 0.16 * move.n + 0.34, done: finish
      };
      /* timers still fire in a tab that is not painting, so a pour cannot hang
         the queue waiting on a frame that never comes */
      const bail = setTimeout(finish, 1200 + 400 * move.n);
      wake();
    });
  }

  function step(dt){
    readTransforms();
    if (!anim) return;
    anim.t += dt;
    const p = Math.min(1, anim.t / anim.dur);
    const moved = anim.n * p;
    state[anim.from] = shrinkTop(anim.src, moved);
    state[anim.to] = growTop(anim.dst, anim.c, moved);
    if (p >= 1){ const fin = anim.done; anim = null; fin(); }
  }

  const anyMoved = () => bottles.some(b => b && b.m);

  function loop(){
    if (!running) return;
    raf = requestAnimationFrame(loop);
    const now = performance.now();
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    step(dt);
    draw();
    if (!anim && !anyMoved()){ if (++idle > 20) stop(); } else idle = 0;
  }
  function wake(){ idle = 0; start(); }
  function start(){ if (running) return; running = true; last = performance.now(); loop(); }
  function stop(){ running = false; cancelAnimationFrame(raf); }

  return {
    supported, mount, sync, transfer, draw, wake,
    resize(){ if (root && bottles.length) measure(); },
    get mounted(){ return !!root; }
  };
})();
globalThis.Fluid = Fluid;


/* ---- 75-confetti.js ---- */
/* Paper bits. Two flavours: a small burst when one bottle is corked, and a
   full screen fall when a level is finished. */
const Confetti = (() => {
  let layer = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ensure = () => (layer = layer || document.getElementById('confetti'));
  return {
    burst(cx, cy, count, palette, power){
      if (reduce || !ensure()) return;
      for (let i = 0; i < count; i++){
        const p = document.createElement('div');
        p.className = 'conf';
        const thin = Math.random() < 0.4;
        p.style.width = (thin ? 3 : 6) + 'px';
        p.style.height = (thin ? 9 : 6) + 'px';
        p.style.background = palette[i % palette.length];
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        const a = -Math.PI/2 + (Math.random() - 0.5) * 1.9;
        const v = power * (0.55 + Math.random() * 0.65);

/* The journey map. Pure geometry lives in MapGeom so it can be tested without
   a browser; MapView only turns those numbers into elements. */
const MapGeom = (() => {
  /* Levels climb from the bottom. x follows a slow sine so the path winds
     without ever leaving the column. */
  const STEP = 0.72;
  function nodes(count, width, opts){
    const o = Object.assign({ spacing:96, margin:52, bottom:90 }, opts || {});
    const amp = Math.max(0, Math.min(width * 0.30, width / 2 - o.margin));
    const cx = width / 2;
    const out = [];
    for (let i = 0; i < count; i++){
      out.push({ level: i + 1, x: cx + Math.sin(i * STEP) * amp, y: o.bottom + i * o.spacing });
    }
    return out;
  }
  const height = (count, opts) => {
    const o = Object.assign({ spacing:96, bottom:90, top:140 }, opts || {});
    return o.bottom + Math.max(0, count - 1) * o.spacing + o.top;
  };
  /* Catmull-Rom through the node centres, converted to cubic beziers */
  function pathThrough(points, flipY){
    if (points.length < 2) return '';
    const P = points.map(p => ({ x: p.x, y: flipY ? flipY - p.y : p.y }));
    let d = `M ${P[0].x.toFixed(1)} ${P[0].y.toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++){
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }
  /* what the player is allowed to see: everything cleared, the frontier, and a
     short glimpse of what is coming */
  /* The lookahead shows what is coming, so it must not show levels that are not
     coming: past the graded range there is nothing to deal. */
  const visibleCount = (unlocked, lookahead, last) => {
    const ahead = unlocked + (lookahead == null ? CONFIG.lookahead : lookahead);
    const cap = Number.isInteger(last) ? last : (Number.isInteger(globalThis.LAST_LEVEL) ? globalThis.LAST_LEVEL : Infinity);
    return Math.min(ahead, cap);
  };
  return { nodes, height, pathThrough, visibleCount, STEP };
})();
globalThis.MapGeom = MapGeom;

const MapView = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let scroll = null, canvas = null, svg = null, road = null, onPick = () => {};
  let onBuy = () => {};
  /* Which locked level the player has tapped once. Paying is two taps, not one:
     a single tap on the thing you cannot play yet should not spend anything. */
  let armed = null;
  const unlockCost = () => CONFIG.economy.attempt * CONFIG.economy.skipMultiple;
  let lastFocus = 1;

  /* The road, laid stone by stone along the very spline the nodes sit on. It is
     sampled from the path itself rather than recomputed, so it cannot drift off
     the medallions, and it is drawn to a canvas inside the scrolling map so it
     travels with them. Strokes alone read as a ribbon; cobbles read as a road. */
  function drawRoad(d, width, H, spacing){
    if (!road) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    road.width = Math.ceil(width * dpr); road.height = Math.ceil(H * dpr);
    road.style.width = width + 'px'; road.style.height = H + 'px';
    const g = road.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.scale(dpr, dpr);
    g.clearRect(0, 0, width, H);

    const shape = new Path2D(d);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#090C05'; g.lineWidth = 60; g.globalAlpha = .75; g.stroke(shape);
    g.strokeStyle = '#1A1F0E'; g.lineWidth = 50; g.globalAlpha = .9;  g.stroke(shape);
    g.strokeStyle = '#2C3018'; g.lineWidth = 43; g.globalAlpha = 1;   g.stroke(shape);

    /* a path element is the only honest way to walk a curve, so borrow one */
    const probe = document.createElementNS(NS, 'path');
    probe.setAttribute('d', d);
    probe.setAttribute('fill', 'none');
    svg.appendChild(probe);
    let len = 0;
    try { len = probe.getTotalLength(); } catch (e) { len = 0; }
    if (!len){ probe.remove(); return; }

    const r = RNG.mulberry32(RNG.hashSeed('road'));
    /* Fade out along the last stretch of the path, not at a fixed height: the
       map scrolls, so an absolute cutoff sits off screen and the road just stops
       dead wherever the ghost points ran out. */
    const FADE_FROM = 0.72;
    const step = 11;
    let row = 0;
    for (let t = 4; t < len; t += step, row++){
      const a = probe.getPointAtLength(t);
      const b = probe.getPointAtLength(Math.min(len, t + 2));
      const tx = b.x - a.x, ty = b.y - a.y;
      const L = Math.hypot(tx, ty) || 1;
      const nx = -ty / L, ny = tx / L;
      const ang = Math.atan2(ty, tx);
      const prog = t / len;
      const fade = prog < FADE_FROM ? 1 : Math.max(0, 1 - (prog - FADE_FROM) / (1 - FADE_FROM));
      if (fade <= 0.02) continue;

      const cols = 4;
      for (let c = 0; c < cols; c++){
        const jitter = (r() - 0.5) * 3.4;
        const off = ((c + 0.5) / cols - 0.5) * 38 + (row % 2 ? 4.4 : -4.4) + jitter;
        const x = a.x + nx * off, y = a.y + ny * off;
        const w = 9 + r() * 4.5, h = 7.5 + r() * 3;
        const lum = 26 + r() * 18;
        g.save();
        g.translate(x, y);
        g.rotate(ang + (r() - 0.5) * 0.35);
        g.globalAlpha = fade * (0.82 + r() * 0.18);
        g.fillStyle = `hsl(${58 + r() * 26},${9 + r() * 12}%,${lum}%)`;
        g.beginPath();
        if (g.roundRect) g.roundRect(-w / 2, -h / 2, w, h, 2.6 + r() * 1.6);
        else g.rect(-w / 2, -h / 2, w, h);
        g.fill();
        g.globalAlpha = fade * 0.16;                 /* a lit top edge on each */
        g.fillStyle = '#F2E8C8';
        g.fillRect(-w / 2 + 1, -h / 2, w - 2, 1.1);
        g.globalAlpha = fade * 0.22;                 /* and a seam under it */
        g.fillStyle = '#05070 3'.replace(' ', '');
        g.fillRect(-w / 2, h / 2 - 1, w, 1.1);
        g.restore();
      }

      /* moss creeping in from the verges, and the odd loose pebble */
      if (row % 3 === 0){
        for (const side of [-1, 1]){
          const off = side * (20 + r() * 7);
          const x = a.x + nx * off, y = a.y + ny * off;
          g.globalAlpha = fade * (0.22 + r() * 0.3);
          g.fillStyle = `hsl(${72 + r() * 24},${18 + r() * 16}%,${11 + r() * 9}%)`;
          g.beginPath();
          g.ellipse(x, y, 5 + r() * 7, 3 + r() * 4, r() * 3.14, 0, 6.283);
          g.fill();
        }
      }
      if (r() < 0.16){
        const off = (r() - 0.5) * 54;
        g.globalAlpha = fade * 0.5;
        g.fillStyle = `hsl(64,10%,${30 + r() * 14}%)`;
        g.beginPath();
        g.ellipse(a.x + nx * off, a.y + ny * off, 1.6 + r() * 2, 1.2 + r() * 1.6, 0, 0, 6.283);
        g.fill();
      }
      g.globalAlpha = 1;
    }
    probe.remove();

    /* Erase the far end so the bed goes with its stones. Fading the stones alone
       left the earth under them ending in a hard cap, which read as the road
       having been cut off rather than running out of sight. */
    g.globalCompositeOperation = 'destination-out';
    const out = g.createLinearGradient(0, 0, 0, H * 0.34);
    out.addColorStop(0, 'rgba(0,0,0,1)');
    out.addColorStop(0.55, 'rgba(0,0,0,.55)');
    out.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = out;
    g.fillRect(0, 0, width, H * 0.34);
    g.globalCompositeOperation = 'source-over';
  }

  function starRow(n){
    return `<span class="ns">${[0,1,2].map(i => i < n ? '★' : '<i>★</i>').join('')}</span>`;
  }
  function render(progress){
    const unlocked = progress.unlocked;
    const count = MapGeom.visibleCount(unlocked);
    const width = scroll.clientWidth || 360;
    const opts = { spacing: Math.min(104, Math.max(80, scroll.clientHeight / 5.4)) };
    const pts = MapGeom.nodes(count + 3, width, opts);   // 3 ghost points continue the path
    const H = MapGeom.height(count + 3, opts);
    canvas.style.height = H + 'px';

    svg.setAttribute('width', width);
    svg.setAttribute('height', H);
    /* A road, laid along the very spline the nodes sit on, so it cannot drift
       off them the way a painted one did. Built up in strokes: a bed of earth,
       the stone surface, a lit crown, then dashes across it for cobbles. */
    const d = MapGeom.pathThrough(pts, H);
    const fade = `${(count / (count + 3)).toFixed(2)}`;
    svg.innerHTML = `
      <defs>
        <linearGradient id="pathFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E0B15C" stop-opacity=".55"/>
          <stop offset="${fade}" stop-color="#E0B15C" stop-opacity=".28"/>
          <stop offset="1" stop-color="#E0B15C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${d}" fill="none" stroke="url(#pathFade)"
            stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>`;

    drawRoad(d, width, H, opts.spacing);

    canvas.querySelectorAll('.node,.chapter').forEach(n => n.remove());

    for (let i = 0; i < count; i++){
      const p = pts[i], level = p.level;
      if (Levels.isSectionStart(level)){
        const tag = document.createElement('div');
        tag.className = 'chapter';
        tag.style.bottom = (p.y + 46) + 'px';
        tag.style.setProperty('--tint', Levels.sectionTint(level));
        tag.innerHTML = `<span>${Levels.sectionName(level)}</span>`;
        canvas.appendChild(tag);
      }
      const stars = progress.starsFor(level);
      const cleared = stars > 0;
      const current = level === unlocked;
      const locked = level > unlocked;
      /* Only the very next one can be bought. Paying past a board you have not
         beaten is a way through, not a way to skip the game. */
      const last = Number.isInteger(globalThis.LAST_LEVEL) ? globalThis.LAST_LEVEL : Infinity;
      const buyable = locked && level === unlocked + 1 && level <= last;
      const cost = unlockCost();
      const affordable = progress.canAfford(cost);
      const isArmed = buyable && armed === level;

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'node' + (cleared ? ' cleared' : '') + (current ? ' current' : '')
        + (locked ? ' locked' : '') + (buyable ? ' buyable' : '') + (isArmed ? ' armed' : '');
      b.style.left = p.x + 'px';
      b.style.bottom = p.y + 'px';
      b.style.setProperty('--tint', Levels.sectionTint(level));
      b.dataset.level = level;
      b.disabled = locked && (!buyable || !affordable);
      b.setAttribute('aria-label',
        buyable ? `Level ${level}, locked. Open it for ${cost} gold`
        : locked ? `Level ${level}, locked`
        : `Level ${level}${cleared ? `, ${stars} of 3 stars` : ''}`);
      b.innerHTML = isArmed
        ? `<span class="num">${cost}</span><span class="ns buy">Open?</span>`
        : buyable ? `<span class="num">&#128274;</span><span class="ns buy">${cost} &#9670;</span>`
        : locked ? '<span class="num">&#128274;</span>'
        : `<span class="num">${level}</span>${cleared ? starRow(stars) : ''}`;
      if (buyable){
        b.addEventListener('click', () => {
          if (armed !== level){ armed = level; render(progress); return; }
          armed = null;
          onBuy(level);
        });
      } else if (!locked){
        b.addEventListener('click', () => { armed = null; onPick(level); });
      }
      canvas.appendChild(b);
    }
    document.getElementById('mapStars').textContent = progress.totalStars();
    document.getElementById('mapChapter').textContent = Levels.sectionName(unlocked);
    lastFocus = unlocked;
  }
  function scrollToCurrent(smooth){
    const node = canvas.querySelector(`.node[data-level="${lastFocus}"]`);
    if (!node) return;
    const target = node.offsetTop - scroll.clientHeight * 0.58 + node.offsetHeight;
    scroll.scrollTo({ top: Math.max(0, target), behavior: smooth ? 'smooth' : 'auto' });
  }
  return {
    mount(scrollEl){
      scroll = scrollEl;
      canvas = scrollEl.querySelector('.mapCanvas');
      road = document.createElement('canvas');
      road.className = 'mapRoad';
      canvas.appendChild(road);
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'mapPath');
      canvas.appendChild(svg);
    },
    set onPick(fn){ onPick = fn; },
    set onBuy(fn){ onBuy = fn; },
    render, scrollToCurrent
  };
})();
globalThis.MapView = MapView;


/* ---- 90-app.js ---- */
/* Glue: routing between the map and a level, the move queue, and the win flow. */
const App = (() => {
  const progress = Progress.createProgress();
  const S = {
    level: 1, tubes: [], moves: 0,
    history: [], queue: [], running: false,
    par: null, parExact: false, parRequest: 0,
    undosUsed: 0, vesselUsed: false, over: false, reason: null
  };
  const $ = id => document.getElementById(id);

  /* ---------- routing ---------- */
  /* The stylesheets colour bands with var(--cN), the pour and the particle sim
     read CONFIG.palette. Publishing one from the other keeps a single source:
     when the palette moved to jewel tones and the CSS did not, the sim poured
     the old colours into the new bottles. */
  function publishPalette(){
    const s = document.documentElement.style;
    CONFIG.palette.forEach((hex, i) => s.setProperty(`--c${i}`, hex));
  }

  /* A new build is waiting. Reloading is the only way to pick it up, but doing
     it under someone mid-pour would lose their level, so it waits for a moment
     that costs nothing: on the map, with nothing animating. Progress is saved
     per level, so nothing is lost by then. */
  let updatePending = false;
  /* a resize that arrived while the board was mid pour, applied once it lands */
  let missedResize = false;
  function takeUpdate(){
    if (!updatePending) return;
    if (document.body.dataset.view !== 'map') return;
    if (S.running || S.queue.length) return;
    location.reload();
  }

  /* local calendar day, so the draught refreshes on the player's midnight */
  function today(){
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function paintMap(){
    $('mapGold').textContent = progress.gold;
    const ready = progress.dailyReady(today());
    $('daily').disabled = !ready;
    $('dailyCost').textContent = ready ? `+${CONFIG.economy.daily}` : 'drawn';
    /* a board costs gold to deal, so the map has to say so and stop offering one
       that cannot be paid for */
    const fee = CONFIG.economy.attempt;
    $('playCost').textContent = fee;
    $('mapPlay').disabled = !progress.canAfford(fee);
  }
  function showMap(scrollSmooth){
    document.body.dataset.view = 'map';
    Backdrop.kind = 'moss';
    Backdrop.setShelf(null);
    MapView.render(progress);
    MapView.scrollToCurrent(!!scrollSmooth);
    paintMap();
    takeUpdate();
  }
  /* Every board dealt is paid for, whether it is a new level or another go at
     one just lost. Charging here rather than inside start() keeps the internal
     re-deals free: only a deliberate attempt costs. */
  function attempt(level, keepVessel){
    if (!progress.spend(CONFIG.economy.attempt)){ Audio.deny(); paintMap(); return false; }
    document.body.dataset.view = 'game';
    Backdrop.kind = 'cellar';
    start(level, keepVessel);
    return true;
  }
  function showGame(level){ attempt(level); }
  const skipCost = () => CONFIG.economy.attempt * CONFIG.economy.skipMultiple;

  /* ---------- a level ---------- */
  /* A restart deals the level from scratch, and that includes the extra bottle:
     restarting is starting again, and a board that quietly keeps a vessel is not
     the board the level is. The purchase is not refunded, because a restart is
     not an undo. Nothing is laundered by this either, since a run that ever had
     a vessel is capped at two stars whether or not it still has one. */
  function start(level, keepVessel){
    S.level = level;
    S.tubes = Levels.make(level);
    if (keepVessel) S.tubes.push([]);
    S.vesselUsed = !!keepVessel;
    S.undosUsed = 0;
    S.over = false;
    S.reason = null;
    S.moves = 0;
    S.history = [];
    S.queue = [];
    S.running = false;
    /* the baked table is exact, and so is anything progress kept */
    S.par = PARS[level] ?? progress.parFor(level);
    S.parExact = S.par != null;
    /* A par belongs to a particular board. minPours can never overstate the work
       a board has left, so a par below it cannot be this board's, and scoring
       against it would hand out three stars and a payout for a run that never
       happened. Refuse the number rather than the run: an unknown par shows a
       tilde and decides nothing. */
    if (S.parExact && S.par < Rules.minPours(S.tubes)){
      S.par = null;
      S.parExact = false;
    }
    Board.view = Rules.clone(S.tubes);
    Board.selected = null;
    $('veil').classList.remove('show');
    Board.render();
    paintHud();
    if (S.par == null) askPar();
  }
  function askPar(){
    const id = ++S.parRequest;
    const level = S.level;
    $('pourLabel').textContent = 'Reading the board…';
    SolverClient.solve(S.tubes, Levels.shape(level).colors, res => {
      if (id !== S.parRequest) return;
      S.par = res.par;
      S.parExact = !!res.exact;
      progress.rememberPar(level, res.par, res.exact);
      paintHud();
    });
  }
  const poursLeft = () => Rules.poursLeft(S.moves, S.par, S.parExact);

  const undoIsFree = () => S.undosUsed < CONFIG.economy.freeUndos;
  const undoPrice = () => (undoIsFree() ? 0 : CONFIG.economy.undoCost);

  function paintHud(){
    const busy = S.queue.length > 0 || S.running;
    $('statLevel').textContent = S.level;

    /* You start on three stars and spend them, so the stars say what the run is
       still worth while the count says how much of it is left. */
    const stars = Rules.rate(S.moves, S.par, S.parExact, S.vesselUsed);
    $('statStars').innerHTML = [0,1,2]
      .map(i => (i < stars ? '★' : '<span class="dim">★</span>')).join('');
    $('movesStat').classList.toggle('over', stars <= 1);
    $('movesStat').classList.toggle('spent', stars === 0);

    /* One falling number rather than a count of what has been spent. It is the
       number that ends the run, and past par it is also the star count, so the
       two read as the same thing running out. */
    const left = poursLeft();
    $('statLeft').textContent = left == null ? S.moves : left;
    $('pourLabel').textContent =
      left == null ? 'pours made'
      : left === 0 ? 'no pours left'
      : left === 1 ? 'last pour'
      : 'pours left';
    $('gold').textContent = progress.gold;

    const freeLeft = Math.max(0, CONFIG.economy.freeUndos - S.undosUsed);
    $('undoCost').textContent = freeLeft ? `${freeLeft} free` : `${CONFIG.economy.undoCost}`;
    $('undo').disabled = !S.history.length || busy ||
      (!undoIsFree() && !progress.canAfford(CONFIG.economy.undoCost));

    $('vesselCost').textContent = CONFIG.economy.vessel;
    $('vessel').disabled = busy || S.vesselUsed || !progress.canAfford(CONFIG.economy.vessel);
    $('vessel').classList.toggle('spent', S.vesselUsed);

    $('restart').disabled = (!S.history.length && !S.moves) || busy;
  }

  /* ---------- input ---------- */
  /* Logic resolves on tap. Animation trails behind in a queue, so a player can
     keep pouring without waiting for the bottle to finish tipping. */
  /* a bottle worth picking up: it has something in it and is not already done */
  const canLift = i => S.tubes[i].length > 0 && !Rules.isFull(S.tubes[i]);

  function lift(i){
    Board.selected = i;
    Board.el(i)?.classList.add('lifted');
    Audio.lift();
  }
  function drop(){
    if (Board.selected != null) Board.el(Board.selected)?.classList.remove('lifted');
    Board.selected = null;
  }

  function tap(i){
    if (S.over) return;                 /* the run is decided; stop taking pours */
    Audio.unlock();
    const sel = Board.selected;
    if (sel === null){
      if (!canLift(i)){ Board.nudge(i); Audio.deny(); return; }
      lift(i);
      return;
    }
    if (sel === i){ drop(); Audio.drop(); return; }
    if (Rules.canPour(S.tubes, sel, i)){
      drop();
      commit(sel, i);
      return;
    }
    /* The pour will not go: the target is full, or finished, or the colours do
       not meet. Rather than making the player tap twice to put one bottle down
       and pick the next one up, the tap is taken as picking that one up, which
       is what someone reaching for it meant. Only if it is not worth picking up
       does the selection simply end. */
    drop();
    if (canLift(i)){ lift(i); return; }
    Board.nudge(i);
    Audio.deny();
  }
  function commit(from, to){
    const move = { from, to, n: Rules.pourAmount(S.tubes, from, to), color: S.tubes[from][S.tubes[from].length - 1] };
    S.history.push({ tubes: Rules.clone(S.tubes), moves: S.moves });
    Rules.applyMove(S.tubes, move);
    S.moves++;
    /* Decided here, not when the queue happens to empty. Pouring quickly keeps
       the queue full, and a check that waits for it to drain lets the run carry
       on well past the pour that already lost it. */
    const why = Rules.lostBecause(S.tubes, S.moves, S.par, S.parExact);
    if (why){ S.over = true; S.reason = why; }
    S.queue.push(move);
    paintHud();
    drain().catch(() => {});   /* drain's finally has already restored the state */
  }
  /* The view trails the logic here, so this loop owes the player two things: it
     must always let go of `running`, and it must always leave the view where the
     logic already is. Undo and Restart are disabled while a pour is in flight,
     so a drain that dies halfway strands the level with no way out but a reload. */
  async function drain(){
    if (S.running) return;
    S.running = true;
    try {
      while (S.queue.length){
        const move = S.queue.shift();
        try {
          await Board.animate(move);
        } catch {
          /* a dropped animation still owes the board its result */
        }
        Rules.applyMove(Board.view, move);
        Board.render();
        if (Rules.isFull(Board.view[move.to])) Board.seal(move.to);
      }
    } finally {
      S.running = false;
      paintHud();
    }
    /* the pours have landed, so a resize held back during them can be applied */
    if (missedResize){
      missedResize = false;
      try { Board.render(); } catch { /* a failed redraw must not eat the result */ }
    }
    /* the board has stopped moving, so whatever was decided can now be shown */
    if (Rules.isSolved(S.tubes) || S.over) finish();
  }

  /* ---------- finishing ---------- */
  function finish(){
    const stars = Rules.rate(S.moves, S.par, S.parExact, S.vesselUsed);
    const before = progress.starsFor(S.level);
    const result = progress.complete(S.level, S.moves, stars);
    const perfect = stars === 3;
    const failed = stars === 0;

    $('stars').innerHTML = [0,1,2].map(i => i < stars ? '★' : '<span class="dim">★</span>').join('');

    /* say where the gold came from, so the thin payouts read as earned */
    const parts = [`${stars}★`];
    if (result.firstClear) parts.push('first clear');
    $('goldEarned').textContent = `+${result.earned}`;
    $('goldWhy').textContent = failed ? 'No gold · run failed' : `Gold · ${parts.join(' + ')}`;

    const fee = CONFIG.economy.attempt;
    const panel = Panel.decide({
      level: S.level, lastLevel: progress.lastLevel, failed, stars,
      nextUnlocked: progress.isUnlocked(S.level + 1),
      canPayFee: progress.canAfford(fee), canPaySkip: progress.canAfford(skipCost()),
      improvedStars: result.improvedStars, hadStars: before,
      par: S.par, parExact: S.parExact, moves: S.moves, best: progress.bestFor(S.level),
      totalStars: progress.totalStars(), reason: S.reason
    });
    $('winTitle').textContent = panel.title;
    $('winLine').textContent = panel.line;

    $('veil').classList.toggle('failed', failed);
    $('retry').hidden = panel.retryHidden;
    $('retry').innerHTML = panel.retryHidden ? 'Retry' : `Try again<small>${fee} &#9670;</small>`;
    $('retry').classList.toggle('priced', true);
    $('retry').classList.toggle('primary', panel.retryPrimary);
    $('retry').disabled = panel.retryDisabled;
    $('next').hidden = panel.nextHidden;
    $('next').classList.toggle('primary', panel.nextPrimary);
    $('next').disabled = panel.nextDisabled;
    /* Beaten by a board is not the same as stuck on it. Paying past it opens the
       next one and deals it, so a level nobody can crack is a decision with a
       price rather than a wall. */
    $('skip').hidden = panel.skipHidden;
    $('skipCost').textContent = skipCost();
    $('skip').disabled = panel.skipDisabled;
    $('winHint').textContent = panel.hint;

    setTimeout(() => {
      if (failed){
        Audio.deny();
        Board.nudge(S.level % Math.max(1, S.tubes.length));   /* the shelf takes it too */
      } else {
        Audio.win();
        Confetti.rain(CONFIG.palette.slice(0, Levels.shape(S.level).colors));
      }
      $('veil').classList.add('show');
    }, failed ? 260 : 700);
  }

  /* ---------- wiring ---------- */
  function paintSound(on){
    document.querySelectorAll('.js-sound').forEach(b => {
      b.textContent = on ? 'Sound on' : 'Sound off';
      b.classList.toggle('off', !on);
    });
  }
  function bind(){
    Board.mount($('board'));
    Board.onTap = tap;
    MapView.mount($('mapScroll'));
    MapView.onPick = level => { Audio.unlock(); Audio.tick(); showGame(level); };
    /* Paying past a board from the map opens the next one and nothing else: no
       stars, no best, and the first-clear bonus stays unclaimed, so coming back
       and actually beating it still pays what it always would have. */
    MapView.onBuy = level => {
      Audio.unlock();
      if (!progress.buyUnlock(level - 1, skipCost())){ Audio.deny(); return; }
      Audio.tick();
      paintMap();
      MapView.render(progress);
    };

    $('undo').onclick = () => {
      if (S.queue.length || S.running || !S.history.length) return;
      /* charge before rolling back, so a refused payment changes nothing */
      if (!undoIsFree() && !progress.spend(CONFIG.economy.undoCost)){ Audio.deny(); return; }
      S.undosUsed++;
      const prev = S.history.pop();
      S.tubes = prev.tubes;
      S.moves = prev.moves;
      Board.view = Rules.clone(prev.tubes);
      Board.selected = null;
      Audio.drop();
      Board.render();
      paintHud();
    };
    $('vessel').onclick = () => {
      if (S.queue.length || S.running || S.vesselUsed) return;
      if (!progress.spend(CONFIG.economy.vessel)){ Audio.deny(); return; }
      S.vesselUsed = true;
      S.tubes.push([]);
      Board.view.push([]);
      /* the shelf changed shape, so the snapshots behind us no longer describe
         this board and undoing into one would quietly take the vessel back */
      S.history = [];
      Board.selected = null;
      Audio.lift();
      Board.render();
      paintHud();
    };
    $('restart').onclick = () => {
      if (S.queue.length || S.running) return;
      attempt(S.level);
    };
    $('toMap').onclick = () => { Audio.tick(); showMap(false); };
    const closePanel = () => {
      $('veil').classList.remove('show');
      $('veil').classList.remove('failed');
      showMap(true);
    };
    $('winMap').onclick = closePanel;
    /* Tapping the dark outside the panel does what the panel's own way out does.
       Only the backdrop itself counts, so a tap that lands on the panel or on a
       button inside it is not a tap outside. */
    $('veil').addEventListener('click', e => {
      if (e.target === $('veil')) closePanel();
    });
    $('retry').onclick = () => {
      if (!progress.canAfford(CONFIG.economy.attempt)){ Audio.deny(); return; }
      $('veil').classList.remove('show');
      $('veil').classList.remove('failed');
      attempt(S.level);
    };
    $('skip').onclick = () => {
      if (!progress.buyUnlock(S.level, skipCost())){ Audio.deny(); return; }
      $('veil').classList.remove('show', 'failed');
      /* the fee covered the board too, so this deals it without charging again */
      document.body.dataset.view = 'game';
      Backdrop.kind = 'cellar';
      start(Math.min(S.level + 1, progress.lastLevel));
    };
    $('next').onclick = () => {
      if (S.level >= progress.lastLevel){ Audio.deny(); return; }
      if (!progress.canAfford(CONFIG.economy.attempt)){ Audio.deny(); return; }
      $('veil').classList.remove('show');
      showGame(S.level + 1);
    };
    document.querySelectorAll('.js-sound').forEach(btn => {
      btn.onclick = () => {
        Audio.unlock();
        paintSound(Audio.toggle());
        progress.setSound(Audio.enabled);
        if (Audio.enabled) Audio.lift();
      };
    });
    $('mapPlay').onclick = () => { Audio.unlock(); showGame(Math.min(progress.unlocked, progress.lastLevel)); };
    $('daily').onclick = () => {
      Audio.unlock();
      if (!progress.claimDaily(today())){ Audio.deny(); return; }
      Audio.lift();
      paintMap();
    };

    /* A resize while a pour is in flight cannot rebuild the board: render() wipes
       the bottles and would strand the animation mid air. Dropping it is worse
       though, because nothing brings it back: the glass re-centres by itself in
       CSS while the liquid keeps the geometry it measured before, so the two come
       apart and stay apart. So remember it and apply it once the pours land. */
    let rt;
    const relayout = () => {
      if (document.body.dataset.view === 'map') MapView.render(progress);
      else Board.render();
    };
    const onResize = () => {
      if (document.body.dataset.view !== 'map' && (S.running || S.queue.length)){
        missedResize = true;
        return;
      }
      relayout();
    };
    const scheduleResize = () => { clearTimeout(rt); rt = setTimeout(onResize, 120); };
    addEventListener('resize', scheduleResize);
    /* some browsers rotate without firing resize */
    addEventListener('orientationchange', scheduleResize);
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.dataset.view === 'game') showMap(false);
    });
  }
  return {
    boot(){
      publishPalette();
      Backdrop.mount();
      bind();
      Audio.setEnabled(progress.sound);
      paintSound(progress.sound);
      showMap(false);
    },
    /* a newer build has taken over the page */
    updateReady(){ updatePending = true; takeUpdate(); },
    /* exposed for debugging in the console */
    _state: S, _progress: progress
  };
})();
globalThis.App = App;
document.addEventListener('DOMContentLoaded', () => App.boot());


/* ---- 95-pwa.js ---- */
/* Install prompt and service worker registration. */
(() => {
  let deferred = null;
  const btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (btn) btn.hidden = false;
  });
  if (btn){
    btn.onclick = async () => {
      if (!deferred) return;
      btn.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
  }
  addEventListener('appinstalled', () => { if (btn) btn.hidden = true; deferred = null; });
  /* Picking up a new build.

     Revalidating the page only helps someone who navigates. A tab that is
     already open never navigates again, so without this it runs whatever build
     it started with for as long as it stays open, which is how a fix can be
     live and invisible at the same time.

     So the worker is asked for a new build periodically and whenever the tab
     comes back to the front, and when one takes over, the page reloads itself.
     Not mid-pour though: App decides when that is polite. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    addEventListener('load', async () => {
      let reg = null;
      try { reg = await navigator.serviceWorker.register('./sw.js'); } catch (e) { return; }

      const check = () => { try { reg.update(); } catch (e) {} };
      setInterval(check, 5 * 60 * 1000);
      addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      addEventListener('focus', check);
      addEventListener('online', check);

      /* A page that starts uncontrolled gets claimed once as its worker installs.
         That first claim is an install, not an update, and must not reload. What
         it must not do either is disqualify the tab forever: tracking the
         controller rather than remembering a flag from load time means the
         second change is still recognised as the update it is. */
      let controller = navigator.serviceWorker.controller;
      let taken = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        const had = controller;
        controller = navigator.serviceWorker.controller;
        if (!had || taken) return;
        taken = true;
        App.updateReady();
      });
    });
  }
})();
</script>
