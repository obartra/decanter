<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decanter</title>
<meta name="theme-color" content="#1A120A">
<meta name="color-scheme" content="dark">
<meta name="description" content="A water sorting puzzle. Pour until every bottle holds one color.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decanter">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 700;font-display:swap;src:url(./fonts/cinzel.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/alegreyasans.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/alegreyasans-bold.woff2) format('woff2')}
</style>
<style>
:root{--art-map:url(./art/map.webp);--art-board:url(./art/board.webp);--art-win:url(./art/win.webp)}
</style>
<style>:root{
  --ink:#EFE4D2; --ink-dim:#A2907A;
  --gold:#E0B15C; --gold-lit:#F4D9A0;
  --glass-line:rgba(238,224,200,.28);
  /* --c0..--c11 are published from CONFIG.palette at boot, see 90-app.js */
  --bw:52px; --bh:calc(var(--bw)*3.3); --cap-h:calc(var(--bw)*.26);
  --cols:3; --units:4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Alegreya Sans",ui-sans-serif,system-ui,sans-serif;
  color:var(--ink); background:#0B0805;
  background-size:cover; background-position:center top; background-repeat:no-repeat;
  background-attachment:fixed; -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* Each view stands in its own corner of the cellar. The scrim is what keeps the
   HUD readable over painted art that was never designed to sit behind text. */
body[data-view="map"]{
  background-image:linear-gradient(180deg,rgba(11,8,5,.82) 0%,rgba(11,8,5,.34) 26%,rgba(11,8,5,.72) 100%), var(--art-map);
}
body[data-view="game"]{
  background-image:linear-gradient(180deg,rgba(11,8,5,.78) 0%,rgba(11,8,5,.20) 30%,rgba(11,8,5,.55) 100%), var(--art-board);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.35; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
}
.view{
  position:relative; z-index:1; height:100dvh; display:none;
  flex-direction:column; align-items:center;
  padding:clamp(10px,2.4vw,20px) 12px calc(12px + env(safe-area-inset-bottom));
  gap:clamp(8px,1.7vh,16px);
}
body[data-view="map"] #mapView,
body[data-view="game"] #gameView{display:flex}

.eyebrow{font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 3px}
/* Cinzel is inscriptional Roman caps, so it wants to be spaced out, not tightened */
.wordmark{
  font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(22px,5.4vw,33px); letter-spacing:.07em; line-height:1; margin:0;
  text-transform:uppercase;
  background:linear-gradient(180deg,#FBEBC8 0%, var(--gold) 52%, #A9762F 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 14px rgba(224,177,92,.28));
}
.wordmark.small{font-size:clamp(18px,4.6vw,24px)}

.btn{
  font-family:inherit; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink); padding:10px 15px; border-radius:999px;
  border:1px solid rgba(224,177,92,.26);
  background:linear-gradient(180deg,rgba(60,44,26,.62),rgba(24,17,10,.52));
  backdrop-filter:blur(5px);
  cursor:pointer; transition:transform .15s, border-color .2s, opacity .2s;
}
.btn:hover{border-color:rgba(244,217,160,.55); transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.3; cursor:default; transform:none}
.btn.off{opacity:.45}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-dim)}
.btn.primary{border-color:rgba(250,232,190,.5); color:#2A1B08;
  background:linear-gradient(180deg,#F6E0B0,var(--gold) 60%,#B8823A);
  box-shadow:0 6px 22px rgba(224,177,92,.35)}
.controls{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}

#confetti{position:fixed; inset:0; z-index:95; pointer-events:none; overflow:hidden}
.conf{position:absolute; border-radius:1px; will-change:transform}

.veil{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:24px;
  background:linear-gradient(180deg,rgba(11,8,5,.86),rgba(11,8,5,.92)), var(--art-win);
  background-size:cover; background-position:center;
  backdrop-filter:blur(7px); opacity:0; pointer-events:none; transition:opacity .4s ease;
}
.veil.show{opacity:1; pointer-events:auto}
.panel{
  text-align:center; max-width:340px; padding:28px 26px; border-radius:24px;
  border:1px solid rgba(224,177,92,.28);
  background:linear-gradient(180deg,rgba(46,33,19,.86),rgba(18,13,8,.82));
  backdrop-filter:blur(8px); box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.97); transition:transform .45s cubic-bezier(.2,1.2,.4,1);
}
.veil.show .panel{transform:none}
.panel h2{font-family:"Cinzel",serif; font-weight:700; font-size:26px; margin:0 0 8px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--gold-lit)}
.stars{font-size:26px; letter-spacing:6px; margin:2px 0 10px; color:var(--gold-lit)}
.stars .dim{color:rgba(239,228,210,.16)}
.panel p{color:var(--ink-dim); font-size:13px; line-height:1.6; margin:0 0 6px}
.panel .hint{color:var(--gold); font-size:11px; letter-spacing:.04em; min-height:16px; margin-bottom:16px}
.panelBtns{display:flex; gap:8px; justify-content:center; margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.08s !important}}

.board{
  position:relative; display:grid;
  grid-template-columns:repeat(var(--cols), var(--bw));
  justify-content:center; align-content:center; place-items:center;
  flex:1; width:100%; min-height:0;
}
.fx{position:absolute; inset:0; z-index:52; pointer-events:none; overflow:visible}

.bottle{
  -webkit-appearance:none; appearance:none; border:0; padding:0; background:none;
  position:relative; width:var(--bw); height:calc(var(--bh) + var(--cap-h));
  cursor:pointer; transform-origin:50% 50%;
  transition:transform .3s cubic-bezier(.4,.1,.3,1);
  will-change:transform; touch-action:manipulation;
}
.bottle:focus-visible{outline:none}
.bottle:focus-visible .glass{box-shadow:0 0 0 2px #fff, 0 0 26px rgba(232,190,110,.55)}
.bottle.lifted{transform:translateY(-20px)}
.bottle.pouring{z-index:60}
.bottle.thunk{animation:thunk .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes thunk{0%{transform:translateY(-5px)}40%{transform:translateY(3px) scaleY(.98)}
  70%{transform:translateY(-1px)}100%{transform:translateY(0)}}

.collar{
  position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:4;
  width:44%; height:calc(var(--cap-h) + 2px); border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#8A7247 0%,#4E3D22 42%,#291F10 100%);
  box-shadow:inset 0 1px 0 rgba(246,226,182,.5), inset -2px 0 3px rgba(0,0,0,.4);
}
.collar::after{content:""; position:absolute; left:14%; top:12%; width:16%; height:70%;
  border-radius:3px; background:rgba(255,255,255,.30)}

.glass{
  position:absolute; left:0; right:0; bottom:0; height:var(--bh);
  border-radius:calc(var(--bw)*.30) calc(var(--bw)*.30) calc(var(--bw)*.17) calc(var(--bw)*.17);
  overflow:hidden;
  background:linear-gradient(180deg, rgba(38,29,18,.5), rgba(14,10,6,.68));
  box-shadow:inset 0 0 0 1.5px var(--glass-line), inset 0 6px 14px rgba(255,225,170,.08),
             0 10px 24px rgba(0,0,0,.5), 0 0 20px rgba(224,177,92,.10);
  transition:box-shadow .4s ease;
}
.fill{position:absolute; inset:0; display:flex; flex-direction:column-reverse}
.band{width:100%; flex:0 0 auto; transition:height .2s ease}
.band.crest{box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 7px 10px rgba(255,255,255,.09)}
.gloss{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  background:linear-gradient(96deg, rgba(255,255,255,0) 0 5%, rgba(255,255,255,.32) 5% 12%,
    rgba(255,255,255,.06) 12% 19%, rgba(255,255,255,0) 19% 74%,
    rgba(255,255,255,.13) 74% 80%, rgba(255,255,255,0) 80% 100%);
}
.gloss::after{content:""; position:absolute; left:6%; top:1.5%; width:52%; height:9%; border-radius:50%;
  background:radial-gradient(ellipse at 35% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%)}
.sheen{
  position:absolute; top:-10%; bottom:-10%; width:62%; left:-95%; z-index:7;
  pointer-events:none; transform:skewX(-14deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
}
.sheen.run{animation:sheen .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sheen{to{left:135%}}

/* cork: the plug is inside the neck, clipped by the glass */
.bottle.done .glass{
  box-shadow:inset 0 0 0 1.5px rgba(252,238,208,.8), inset 0 6px 14px rgba(255,226,170,.18),
             0 10px 24px rgba(0,0,0,.5), 0 0 32px rgba(232,190,110,.45);
}
.plug{
  position:absolute; left:50%; top:0; z-index:5;
  width:46%; height:calc(var(--bw)*.52);
  transform:translateX(-50%);
  clip-path:polygon(3% 0, 97% 0, 86% 82%, 78% 100%, 22% 100%, 14% 82%);
  background:
    repeating-linear-gradient(88deg, rgba(108,62,22,.18) 0 1px, rgba(255,238,210,.06) 1px 5px),
    linear-gradient(180deg,#EFCC9C 0%, #C99A5C 42%, #8F6231 100%);
  box-shadow:inset 0 -7px 9px rgba(70,38,10,.5), inset 0 2px 0 rgba(255,246,228,.55);
}
.plug::after{content:""; position:absolute; left:-40%; right:-40%; top:98%; height:12px;
  background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.5), rgba(0,0,0,0) 72%)}
.corktop{
  position:absolute; left:50%; top:calc(var(--bw)*-0.07); z-index:5;
  width:52%; height:calc(var(--bw)*.20);
  transform:translateX(-50%); border-radius:5px 5px 2px 2px;
  background:
    repeating-linear-gradient(87deg, rgba(108,62,22,.14) 0 1px, rgba(255,240,215,.07) 1px 4px),
    linear-gradient(180deg,#F7DEB4 0%, #D8A76D 62%, #B9884C 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,250,238,.95), 0 3px 6px rgba(0,0,0,.55);
}
.plug.pop{animation:plugin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes plugin{
  0%{transform:translateX(-50%) translateY(-150%)}
  58%{transform:translateX(-50%) translateY(7%) scaleY(.88)}
  78%{transform:translateX(-50%) translateY(-3%) scaleY(1.05)}
  100%{transform:translateX(-50%) translateY(0) scaleY(1)}
}
.corktop.pop{animation:capin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes capin{
  0%{transform:translate(-50%,-64px) rotate(-15deg); opacity:0}
  28%{opacity:1}
  58%{transform:translate(-50%,3px) rotate(0deg) scaleY(.78)}
  78%{transform:translate(-50%,-2px) scaleY(1.07)}
  100%{transform:translate(-50%,0) scaleY(1)}
}
.ring{
  position:absolute; left:50%; top:calc(var(--cap-h)); z-index:8;
  width:14px; height:14px; margin-left:-7px; border-radius:50%;
  border:2px solid rgba(255,232,196,.95); pointer-events:none;
  animation:ring .6s ease-out forwards;
}
@keyframes ring{0%{transform:scale(.3);opacity:0}20%{opacity:1}100%{transform:scale(6);opacity:0}}

.bead{
  position:absolute; z-index:53; border-radius:52% 52% 46% 46%; pointer-events:none;
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.25), inset 2px 2px 3px rgba(255,255,255,.45);
}
.pool{
  position:absolute; z-index:51; border-radius:50%; pointer-events:none;
  height:7px; opacity:.7; animation:pool .55s ease-out infinite;
}
@keyframes pool{0%{transform:translateX(-50%) scale(.4,.6);opacity:.8}
  100%{transform:translateX(-50%) scale(1.6,1);opacity:0}}
.drop{position:absolute; border-radius:50%; z-index:54; pointer-events:none}

/* --- particle liquid ---
   When the sim is running it draws every bottle's contents onto one canvas over
   the board, so the DOM bands stand down. The glass, collar, sheen and cork are
   still DOM: only the liquid moves to the canvas. */
.board.simulated .fill{opacity:0}
.fluidLayer{
  position:absolute; inset:0; z-index:0;
  pointer-events:none;
}

.gameHeader{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; max-width:520px; gap:8px;
}
.gameHeader .spacer{width:72px}
.hud{display:flex; gap:6px}
.stat{
  min-width:62px; padding:6px 10px 7px; text-align:center;
  border:1px solid rgba(224,177,92,.20); border-radius:11px;
  background:linear-gradient(180deg,rgba(52,38,22,.58),rgba(20,14,9,.48));
  backdrop-filter:blur(6px);
}
.stat b{display:block; font-family:"Cinzel",serif; font-weight:600; font-size:17px; line-height:1.15; color:#fff}
.stat span{color:var(--ink-dim); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase}
.stat.over b{color:#F0894F}
/* the pour counter carries par with it, so the number you are chasing is never
   a separate thing to go and look at */
#movesStat{min-width:112px}

/* --- gold --- */
.purse{
  display:flex; align-items:center; gap:5px; min-width:72px; justify-content:flex-end;
  font-family:"Cinzel",serif; font-weight:600; font-size:15px; color:#F4D9A0;
}
.purse .coin{color:#E0B15C; font-size:11px}
.btn.priced{display:inline-flex; flex-direction:column; align-items:center; gap:1px; line-height:1.1}
.btn.priced small{
  font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:#E0B15C; font-weight:600;
}
.btn.priced:disabled small{color:var(--ink-dim)}
.btn.priced.spent small{text-decoration:line-through}
.payout{display:flex; align-items:baseline; justify-content:center; gap:8px; margin:2px 0 10px}
.payout b{font-family:"Cinzel",serif; font-weight:700; font-size:22px; color:#F4D9A0}
.payout span{color:var(--ink-dim); font-size:9px; letter-spacing:.16em; text-transform:uppercase}

.mapHeader{
  display:flex; align-items:flex-end; justify-content:space-between;
  width:100%; max-width:520px; gap:12px;
}
.mapMeta{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.tally{text-align:right}
.tally b{
  display:block; font-family:"Cinzel",serif; font-weight:900; font-size:26px;
  line-height:1; color:var(--gold-lit);
}
.tally span{font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}

.mapScroll{
  position:relative; flex:1; width:100%; max-width:520px; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(180deg, transparent 0, #000 64px, #000 calc(100% - 24px), transparent 100%);
}
.mapScroll::-webkit-scrollbar{width:0}
.mapCanvas{position:relative; width:100%}
.mapPath{position:absolute; left:0; bottom:0; pointer-events:none}

.chapter{
  position:absolute; left:0; right:0; text-align:center; pointer-events:none;
}
.chapter span{
  display:inline-block; position:relative;
  font-family:"Cinzel",serif; font-weight:600; font-size:14px; letter-spacing:.02em;
  color:var(--tint); padding:0 14px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.chapter span::before,.chapter span::after{
  content:""; position:absolute; top:50%; width:52px; height:1px;
  background:linear-gradient(90deg, transparent, var(--tint));
  opacity:.5;
}
.chapter span::before{right:100%}
.chapter span::after{left:100%; transform:scaleX(-1)}

.node{
  position:absolute; transform:translate(-50%, 50%);
  width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center; gap:0;
  font-family:"Cinzel",serif; font-weight:600; font-size:19px; color:#fff;
  cursor:pointer; padding:0;
  border:1.5px solid rgba(224,177,92,.34);
  background:linear-gradient(180deg, rgba(64,47,27,.82), rgba(26,18,11,.78));
  box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(244,217,160,.22);
  transition:transform .18s cubic-bezier(.3,1.3,.5,1), box-shadow .25s;
}
.node:hover:not(:disabled){transform:translate(-50%,50%) scale(1.08)}
.node .num{line-height:1}
.node .ns{
  position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
  font-size:10px; letter-spacing:1px; color:var(--gold-lit); white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.node .ns i{color:rgba(239,228,210,.20); font-style:normal}

.node.cleared{
  border-color:color-mix(in srgb, var(--tint) 60%, transparent);
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
    linear-gradient(180deg, color-mix(in srgb, var(--tint) 85%, #fff 15%), color-mix(in srgb, var(--tint) 70%, #000 30%));
  box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 22px color-mix(in srgb, var(--tint) 35%, transparent);
  color:#231607;
}
.node.current{
  border-color:rgba(250,232,190,.8);
  background:linear-gradient(180deg,#FBEBC8,var(--gold) 62%,#B8823A);
  color:#2A1B08; font-size:21px;
  box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 34px rgba(224,177,92,.5);
  animation:beacon 2.4s ease-in-out infinite;
}
@keyframes beacon{
  0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 30px rgba(224,177,92,.4)}
  50%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 12px rgba(224,177,92,.05), 0 0 44px rgba(238,197,120,.65)}
}
.node.locked{
  cursor:default; font-size:14px; color:rgba(239,228,210,.32);
  border-color:rgba(224,177,92,.12);
  background:linear-gradient(180deg, rgba(40,29,17,.55), rgba(16,11,7,.5));
  box-shadow:none;
}
.node.locked:nth-of-type(n){opacity:.85}
</style>
</head>
<body data-view="map">

<section class="view" id="mapView">
  <header class="mapHeader">
    <div>
      <p class="eyebrow">Chapter</p>
      <h1 class="wordmark" id="mapChapter">The Cellar</h1>
    </div>
    <div class="mapMeta">
      <div class="purse"><span class="coin" aria-hidden="true">&#9670;</span><b id="mapGold">0</b></div>
      <div class="tally"><b id="mapStars">0</b><span>stars earned</span></div>
    </div>
  </header>
  <div class="mapScroll" id="mapScroll"><div class="mapCanvas"></div></div>
  <footer class="controls">
    <button class="btn primary" id="mapPlay" type="button">Play</button>
    <button class="btn priced" id="daily" type="button">Daily<small id="dailyCost">+12</small></button>
    <button class="btn js-sound" type="button">Sound on</button>
    <button class="btn primary" id="install" type="button" hidden>Install</button>
  </footer>
</section>

<section class="view" id="gameView">
  <header class="gameHeader">
    <button class="btn ghost" id="toMap" type="button">&larr; Map</button>
    <h1 class="wordmark small">Decanter</h1>
    <div class="purse"><span class="coin" aria-hidden="true">&#9670;</span><b id="gold">0</b></div>
  </header>
  <div class="hud">
    <div class="stat"><b id="statLevel">1</b><span>Level</span></div>
    <div class="stat" id="movesStat"><b id="statMoves">0</b><span id="pourLabel">Pours · Par —</span></div>
    <div class="stat" hidden><b id="statPar">…</b></div>
    <div class="stat"><b id="statLeft">4</b><span>To sort</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="btn priced" id="undo" type="button">Undo<small id="undoCost">3 free</small></button>
    <button class="btn priced" id="vessel" type="button">Vessel<small id="vesselCost">45</small></button>
    <button class="btn" id="restart" type="button">Restart</button>
    <button class="btn js-sound" type="button">Sound on</button>
  </div>
</section>

<div id="confetti"></div>

<div class="veil" id="veil">
  <div class="panel">
    <h2 id="winTitle">Poured clean</h2>
    <div class="stars" id="stars"></div>
    <p id="winLine"></p>
    <div class="payout"><b id="goldEarned">+0</b><span id="goldWhy"></span></div>
    <p class="hint" id="winHint"></p>
    <div class="panelBtns">
      <button class="btn" id="retry" type="button">Retry</button>

<script id="solverSrc" type="text/js-worker">/* Water-sort solver. Shipped verbatim inside the page as a Web Worker.
   Uses A* with a consistent, admissible heuristic:
     h = (total contiguous color segments) - (number of colors)
   A pour moves one maximal top run, so it merges at most one segment per move.
   Therefore each move lowers the segment count by at most 1, and the goal has
   exactly one segment per color. A* with a consistent heuristic and a closed
   set returns a true minimum. */
var CAP = 4;

  var out=[],a,b,A,B,top,run,i;
  for(a=0;a<s.length;a++){
    A=s[a]; if(!A.length) continue;
    if(full(A)) continue;

   - a uniform tube emptied into an empty tube (identical multiset of tubes)
   - duplicate destinations (empty tubes are interchangeable, as are equal tubes) */

  var out=[],a,b,A,B,top,run,i,whole,emptySeen,dstSeen,k;
  for(a=0;a<s.length;a++){

    if(full(A)) continue;

    pourAt(p){
      if (!pourNode || !ctx) return;
      const t = ctx.currentTime + 0.06;
      pourNode.r1.frequency.linearRampToValueAtTime(360 + 540 * p, t);
      pourNode.r2.frequency.linearRampToValueAtTime(720 + 900 * p, t);
      pourNode.air.frequency.linearRampToValueAtTime(1500 + 650 * p, t);
    },
    pourEnd(){
      if (!pourNode || !ctx) return;
      const { s, g } = pourNode, t = ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.16);
      try { s.stop(t + 0.22); } catch(e){}
      pourNode = null;
    },
    glug(p){
      const base = (290 + 250 * p) * (0.9 + Math.random() * 0.2);
      tone({ f:base * 1.7, f2:base * 0.72, dur:0.1, gain:0.12 });
      burst({ freq:base * 3.2, q:2.6, dur:0.045, gain:0.05 });
    },
    cork(){
      burst({ freq:2600, q:0.8, dur:0.03, gain:0.15 });
      tone({ f:940, f2:170, dur:0.085, gain:0.4, delay:0.008 });
      tone({ f:145, f2:75, type:'triangle', dur:0.24, gain:0.2, delay:0.03 });
      burst({ freq:520, q:3, dur:0.16, gain:0.06, delay:0.02 });
    },
    win(){
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        tone({ f, type:'triangle', dur:0.45, gain:0.15, delay:i * 0.11 }));
    },
    unlock2(){ [659.25, 987.77].forEach((f,i) => tone({ f, type:'triangle', dur:0.5, gain:0.13, delay:i*0.13 })); }
  };
})();
globalThis.Audio = Audio;


/* ---- 60-solver-client.js ---- */
/* Talks to the A* solver. Prefers a real worker so a long search never blocks
   the UI, and degrades to an inline run with a small budget if workers are
   unavailable (some sandboxed embeds). */
const SolverClient = (() => {
  let worker = null, ok = true, nextId = 1;
  const pending = new Map();

  function source(){
    const el = document.getElementById('solverSrc');
    return el ? el.textContent : '';
  }
  function boot(){
    if (worker || !ok) return;
    try {
      const blob = new Blob([source()], { type: 'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = e => {
        const cb = pending.get(e.data.id);
        if (cb){ pending.delete(e.data.id); cb(e.data); }
      };
      worker.onerror = () => { ok = false; worker = null; };
    } catch (e) { ok = false; }
  }
  function inline(payload, cb){
    setTimeout(() => {
      try {
        const stub = {};
        new Function('self', source())(stub);
        stub.postMessage = m => cb(m);
        stub.onmessage({ data: Object.assign({}, payload, { nodeCap: 60000, msCap: 1200 }) });
      } catch (e) { cb({ id: payload.id, par: null, exact: false }); }
    }, 20);
  }
  return {
    solve(tubes, colors, cb){
      boot();
      const id = nextId++;
      const payload = {
        id, tubes: Rules.clone(tubes), cap: Rules.CAP, colors,
        nodeCap: CONFIG.solver.nodeCap, msCap: CONFIG.solver.msCap
      };
      if (worker && ok){ pending.set(id, cb); worker.postMessage(payload); }
      else inline(payload, cb);
      return id;
    }
  };
})();
globalThis.SolverClient = SolverClient;


/* ---- 70-board.js ---- */
/* Everything that draws bottles and animates a pour. Owns the *view* state,
   which trails the logical state while queued animations catch up. */
const Board = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let root = null, fx = null, fluidOn = false;
  let view = [], selected = null;
  let onTap = () => {};

  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

  /* Drives a frame loop from 0 to 1 over ms, backstopped by a timer.
     requestAnimationFrame stops firing in a hidden tab, so a pour started just
     before the screen locks would otherwise never finish, and the queue waiting
     on it would never drain. Timers still fire when hidden, so one is kept as a
     floor: the animation jumps to its end state rather than hanging. */
  function frames(ms, onFrame){
    return new Promise(res => {
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        onFrame(1);
        res();
      };
      const bail = setTimeout(finish, ms + 500);
      (function step(now){
        if (done) return;
        const p = Math.min(1, (now - t0) / ms);
        if (p < 1){ onFrame(p); requestAnimationFrame(step); }
        else finish();
      })(t0);
    });
  }
  const el = i => root.querySelector(`.bottle[data-i="${i}"]`);
  const colorVar = c => `var(--c${c})`;

  /* --- layout: pick the row count that divides the bottle count exactly and
     yields the largest bottles for the space available --- */
  function layout(n){
    const W = root.clientWidth || window.innerWidth - 24;
    const H = root.clientHeight || 360;
    let best = null;
    for (let rows = 1; rows <= 4; rows++){
      if (n % rows) continue;
      const cols = n / rows;
      const gx = cols > 6 ? 7 : 11, gy = rows > 2 ? 12 : 20;
      const bw = Math.min((W - (cols - 1) * gx) / cols, ((H - (rows - 1) * gy) / rows) / 3.62, 58);
      if (!best || bw > best.bw) best = { bw, rows, cols, gx, gy };
    }
    if (!best) best = { bw:30, rows:1, cols:n, gx:8, gy:14 };
    document.documentElement.style.setProperty('--bw', Math.max(22, best.bw).toFixed(1) + 'px');
    root.style.setProperty('--cols', best.cols);
    root.style.columnGap = best.gx + 'px';
    root.style.rowGap = best.gy + 'px';
  }
  /* contiguous runs of one color draw as a single band, so no seam shows
     between two units of the same liquid */
  function bandsOf(tube){
    const out = [];
    for (const c of tube){
      const last = out[out.length - 1];
      if (last && last.c === c) last.n++; else out.push({ c, n:1 });
    }
    return out;
  }
  const bandHeight = n => `calc(var(--bh) / var(--units) * ${n})`;

  function render(){
    layout(view.length);
    root.innerHTML = '';
    view.forEach((tube, i) => {
      const b = document.createElement('button');
      b.className = 'bottle';
      b.dataset.i = i;
      b.type = 'button';
      b.setAttribute('aria-label', `Bottle ${i + 1}, ${tube.length} of ${Rules.CAP} full`);
      const full = Rules.isFull(tube);
      if (full) b.classList.add('done');
      if (selected === i) b.classList.add('lifted');
      b.innerHTML = '<div class="collar"></div>';
      const glass = document.createElement('div'); glass.className = 'glass';
      const fill = document.createElement('div'); fill.className = 'fill';
      const bands = bandsOf(tube);
      bands.forEach((bd, idx) => {
        const d = document.createElement('div');
        d.className = 'band' + (idx === bands.length - 1 ? ' crest' : '');
        d.dataset.c = bd.c; d.dataset.n = bd.n;
        d.style.background = colorVar(bd.c);
        d.style.height = bandHeight(bd.n);
        fill.appendChild(d);
      });
      glass.appendChild(fill);
      if (full){ const p = document.createElement('div'); p.className = 'plug'; glass.appendChild(p); }
      const sheen = document.createElement('div'); sheen.className = 'sheen'; glass.appendChild(sheen);
      const gloss = document.createElement('div'); gloss.className = 'gloss'; glass.appendChild(gloss);
      b.appendChild(glass);
      if (full){ const c = document.createElement('div'); c.className = 'corktop'; b.appendChild(c); }
      b.addEventListener('click', () => onTap(i));
      root.appendChild(b);
    });
    root.appendChild(fx);
    fx.setAttribute('width', root.clientWidth);
    fx.setAttribute('height', root.clientHeight);
    /* the glass moved, so the liquid has to be re-measured and re-seeded */
    if (fluidOn) Fluid.sync(view);
  }

  /* --- stream geometry: a tapering ribbon along a quadratic arc --- */
  function qpoint(p0, c, p1, t){
    const m = 1 - t;
    return { x: m*m*p0.x + 2*m*t*c.x + t*t*p1.x, y: m*m*p0.y + 2*m*t*c.y + t*t*p1.y };
  }
  function ribbon(p0, c, p1, w0, w1, t0, t1, off){
    const N = 18, L = [], R = [];
    for (let i = 0; i <= N; i++){
      const u = t0 + (t1 - t0) * (i / N);
      const p = qpoint(p0, c, p1, u);
      const dx = 2*(1-u)*(c.x-p0.x) + 2*u*(p1.x-c.x);
      const dy = 2*(1-u)*(c.y-p0.y) + 2*u*(p1.y-c.y);
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const w = (w0 + (w1 - w0) * u) / 2;
      const o = (off || 0) * w;
      L.push([(p.x + nx*(w+o)).toFixed(1), (p.y + ny*(w+o)).toFixed(1)]);
      R.push([(p.x - nx*(w-o)).toFixed(1), (p.y - ny*(w-o)).toFixed(1)]);
    }
    return 'M' + L.map(p => p.join(' ')).join('L') + 'L' + R.reverse().map(p => p.join(' ')).join('L') + 'Z';
  }

  /* With the particle liquid on, the bottle still tips but the pour itself is
     simulated, so the scripted ribbon and bands sit this one out. */
  async function animateFluid(move){
    const src = el(move.from), dst = el(move.to);
    if (!src || !dst) return;
    const w = src.offsetWidth, h = src.offsetHeight;
    const dir = dst.offsetLeft > src.offsetLeft ? 1 : -1;
    const ang = 72 * dir, rad = ang * Math.PI / 180;
    const lipX = dst.offsetLeft + w/2 - dir * w * 0.82;
    const lipY = dst.offsetTop - w * 0.42;
    const dx = (lipX - (h/2) * Math.sin(rad)) - (src.offsetLeft + w/2);
    const dy = (lipY + (h/2) * Math.cos(rad)) - (src.offsetTop + h/2);

    src.classList.add('pouring');
    src.classList.remove('lifted');
    src.style.transition = 'transform .3s cubic-bezier(.35,.05,.3,1)';
    src.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    await sleep(300);
    Audio.pourStart();
    await Fluid.pour(move);
    Audio.pourEnd();
    src.style.transition = 'transform .34s cubic-bezier(.3,.6,.3,1)';
    src.style.transform = '';
    await sleep(reduce ? 60 : 340);
    src.classList.remove('pouring');
    src.style.transition = '';
  }

  async function animate(move){
    if (fluidOn) return animateFluid(move);
    const src = el(move.from), dst = el(move.to);
    if (!src || !dst) return;
    const w = src.offsetWidth, h = src.offsetHeight;
    const glassH = src.querySelector('.glass').offsetHeight;
    const unitH = glassH / Rules.CAP, capH = h - glassH;
    const raw = CONFIG.palette[move.color];
    const dir = dst.offsetLeft > src.offsetLeft ? 1 : -1;
    const ang = 72 * dir, rad = ang * Math.PI / 180;

    /* the lip stops beside the target, not over it, so liquid arcs across */
    const lipX = dst.offsetLeft + w/2 - dir * w * 0.82;
    const lipY = dst.offsetTop - w * 0.42;
    const dx = (lipX - (h/2) * Math.sin(rad)) - (src.offsetLeft + w/2);
    const dy = (lipY + (h/2) * Math.cos(rad)) - (src.offsetTop + h/2);

    src.classList.add('pouring');
    src.classList.remove('lifted');
    src.style.transition = 'transform .22s cubic-bezier(.3,0,.4,1)';
    src.style.transform = `translate(${dx*0.4}px, ${dy-16}px) rotate(${ang*0.22}deg)`;
    await sleep(200);
    src.style.transition = 'transform .3s cubic-bezier(.35,.05,.3,1)';
    src.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    await sleep(280);

    const startFill = view[move.to].length;
    const impactX = dst.offsetLeft + w/2;
    const surfaceY = k => dst.offsetTop + capH + glassH - k * unitH;
    const P0 = { x: lipX, y: lipY };
    let P1 = { x: impactX, y: surfaceY(startFill) };
    const ctrl = () => ({ x: P0.x + (P1.x - P0.x) * 0.78, y: P0.y + (P1.y - P0.y) * 0.10 });
    const w0 = w * 0.30, w1 = w * 0.15;

    const body = document.createElementNS(NS, 'path'); body.setAttribute('fill', raw);
    const shine = document.createElementNS(NS, 'path');
    shine.setAttribute('fill', '#fff'); shine.setAttribute('opacity', '.32');
    fx.appendChild(body); fx.appendChild(shine);

    const bead = document.createElement('div');
    bead.className = 'bead';
    bead.style.background = raw;
    bead.style.width = (w*0.30) + 'px'; bead.style.height = (w*0.24) + 'px';
    bead.style.left = (P0.x - w*0.15) + 'px'; bead.style.top = (P0.y - w*0.12) + 'px';
    root.appendChild(bead);

    const pool = document.createElement('div');
    pool.className = 'pool';
    pool.style.background = raw;
    pool.style.width = (w*0.5) + 'px';
    pool.style.left = impactX + 'px';
    root.appendChild(pool);

    let head = 0, tail = 0;
    const paint = () => {
      const c = ctrl();
      body.setAttribute('d', ribbon(P0, c, P1, w0, w1, tail, head, 0));
      shine.setAttribute('d', ribbon(P0, c, P1, w0*0.34, w1*0.3, tail, head, -0.85));
      pool.style.top = (P1.y - 4) + 'px';
      pool.style.opacity = head >= 1 ? '.7' : '0';
    };
    /* the leading edge falls, it does not appear all at once */
    await frames(reduce ? 40 : 190, p => { head = p; paint(); });
    Audio.pourStart();

    const srcBand = src.querySelector('.fill').lastElementChild;
    const srcCount = srcBand ? +srcBand.dataset.n : 0;
    const dstFill = dst.querySelector('.fill');
    let dstBand = dstFill.lastElementChild;
    const merging = dstBand && +dstBand.dataset.c === move.color;
    const dstCount = merging ? +dstBand.dataset.n : 0;
    if (!merging){
      dstBand = document.createElement('div');
      dstBand.className = 'band crest';
      dstBand.dataset.c = move.color;
      dstBand.style.background = colorVar(move.color);
      dstBand.style.height = '0px';
      dstFill.querySelector('.band.crest')?.classList.remove('crest');
      dstFill.appendChild(dstBand);
    }
    const per = reduce ? 40 : 165;
    for (let k = 0; k < move.n; k++){
      await sleep(per);
      if (srcBand) srcBand.style.height = ((srcCount - k - 1) * unitH) + 'px';
      dstBand.style.height = ((dstCount + k + 1) * unitH) + 'px';
      dstBand.dataset.n = dstCount + k + 1;
      P1 = { x: impactX, y: surfaceY(startFill + k + 1) };
      paint();
      const p = (startFill + k + 1) / Rules.CAP;
      Audio.pourAt(p); Audio.glug(p);
      if (!reduce) splash(impactX, P1.y, raw, w);
    }
    /* the tail lets go of the lip and falls away */
    bead.style.transition = 'opacity .18s'; bead.style.opacity = '0';
    await frames(reduce ? 40 : 240, p => { tail = p; paint(); });
    Audio.pourEnd();
    body.remove(); shine.remove(); bead.remove(); pool.remove();
    src.style.transition = 'transform .34s cubic-bezier(.3,.6,.3,1)';
    src.style.transform = '';
    await sleep(reduce ? 60 : 340);
    src.classList.remove('pouring');
    src.style.transition = '';
  }

  function splash(x, y, color, w){
    for (let i = 0; i < 4; i++){
      const d = document.createElement('div');
      d.className = 'drop';
      d.style.background = color;
      const s = 2 + Math.random() * 3;
      d.style.width = s + 'px'; d.style.height = (s * 1.3) + 'px';
      d.style.left = (x - s/2) + 'px'; d.style.top = (y - 4) + 'px';
      root.appendChild(d);
      const ux = (Math.random() - 0.5) * w * 1.1, uy = -(8 + Math.random() * 16);
      d.animate([
        { transform:'translate(0,0)', opacity:0.95 },
        { transform:`translate(${ux*0.55}px,${uy}px)`, opacity:0.9, offset:0.4 },
        { transform:`translate(${ux}px,${6 + Math.random()*8}px)`, opacity:0 }
      ], { duration: 420 + Math.random()*180, easing:'cubic-bezier(.3,.5,.5,1)' })
       .onfinish = () => d.remove();
    }
  }

  function seal(i){
    const b = el(i);
    if (!b) return;
    b.querySelector('.plug')?.classList.add('pop');
    b.querySelector('.corktop')?.classList.add('pop');
    setTimeout(() => {
      Audio.cork();
      b.classList.add('thunk');
      b.querySelector('.sheen')?.classList.add('run');
      const ring = document.createElement('div');
      ring.className = 'ring';
      b.appendChild(ring);
      setTimeout(() => ring.remove(), 700);
      const r = b.getBoundingClientRect();
      Confetti.burst(r.left + r.width/2, r.top + 6, 14,
        [CONFIG.palette[view[i][0]], '#F7DEB4', '#D8A76D', '#FFFFFF'], 95);
      setTimeout(() => b.classList.remove('thunk'), 520);
    }, reduce ? 40 : 330);
  }

  function nudge(i){
    const b = el(i);
    if (!b) return;
    b.animate([{ transform:'translateX(0)' }, { transform:'translateX(-5px)' },
               { transform:'translateX(5px)' }, { transform:'translateX(0)' }],
              { duration:220, easing:'ease-in-out' });
  }
  return {
    mount(node){
      root = node;
      fx = document.createElementNS(NS, 'svg');
      fx.setAttribute('class', 'fx');
      fluidOn = Fluid.supported();
      if (fluidOn){ Fluid.mount(root); root.classList.add('simulated'); }
    },
    get fluid(){ return fluidOn; },
    get view(){ return view; },
    set view(v){ view = v; },
    get selected(){ return selected; },
    set selected(v){ selected = v; },
    set onTap(fn){ onTap = fn; },
    el, render, animate, seal, nudge, reduce
  };
})();
globalThis.Board = Board;


/* ---- 72-fluid.js ---- */
/* Particle liquid.

   Adapted from the design study's <fluid-pour>. That element was a showpiece: a
   six-second loop that poured one fixed bottle into one fixed neighbour forever,
   seeded from a hardcoded string, with no method, event or attribute a caller
   could drive. The solver and the metaball renderer are worth keeping, so they
   are kept; everything that decided *when* a pour happened is replaced.

   What is different here:
   - geometry is measured from the real bottles, so it follows the responsive
     grid instead of assuming one row of six at a fixed size
   - particles are seeded from the game's tube state, not a string
   - pour() takes a move and resolves once the liquid stops moving, so the queue
     in 90-app.js can await it the way it awaits the scripted animation
   - it declines to run at all where it would be a downgrade

   The physics is Clavet double-density relaxation: each colour carries a density
   so potions stratify, and particles only see neighbours in the same bottle, so
   liquid can never cross a glass wall. */
const Fluid = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The renderer needs canvas filters for the metaball threshold. Without them
     every colour would render as a cloud of soft dots, which is worse than the
     animation this replaces, so the scripted pour stays in charge instead. */
  function canFilter(){
    try {
      const c = document.createElement('canvas').getContext('2d');
      if (typeof c.filter !== 'string') return false;
      c.filter = 'blur(2px)';
      return c.filter !== 'none';
    } catch (e) { return false; }
  }

  const supported = () => !reduce && canFilter();

  let root = null, cv = null, ctx = null, field = null, mask = null, sprite = null;
  let W = 0, H = 0, dpr = 1, R = 9;
  let bottles = [], parts = [], bands = null;
  let running = false, raf = 0, last = 0, acc = 0;
  let rho0 = 2.4, calibrated = false;
  let jet = null;                       /* the pour in flight, if any */

  const K = 0.34, KNEAR = 0.85, MAXD = 1.0;
  const GRAV = 680, BUOY = 90, VISC = 0.14, DAMP = 0.985, H2 = 256, HR = 16;

  /* heavier colours sink. Spread deterministically so a board of any palette
     still stratifies into readable layers rather than one muddy column. */
  const densityOf = c => 0.8 + ((c * 7) % 10) * 0.06;
  const colorOf = c => CONFIG.palette[c] || '#888';

  function surface(w, h){
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    return { c, x };
  }

  function buildSprite(){
    const s = surface(R * 2, R * 2);
    const g = s.x.createRadialGradient(R, R, 0, R, R, R);
    g.addColorStop(0, 'rgba(255,255,255,.58)');
    g.addColorStop(0.45, 'rgba(255,255,255,.44)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    s.x.fillStyle = g; s.x.beginPath(); s.x.arc(R, R, R, 0, 6.283); s.x.fill();
    sprite = s.c;
  }

  function mount(el){
    root = el;
    cv = document.createElement('canvas');
    cv.className = 'fluidLayer';
    ctx = cv.getContext('2d');
  }

  /* render() rebuilds the board with innerHTML, which throws the canvas away, so
     it is put back as the first child: behind the bottles, where the glass and
     its sheen still sit over the liquid rather than under it. */
  function attach(){
    if (root && cv.parentNode !== root) root.insertBefore(cv, root.firstChild);
  }

  /* Read the board back from the DOM. Each bottle gets its own rectangle, which
     is what lets this work on the two-row phone layout the original could not
     express, and it re-measures on resize rather than trusting cached numbers. */
  function measure(){
    if (!root) return false;
    attach();
    const box = root.getBoundingClientRect();
    /* A board with no layout yet, mid view-change or in a tab that is not
       rendering, measures as nothing. Sizing the canvas to that would leave the
       sim quietly drawing one pixel forever, so wait for a real board instead. */
    if (box.width < 8 || box.height < 8) return false;
    W = Math.round(box.width);
    H = Math.round(box.height);
    dpr = Math.min(1.5, window.devicePixelRatio || 1);

    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
    field = surface(W, H); mask = surface(W, H);
    buildSprite();

    bottles = [];
    const els = root.querySelectorAll('.bottle');
    els.forEach((b, i) => {
      const glass = b.querySelector('.glass');
      if (!glass) return;
      const g = glass.getBoundingClientRect();
      const o = b.getBoundingClientRect();
      bottles[i] = {
        i, el: b,
        /* the glass at rest, in board coordinates. Everything else is derived by
           putting this rectangle through the bottle's live transform. */
        x0: g.left - box.left + 2,
        x1: g.right - box.left - 2,
        yTop: g.top - box.top + 2,
        yBot: g.bottom - box.top - 2,
        cap: g.height - 4,
        /* transform-origin is the centre of the whole bottle, collar included */
        cx: o.left - box.left + o.width / 2,
        cy: o.top - box.top + o.height / 2,
        m: null, inv: null
      };
    });
    return bottles.length > 0;
  }

  /* A tipping bottle carries its glass with it, so the walls have to tip too.
     The bottle is treated as an oriented box: particles are pushed into local,
     upright space to be clamped, then put back. Gravity is never rotated, which
     is what keeps the surface level while the glass turns around it. */
  function readTransforms(){
    for (let i = 0; i < bottles.length; i++){
      const b = bottles[i];
      if (!b || !b.el) continue;
      if (!b.el.classList.contains('pouring')){ b.m = b.inv = null; continue; }
      const t = getComputedStyle(b.el).transform;
      if (!t || t === 'none'){ b.m = b.inv = null; continue; }
      try {
        b.m = new DOMMatrixReadOnly(t);
        b.inv = b.m.inverse();
      } catch (e) { b.m = b.inv = null; }
    }
  }
  function toLocal(b, x, y){
    if (!b.inv) return { x, y };
    const p = b.inv.transformPoint(new DOMPoint(x - b.cx, y - b.cy));
    return { x: p.x + b.cx, y: p.y + b.cy };
  }
  function toWorld(b, x, y){
    if (!b.m) return { x, y };
    const p = b.m.transformPoint(new DOMPoint(x - b.cx, y - b.cy));
    return { x: p.x + b.cx, y: p.y + b.cy };
  }
  /* the glass outline in board coordinates, tilt included */
  function corners(b){
    return [[b.x0, b.yTop], [b.x1, b.yTop], [b.x1, b.yBot], [b.x0, b.yBot]]
      .map(([x, y]) => toWorld(b, x, y));
  }

  function add(x, y, c, home, vx, vy){
    parts.push({ x, y, px: x, py: y, vx: vx || 0, vy: vy || 0,
                 c, d: densityOf(c), home, wob: Math.random() * 3.4 });
  }

  /* one bottle's worth of liquid, heaviest colour at the bottom */
  function fillBottle(bi, tube){
    const b = bottles[bi];
    if (!b || !tube || !tube.length) return;
    const step = 4.95;
    const ordered = tube.slice().sort((A, B) => densityOf(B) - densityOf(A));
    ordered.forEach((c, layer) => {
      const lh = b.cap / Rules.CAP;
      const yTop = b.yBot - (layer + 1) * lh;
      for (let y = yTop + 1.5; y < yTop + lh - 1; y += step)
        for (let x = b.x0 + 2; x < b.x1 - 1.5; x += step)
          add(x + (Math.random() - .5) * .6, y + (Math.random() - .5) * .6, c, bi);
    });
  }

  let retry = 0;
  function sync(view){
    clearTimeout(retry);
    if (!measure()){
      /* try again shortly rather than giving up: the board usually has a size a
         frame or two later, and a sim that never seeded would show nothing at
         all while the game carried on underneath it */
      retry = setTimeout(() => sync(view), 120);
      return;
    }
    parts = []; bands = null; calibrated = false; rho0 = 2.4; jet = null;
    view.forEach((tube, i) => fillBottle(i, tube));
    draw();
  }

  /* ---- the solver ---- */
  function step(dt){
    readTransforms();
    if (jet){
      jet.t += dt;
      const want = Math.min(jet.quota, Math.floor((jet.t / jet.dur) * jet.quota));
      while (jet.sent < want){
        jet.sent++;
        const j = (Math.random() - .5) * 1.4;
        add(jet.x + j, jet.y + j, jet.c, -1,
            jet.vx + (Math.random() - .5) * 6, jet.vy + (Math.random() - .5) * 6);
        parts[parts.length - 1].poured = true;
      }
      /* The source loses what the jet carries, taken from the surface down, so
         it empties while the target fills instead of staying full until the
         board is re-seeded underneath it. */
      let died = false;
      while (jet.pulled < jet.sent && jet.pulled < jet.pool.length){
        jet.pool[jet.pulled++].dead = true;
        died = true;
      }
      if (died) parts = parts.filter(p => !p.dead);
    }

    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.vy += GRAV * dt;
      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }

    const cs = HR, cols = Math.ceil(W / cs) + 3, rows = Math.ceil(H / cs) + 3;
    const grid = new Array(cols * rows);
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      const idx = (((p.y / cs) | 0) + 1) * cols + ((p.x / cs) | 0) + 1;
      if (idx >= 0 && idx < grid.length) (grid[idx] || (grid[idx] = [])).push(p);
    }

    const samples = calibrated ? null : [];
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      const cx = ((p.x / cs) | 0) + 1, cy = ((p.y / cs) | 0) + 1;
      let rho = 0, rhoN = 0, dSum = 0, dN = 0;
      const list = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const g = grid[(cy + dy) * cols + cx + dx]; if (!g) continue;
        for (let j = 0; j < g.length; j++){
          const q = g[j]; if (q === p) continue;
          /* glass between them: only airborne liquid mixes across bottles */
          if (p.home !== -1 && q.home !== -1 && q.home !== p.home) continue;
          const ddx = q.x - p.x, ddy = q.y - p.y, r2 = ddx * ddx + ddy * ddy;
          if (r2 >= H2 || r2 < 0.0001) continue;
          const r = Math.sqrt(r2), a = 1 - r / HR;
          rho += a * a; rhoN += a * a * a; dSum += q.d; dN++;
          list.push({ q, ddx, ddy, r, a });
        }
      }
      if (samples && dN >= 6) samples.push(rho);
      const Pp = K * (rho - rho0), Pn = KNEAR * rhoN;
      for (let j = 0; j < list.length; j++){
        const it = list[j], nx = it.ddx / it.r, ny = it.ddy / it.r;
        let D = (Pp * it.a + Pn * it.a * it.a) * 0.5;
        if (D > MAXD) D = MAXD; else if (D < -MAXD) D = -MAXD;
        it.q.x += nx * D; it.q.y += ny * D;
        p.x -= nx * D; p.y -= ny * D;
        const u = (it.q.vx - p.vx) * nx + (it.q.vy - p.vy) * ny;
        if (u > 0){
          const imp = VISC * it.a * u * 0.5;
          p.vx += nx * imp; p.vy += ny * imp;
          it.q.vx -= nx * imp; it.q.vy -= ny * imp;
        }
      }
      if (dN > 2) p.vy += (p.d - dSum / dN) * BUOY * dt;
    }
    if (samples && samples.length > 40){
      samples.sort((a, b) => a - b);
      rho0 = samples[samples.length >> 1] * 0.78;
      calibrated = true;
    }

    /* stratify: give each colour a band and ease strays toward it */
    bandT += dt;
    if (bandT > 0.1){
      bandT = 0;
      const per = {}, top = {};
      for (let i = 0; i < parts.length; i++){
        const p = parts[i]; if (p.home === -1) continue;
        (per[p.home] || (per[p.home] = {}))[p.c] = (per[p.home][p.c] || 0) + 1;
        if (top[p.home] === undefined || p.y < top[p.home]) top[p.home] = p.y;
      }
      bands = {};
      Object.keys(per).forEach(bi => {
        const b = bottles[bi]; if (!b || b.m) return;   /* upright bottles only */
        const counts = per[bi];
        const keys = Object.keys(counts).sort((A, B) => densityOf(+B) - densityOf(+A));
        const total = keys.reduce((s, k) => s + counts[k], 0);
        const top0 = Math.max(b.yTop, Math.min(top[bi], b.yBot - 8));
        const colH = b.yBot - top0;
        let y = b.yBot; const map = {};
        keys.forEach(k => { const h = (counts[k] / total) * colH; map[k] = { y0: y - h, y1: y }; y -= h; });
        bands[bi] = map;
      });
    }

    /* walls, ownership, culling */
    const T = jet ? bottles[jet.to] : null;
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      if (p.home === -1){
        if (T && p.y > T.yTop + 1 && p.x > T.x0 - 2 && p.x < T.x1 + 2) p.home = jet.to;
        else if (!T || p.y > T.yBot) { parts.splice(i, 1); continue; }
      }
      if (p.home !== -1){
        const b = bottles[p.home];
        if (!b){ parts.splice(i, 1); continue; }
        if (b.m){
          /* tipped: clamp in the bottle's own frame, then come back out. The
             mouth is left open so liquid can leave a bottle that is pouring. */
          const L = toLocal(b, p.x, p.y);
          if (L.x < b.x0) L.x = b.x0;
          if (L.x > b.x1) L.x = b.x1;
          if (L.y > b.yBot) L.y = b.yBot;
          const back = toWorld(b, L.x, L.y);
          p.x = back.x; p.y = back.y;
        } else {
          if (p.x < b.x0) p.x = b.x0;
          if (p.x > b.x1) p.x = b.x1;
          if (p.y > b.yBot) p.y = b.yBot;
          if (p.y < b.yTop - 30) p.y = b.yTop - 30;
        }
      }
      p.vx = (p.x - p.px) * 60 * DAMP;
      p.vy = (p.y - p.py) * 60 * DAMP;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 420){ const s = 420 / sp; p.vx *= s; p.vy *= s; }
    }

    if (bands){
      for (let i = 0; i < parts.length; i++){
        const p = parts[i]; if (p.home === -1) continue;
        const b = bottles[p.home]; if (!b || b.m) continue;
        const band = bands[p.home] && bands[p.home][p.c];
        if (!band) continue;
        const slack = 1.5 + (p.wob || 0);
        if (p.y < band.y0 - slack) p.y = band.y0 - slack;
        else if (p.y > band.y1 + slack) p.y = band.y1 + slack;
        p.py = p.y;
      }
    }
  }
  let bandT = 0;

  /* a pour is done when everything it threw has landed and gone quiet */
  function settled(){
    if (!jet) return true;
    if (jet.sent < jet.quota) return false;
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      if (p.home === -1) return false;
      if (p.poured && Math.hypot(p.vx, p.vy) > 26) return false;
    }
    return true;
  }

  function draw(){
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath();
    /* Clip to the glass itself, tilt included. The old clip was a full-height
       column per bottle, which is why liquid appeared outside the bottle and
       above the shelf: the metaball blur spreads well past the particles, and
       nothing was cutting it off at the glass. */
    bottles.forEach(b => {
      if (!b) return;
      const q = corners(b);
      ctx.moveTo(q[0].x, q[0].y);
      for (let i = 1; i < q.length; i++) ctx.lineTo(q[i].x, q[i].y);
      ctx.closePath();
    });
    /* while pouring, the air between the two mouths, so the jet is not cut off */
    if (jet){
      const s = bottles[jet.from], d = bottles[jet.to];
      if (s && d){
        const x0 = Math.min(jet.x, s.x0, d.x0) - 18;
        const x1 = Math.max(jet.x, s.x1, d.x1) + 18;
        const y0 = Math.min(jet.y, d.yTop) - 30;
        ctx.rect(x0, y0, x1 - x0, Math.max(0, d.yTop - y0) + 2);
      }
    }
    ctx.clip();

    const groups = {};
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      (groups[p.c] || (groups[p.c] = [])).push(p);
    }
    Object.keys(groups).forEach(k => {
      const list = groups[k];
      field.x.clearRect(0, 0, W, H);
      for (let i = 0; i < list.length; i++){
        const p = list[i];
        field.x.drawImage(sprite, p.x - R, p.y - R, R * 2, R * 2);
      }
      mask.x.clearRect(0, 0, W, H);
      mask.x.save();
      mask.x.filter = 'blur(4.6px) contrast(8.5)';
      mask.x.drawImage(field.c, 0, 0, W, H);
      mask.x.restore();
      mask.x.save();
      mask.x.globalCompositeOperation = 'source-in';
      mask.x.fillStyle = colorOf(+k);
      mask.x.fillRect(0, 0, W, H);
      mask.x.restore();
      ctx.drawImage(mask.c, 0, 0, W, H);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.14;
      ctx.drawImage(mask.c, 0, -3.5, W, H);
      ctx.restore();
    });
    ctx.restore();
  }

  function loop(){
    if (!running) return;
    raf = requestAnimationFrame(loop);
    const now = performance.now();
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    const fixed = 1 / 60; let guard = 3;
    while (acc >= fixed && guard--){ step(fixed); acc -= fixed; }
    if (acc > fixed) acc = 0;
    draw();
    if (jet && settled()){
      const done = jet.done;
      jet = null;
      for (let i = 0; i < parts.length; i++) parts[i].poured = false;
      stop();
      done();
    }
  }
  function start(){ if (running) return; running = true; last = performance.now(); acc = 0; loop(); }
  function stop(){ running = false; cancelAnimationFrame(raf); }

  /* Resolves when the liquid has settled. Backstopped by a timer for the same
     reason the scripted pour is: requestAnimationFrame stops in a hidden tab,
     and a pour that never finishes would strand the queue waiting on it. */
  function pour(move){
    return new Promise(resolve => {
      const src = bottles[move.from], dst = bottles[move.to];
      if (!src || !dst){ resolve(); return; }
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        jet = null;
        resolve();
      };
      const dir = dst.x0 > src.x0 ? 1 : -1;
      const perUnit = Math.round(((src.x1 - src.x0) * (src.cap / Rules.CAP)) / 24);
      const quota = Math.max(12, perUnit * move.n);
      /* the liquid the source is about to lose, nearest its mouth first */
      const pool = parts.filter(p => p.home === move.from && p.c === move.color)
                        .sort((a, b) => a.y - b.y)
                        .slice(0, quota);
      jet = {
        from: move.from, to: move.to, c: move.color,
        x: (dst.x0 + dst.x1) / 2 - dir * (dst.x1 - dst.x0) * 0.5,
        y: dst.yTop - 26,
        vx: dir * 34, vy: 46,
        quota,
        pool, pulled: 0,
        sent: 0, t: 0, dur: 0.22 * move.n + 0.18,
        done: finish
      };
      const bail = setTimeout(finish, 900 + 420 * move.n);
      start();
    });
  }

  return {
    supported, mount, sync, pour, draw,
    resize(){ if (root && bottles.length) measure(); },
    get mounted(){ return !!root; }
  };
})();
globalThis.Fluid = Fluid;

/* Paper bits. Two flavours: a small burst when one bottle is corked, and a
   full screen fall when a level is finished. */
const Confetti = (() => {
  let layer = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ensure = () => (layer = layer || document.getElementById('confetti'));
  return {
    burst(cx, cy, count, palette, power){
      if (reduce || !ensure()) return;
      for (let i = 0; i < count; i++){
        const p = document.createElement('div');
        p.className = 'conf';
        const thin = Math.random() < 0.4;
        p.style.width = (thin ? 3 : 6) + 'px';
        p.style.height = (thin ? 9 : 6) + 'px';
        p.style.background = palette[i % palette.length];
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        const a = -Math.PI/2 + (Math.random() - 0.5) * 1.9;
        const v = power * (0.55 + Math.random() * 0.65);
        const ux = Math.cos(a) * v, uy = Math.sin(a) * v;
        p.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:`translate(${ux*0.6}px,${uy}px) rotate(${(Math.random()*540-270)|0}deg)`, opacity:1, offset:0.42 },
          { transform:`translate(${ux}px,${uy+90+Math.random()*70}px) rotate(${(Math.random()*900-450)|0}deg)`, opacity:0 }
        ], { duration: 900 + Math.random()*600, easing:'cubic-bezier(.15,.6,.4,1)' })
         .onfinish = () => p.remove();
        layer.appendChild(p);
      }
    },
    rain(palette){
      if (reduce || !ensure()) return;
      const cols = palette.concat(['#F7DEB4', '#D8A76D', '#FFFFFF']);
      for (let i = 0; i < 90; i++){
        const p = document.createElement('div');
        p.className = 'conf';
        const thin = Math.random() < 0.45;
        p.style.width = (thin ? 3 : 7) + 'px';
        p.style.height = (thin ? 11 : 7) + 'px';
        p.style.background = cols[(Math.random() * cols.length) | 0];
        p.style.left = (Math.random() * innerWidth) + 'px';
        p.style.top = '-20px';
        const sway = (Math.random() - 0.5) * 180;
        p.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:`translate(${sway*0.5}px,${innerHeight*0.5}px) rotate(${(Math.random()*720-360)|0}deg)`, offset:0.5 },
          { transform:`translate(${sway}px,${innerHeight+40}px) rotate(${(Math.random()*1200-600)|0}deg)`, opacity:0.9 }
        ], { duration: 2000 + Math.random()*1600, delay: Math.random()*700, easing:'cubic-bezier(.25,.5,.5,1)' })
         .onfinish = () => p.remove();
        layer.appendChild(p);
      }
    }
  };
})();

/* ---- 80-map.js ---- */
/* The journey map. Pure geometry lives in MapGeom so it can be tested without
   a browser; MapView only turns those numbers into elements. */
const MapGeom = (() => {
  /* Levels climb from the bottom. x follows a slow sine so the path winds
     without ever leaving the column. */
  const STEP = 0.72;
  function nodes(count, width, opts){
    const o = Object.assign({ spacing:96, margin:52, bottom:90 }, opts || {});
    const amp = Math.max(0, Math.min(width * 0.30, width / 2 - o.margin));
    const cx = width / 2;
    const out = [];
    for (let i = 0; i < count; i++){
      out.push({ level: i + 1, x: cx + Math.sin(i * STEP) * amp, y: o.bottom + i * o.spacing });
    }
    return out;
  }
  const height = (count, opts) => {
    const o = Object.assign({ spacing:96, bottom:90, top:140 }, opts || {});
    return o.bottom + Math.max(0, count - 1) * o.spacing + o.top;
  };
  /* Catmull-Rom through the node centres, converted to cubic beziers */
  function pathThrough(points, flipY){
    if (points.length < 2) return '';
    const P = points.map(p => ({ x: p.x, y: flipY ? flipY - p.y : p.y }));
    let d = `M ${P[0].x.toFixed(1)} ${P[0].y.toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++){
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }
  /* what the player is allowed to see: everything cleared, the frontier, and a
     short glimpse of what is coming */
  const visibleCount = (unlocked, lookahead) => unlocked + (lookahead == null ? CONFIG.lookahead : lookahead);
  return { nodes, height, pathThrough, visibleCount, STEP };
})();
globalThis.MapGeom = MapGeom;

const MapView = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let scroll = null, canvas = null, svg = null, onPick = () => {};
  let lastFocus = 1;

  function starRow(n){
    return `<span class="ns">${[0,1,2].map(i => i < n ? '★' : '<i>★</i>').join('')}</span>`;
  }
  function render(progress){
    const unlocked = progress.unlocked;
    const count = MapGeom.visibleCount(unlocked);
    const width = scroll.clientWidth || 360;
    const opts = { spacing: Math.min(104, Math.max(80, scroll.clientHeight / 5.4)) };
    const pts = MapGeom.nodes(count + 3, width, opts);   // 3 ghost points continue the path
    const H = MapGeom.height(count + 3, opts);
    canvas.style.height = H + 'px';

    svg.setAttribute('width', width);
    svg.setAttribute('height', H);
    svg.innerHTML = `
      <defs>
        <linearGradient id="pathFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E0B15C" stop-opacity=".55"/>
          <stop offset="${(count / (count + 3)).toFixed(2)}" stop-color="#E0B15C" stop-opacity=".28"/>
          <stop offset="1" stop-color="#E0B15C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${MapGeom.pathThrough(pts, H)}" fill="none" stroke="url(#pathFade)"
            stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>`;

    canvas.querySelectorAll('.node,.chapter').forEach(n => n.remove());

    for (let i = 0; i < count; i++){
      const p = pts[i], level = p.level;
      if (Levels.isSectionStart(level)){
        const tag = document.createElement('div');
        tag.className = 'chapter';
        tag.style.bottom = (p.y + 46) + 'px';
        tag.style.setProperty('--tint', Levels.sectionTint(level));
        tag.innerHTML = `<span>${Levels.sectionName(level)}</span>`;
        canvas.appendChild(tag);
      }
      const stars = progress.starsFor(level);
      const cleared = stars > 0;
      const current = level === unlocked;
      const locked = level > unlocked;

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'node' + (cleared ? ' cleared' : '') + (current ? ' current' : '') + (locked ? ' locked' : '');
      b.style.left = p.x + 'px';
      b.style.bottom = p.y + 'px';
      b.style.setProperty('--tint', Levels.sectionTint(level));
      b.dataset.level = level;

        : `Level ${level}${cleared ? `, ${stars} of 3 stars` : ''}`);

  function scrollToCurrent(smooth){
    const node = canvas.querySelector(`.node[data-level="${lastFocus}"]`);
    if (!node) return;
    const target = node.offsetTop - scroll.clientHeight * 0.58 + node.offsetHeight;
    scroll.scrollTo({ top: Math.max(0, target), behavior: smooth ? 'smooth' : 'auto' });
  }
  return {
    mount(scrollEl){
      scroll = scrollEl;
      canvas = scrollEl.querySelector('.mapCanvas');
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'mapPath');
      canvas.appendChild(svg);
    },
    set onPick(fn){ onPick = fn; },
    render, scrollToCurrent
  };
})();
globalThis.MapView = MapView;


/* ---- 90-app.js ---- */
/* Glue: routing between the map and a level, the move queue, and the win flow. */
const App = (() => {
  const progress = Progress.createProgress();
  const S = {
    level: 1, tubes: [], moves: 0,
    history: [], queue: [], running: false,
    par: null, parExact: false, parRequest: 0,
    undosUsed: 0, vesselUsed: false
  };
  const $ = id => document.getElementById(id);

  /* ---------- routing ---------- */
  /* The stylesheets colour bands with var(--cN), the pour and the particle sim
     read CONFIG.palette. Publishing one from the other keeps a single source:
     when the palette moved to jewel tones and the CSS did not, the sim poured
     the old colours into the new bottles. */
  function publishPalette(){
    const s = document.documentElement.style;
    CONFIG.palette.forEach((hex, i) => s.setProperty(`--c${i}`, hex));
  }

  /* local calendar day, so the draught refreshes on the player's midnight */
  function today(){
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function paintMap(){
    $('mapGold').textContent = progress.gold;
    const ready = progress.dailyReady(today());
    $('daily').disabled = !ready;
    $('dailyCost').textContent = ready ? `+${CONFIG.economy.daily}` : 'drawn';
  }
  function showMap(scrollSmooth){
    document.body.dataset.view = 'map';
    MapView.render(progress);
    MapView.scrollToCurrent(!!scrollSmooth);
    paintMap();
  }
  function showGame(level){
    document.body.dataset.view = 'game';
    start(level);
  }

  /* ---------- a level ---------- */
  /* Restarting keeps a vessel the player already paid for, so a restart cannot
     be used to launder the purchase back into a three-star run. Leaving the
     level and coming back deals a clean board, and costs the gold again. */
  function start(level, keepVessel){
    S.level = level;
    S.tubes = Levels.make(level);
    if (keepVessel) S.tubes.push([]);
    S.vesselUsed = !!keepVessel;
    S.undosUsed = 0;
    S.moves = 0;
    S.history = [];
    S.queue = [];
    S.running = false;
    /* the baked table is exact, and so is anything progress kept */
    S.par = PARS[level] ?? progress.parFor(level);
    S.parExact = S.par != null;
    Board.view = Rules.clone(S.tubes);
    Board.selected = null;
    $('veil').classList.remove('show');
    Board.render();
    paintHud();
    if (S.par == null) askPar();
  }
  function askPar(){
    const id = ++S.parRequest;
    const level = S.level;
    $('statPar').textContent = '…';
    SolverClient.solve(S.tubes, Levels.shape(level).colors, res => {
      if (id !== S.parRequest) return;
      S.par = res.par;
      S.parExact = !!res.exact;
      progress.rememberPar(level, res.par, res.exact);
      paintHud();
    });
  }
  const undoIsFree = () => S.undosUsed < CONFIG.economy.freeUndos;
  const undoPrice = () => (undoIsFree() ? 0 : CONFIG.economy.undoCost);

  function paintHud(){
    const busy = S.queue.length > 0 || S.running;
    const par = S.par == null ? '—' : (S.parExact ? S.par : '~' + S.par);
    $('statLevel').textContent = S.level;
    $('statMoves').textContent = S.moves;
    $('statPar').textContent = par;
    $('pourLabel').textContent = `Pours · Par ${par}`;
    $('statLeft').textContent = S.tubes.filter(t => t.length && !Rules.isFull(t)).length;
    $('movesStat').classList.toggle('over', S.par != null && S.moves > S.par);
    $('gold').textContent = progress.gold;

    const freeLeft = Math.max(0, CONFIG.economy.freeUndos - S.undosUsed);
    $('undoCost').textContent = freeLeft ? `${freeLeft} free` : `${CONFIG.economy.undoCost}`;
    $('undo').disabled = !S.history.length || busy ||
      (!undoIsFree() && !progress.canAfford(CONFIG.economy.undoCost));

    $('vesselCost').textContent = CONFIG.economy.vessel;
    $('vessel').disabled = busy || S.vesselUsed || !progress.canAfford(CONFIG.economy.vessel);
    $('vessel').classList.toggle('spent', S.vesselUsed);

    $('restart').disabled = (!S.history.length && !S.moves) || busy;
  }

  /* ---------- input ---------- */
  /* Logic resolves on tap. Animation trails behind in a queue, so a player can
     keep pouring without waiting for the bottle to finish tipping. */
  function tap(i){
    Audio.unlock();
    const sel = Board.selected;
    if (sel === null){
      if (!S.tubes[i].length || Rules.isFull(S.tubes[i])){ Board.nudge(i); Audio.deny(); return; }
      Board.selected = i;
      Board.el(i)?.classList.add('lifted');
      Audio.lift();
      return;
    }
    if (sel === i){
      Board.el(i)?.classList.remove('lifted');
      Board.selected = null;
      Audio.drop();
      return;
    }
    if (Rules.canPour(S.tubes, sel, i)){
      Board.el(sel)?.classList.remove('lifted');
      Board.selected = null;
      commit(sel, i);
    } else {
      Board.nudge(i);
      Audio.deny();
      Board.el(sel)?.classList.remove('lifted');
      Board.selected = null;
    }
  }
  function commit(from, to){
    const move = { from, to, n: Rules.pourAmount(S.tubes, from, to), color: S.tubes[from][S.tubes[from].length - 1] };
    S.history.push({ tubes: Rules.clone(S.tubes), moves: S.moves });
    Rules.applyMove(S.tubes, move);
    S.moves++;
    S.queue.push(move);
    paintHud();
    drain().catch(() => {});   /* drain's finally has already restored the state */
  }
  /* The view trails the logic here, so this loop owes the player two things: it
     must always let go of `running`, and it must always leave the view where the
     logic already is. Undo and Restart are disabled while a pour is in flight,
     so a drain that dies halfway strands the level with no way out but a reload. */
  async function drain(){
    if (S.running) return;
    S.running = true;
    try {
      while (S.queue.length){
        const move = S.queue.shift();
        try {
          await Board.animate(move);
        } catch {
          /* a dropped animation still owes the board its result */
        }
        Rules.applyMove(Board.view, move);
        Board.render();
        if (Rules.isFull(Board.view[move.to])) Board.seal(move.to);
      }
    } finally {
      S.running = false;
      paintHud();
    }
    if (Rules.isSolved(S.tubes)) finish();
  }

  /* ---------- finishing ---------- */
  function finish(){
    const stars = Rules.rate(S.moves, S.par, S.parExact, S.vesselUsed);
    const before = progress.starsFor(S.level);
    const result = progress.complete(S.level, S.moves, stars);
    const perfect = stars === 3;

    $('stars').innerHTML = [0,1,2].map(i => i < stars ? '★' : '<span class="dim">★</span>').join('');
    $('winTitle').textContent = perfect ? 'Poured clean' : 'Level cleared';
    const parLine = S.par == null
      ? ''
      : ` ${S.parExact ? 'The minimum is' : 'The best found is about'} ${S.par}.`;
    const bestLine = progress.bestFor(S.level) != null && progress.bestFor(S.level) < S.moves
      ? ` Your best here is ${progress.bestFor(S.level)}.` : '';
    $('winLine').textContent = `Sorted in ${S.moves} pours.${parLine}${bestLine}`;

    /* say where the gold came from, so the thin payouts read as earned */
    const parts = [`${stars}★`];
    if (result.firstClear) parts.push('first clear');
    $('goldEarned').textContent = `+${result.earned}`;
    $('goldWhy').textContent = `Gold · ${parts.join(' + ')}`;

    $('winHint').textContent = S.vesselUsed
      ? 'A bought vessel caps the run at two stars. Clear it unaided for the third.'
      : (perfect ? '' : 'Par or one over earns the third star.');
    $('retry').hidden = perfect;
    $('retry').classList.toggle('primary', !perfect);
    $('next').classList.toggle('primary', perfect);
    if (result.improvedStars && before > 0) $('winHint').textContent = 'New best for this level.';

    setTimeout(() => {
      Audio.win();
      Confetti.rain(CONFIG.palette.slice(0, Levels.shape(S.level).colors));
      $('veil').classList.add('show');
    }, 700);
  }

  /* ---------- wiring ---------- */
  function paintSound(on){
    document.querySelectorAll('.js-sound').forEach(b => {
      b.textContent = on ? 'Sound on' : 'Sound off';
      b.classList.toggle('off', !on);
    });
  }
  function bind(){
    Board.mount($('board'));
    Board.onTap = tap;
    MapView.mount($('mapScroll'));
    MapView.onPick = level => { Audio.unlock(); Audio.tick(); showGame(level); };

    $('undo').onclick = () => {
      if (S.queue.length || S.running || !S.history.length) return;
      /* charge before rolling back, so a refused payment changes nothing */
      if (!undoIsFree() && !progress.spend(CONFIG.economy.undoCost)){ Audio.deny(); return; }
      S.undosUsed++;
      const prev = S.history.pop();
      S.tubes = prev.tubes;
      S.moves = prev.moves;
      Board.view = Rules.clone(prev.tubes);
      Board.selected = null;
      Audio.drop();
      Board.render();
      paintHud();
    };
    $('vessel').onclick = () => {
      if (S.queue.length || S.running || S.vesselUsed) return;
      if (!progress.spend(CONFIG.economy.vessel)){ Audio.deny(); return; }
      S.vesselUsed = true;
      S.tubes.push([]);
      Board.view.push([]);
      /* the shelf changed shape, so the snapshots behind us no longer describe
         this board and undoing into one would quietly take the vessel back */
      S.history = [];
      Board.selected = null;
      Audio.lift();
      Board.render();
      paintHud();
    };
    $('restart').onclick = () => {
      if (S.queue.length || S.running) return;
      start(S.level, S.vesselUsed);
    };
    $('toMap').onclick = () => { Audio.tick(); showMap(false); };
    $('winMap').onclick = () => { $('veil').classList.remove('show'); showMap(true); };
    $('retry').onclick = () => { $('veil').classList.remove('show'); start(S.level); };
    $('next').onclick = () => { $('veil').classList.remove('show'); showGame(S.level + 1); };
    document.querySelectorAll('.js-sound').forEach(btn => {
      btn.onclick = () => {
        Audio.unlock();
        paintSound(Audio.toggle());
        progress.setSound(Audio.enabled);
        if (Audio.enabled) Audio.lift();
      };
    });
    $('mapPlay').onclick = () => { Audio.unlock(); showGame(progress.unlocked); };
    $('daily').onclick = () => {
      Audio.unlock();
      if (!progress.claimDaily(today())){ Audio.deny(); return; }
      Audio.lift();
      paintMap();
    };

    let rt;
    addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (document.body.dataset.view === 'map') MapView.render(progress);
        else if (!S.running && !S.queue.length) Board.render();
      }, 120);
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.dataset.view === 'game') showMap(false);
    });
  }
  return {
    boot(){
      publishPalette();
      bind();
      Audio.setEnabled(progress.sound);
      paintSound(progress.sound);
      showMap(false);
    },
    /* exposed for debugging in the console */
    _state: S, _progress: progress
  };
})();
globalThis.App = App;
document.addEventListener('DOMContentLoaded', () => App.boot());


/* ---- 95-pwa.js ---- */
/* Install prompt and service worker registration. */
(() => {
  let deferred = null;
  const btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (btn) btn.hidden = false;
  });
  if (btn){
    btn.onclick = async () => {
      if (!deferred) return;
      btn.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
  }
  addEventListener('appinstalled', () => { if (btn) btn.hidden = true; deferred = null; });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
