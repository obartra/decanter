<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decanter</title>
<meta name="theme-color" content="#1A120A">
<meta name="color-scheme" content="dark">
<meta name="description" content="A water sorting puzzle. Pour until every bottle holds one color.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decanter">
<meta name="build" content="927c76d367">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 700;font-display:swap;src:url(./fonts/cinzel.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/alegreyasans.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/alegreyasans-bold.woff2) format('woff2')}
</style>
<style>:root{
  --ink:#EFE4D2; --ink-dim:#A2907A;
  --gold:#E0B15C; --gold-lit:#F4D9A0;
  --glass-line:rgba(246,234,212,.42);
  /* --c0..--c11 are published from CONFIG.palette at boot, see 90-app.js */
  --bw:52px; --bh:calc(var(--bw)*3.3); --cap-h:calc(var(--bw)*.26);
  --cols:3; --units:4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Alegreya Sans",ui-sans-serif,system-ui,sans-serif;
  color:var(--ink); background:#0B0805;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* The room is drawn to a canvas behind everything, so it can put its shelf
   exactly where the bottles stand at any size. See 65-backdrop.js. */
.backdrop{position:fixed; inset:0; z-index:0; pointer-events:none}
.view{
  position:relative; z-index:1; height:100dvh; display:none;
  flex-direction:column; align-items:center;
  padding:clamp(10px,2.4vw,20px) 12px calc(12px + env(safe-area-inset-bottom));
  gap:clamp(8px,1.7vh,16px);
}
body[data-view="map"] #mapView,
body[data-view="game"] #gameView{display:flex}

.eyebrow{font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 3px}
/* Cinzel is inscriptional Roman caps, so it wants to be spaced out, not tightened */
.wordmark{
  font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(22px,5.4vw,33px); letter-spacing:.07em; line-height:1; margin:0;
  text-transform:uppercase;
  background:linear-gradient(180deg,#FBEBC8 0%, var(--gold) 52%, #A9762F 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 14px rgba(224,177,92,.28));
}
.wordmark.small{font-size:clamp(18px,4.6vw,24px)}

/* The browser hides [hidden] with display:none, which any rule that sets display
   outranks. .btn.priced does exactly that, so every priced button ignored its
   own hidden attribute: Retry showed on a clean run and Move On showed on a run
   that had not failed, both of them next to a Next Level that was correct. */
[hidden]{display:none !important}

.btn{
  font-family:inherit; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink); padding:10px 15px; border-radius:999px;
  border:1px solid rgba(224,177,92,.26);
  background:linear-gradient(180deg,rgba(60,44,26,.62),rgba(24,17,10,.52));
  backdrop-filter:blur(5px);
  cursor:pointer; transition:transform .15s, border-color .2s, opacity .2s;
}
.btn:hover{border-color:rgba(244,217,160,.55); transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.3; cursor:default; transform:none}
.btn.off{opacity:.45}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-dim)}
.btn.primary{border-color:rgba(250,232,190,.5); color:#2A1B08;
  background:linear-gradient(180deg,#F6E0B0,var(--gold) 60%,#B8823A);
  box-shadow:0 6px 22px rgba(224,177,92,.35)}
.controls{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}

#confetti{position:fixed; inset:0; z-index:95; pointer-events:none; overflow:hidden}
.conf{position:absolute; border-radius:1px; will-change:transform}

.veil{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:24px;
  background:linear-gradient(180deg,rgba(11,8,5,.90),rgba(6,4,2,.95));
  backdrop-filter:blur(7px); opacity:0; pointer-events:none; transition:opacity .4s ease;
}
.veil.show{opacity:1; pointer-events:auto}
.panel{
  text-align:center; max-width:340px; padding:28px 26px; border-radius:24px;
  border:1px solid rgba(224,177,92,.28);
  background:linear-gradient(180deg,rgba(46,33,19,.86),rgba(18,13,8,.82));
  backdrop-filter:blur(8px); box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.97); transition:transform .45s cubic-bezier(.2,1.2,.4,1);
}
.veil.show .panel{transform:none}
.panel h2{font-family:"Cinzel",serif; font-weight:700; font-size:26px; margin:0 0 8px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--gold-lit)}
.stars{font-size:26px; letter-spacing:6px; margin:2px 0 10px; color:var(--gold-lit)}
.stars .dim{color:rgba(239,228,210,.16)}
.panel p{color:var(--ink-dim); font-size:13px; line-height:1.6; margin:0 0 6px}
.panel .hint{color:var(--gold); font-size:11px; letter-spacing:.04em; min-height:16px; margin-bottom:16px}
.panelBtns{display:flex; gap:8px; justify-content:center; margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.08s !important}}

/* --- a run that failed ---
   A win fades in gently. A failure should not: it arrives, the room goes red,
   and the panel takes a knock, so losing the level is felt rather than read. */
.veil.failed{
  background:linear-gradient(180deg,rgba(38,6,10,.92),rgba(10,2,4,.96));
  transition:opacity .18s ease;
}
.veil.failed .panel{
  border-color:rgba(201,69,94,.5);
  background:linear-gradient(180deg,rgba(46,16,20,.9),rgba(16,6,8,.88));
  box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 60px rgba(201,69,94,.18);
}
.veil.failed.show .panel{animation:knock .5s cubic-bezier(.2,1.3,.4,1)}
.veil.failed h2{
  color:#E4778B; font-size:32px;
  animation:failIn .45s cubic-bezier(.2,1.4,.4,1);
}
.veil.failed .stars{color:rgba(201,69,94,.34); animation:failIn .5s .06s backwards}
@keyframes failIn{
  0%{transform:scale(1.9); opacity:0; letter-spacing:.4em}
  60%{opacity:1}
  100%{transform:scale(1); opacity:1; letter-spacing:.06em}
}
@keyframes knock{
  0%{transform:translateY(-16px) scale(1.04)}
  35%{transform:translateY(5px) scale(.99)}
  60%{transform:translateX(-6px)}
  75%{transform:translateX(5px)}
  88%{transform:translateX(-2px)}
  100%{transform:none}
}
.btn.priced small{pointer-events:none}
.btn.primary.priced small{color:#5C3F14}

.board{
  position:relative; display:grid;
  grid-template-columns:repeat(var(--cols), var(--bw));
  justify-content:center; align-content:center; place-items:center;
  flex:1; width:100%; min-height:0;
}
/* The stream sits behind the liquid, so where it meets what is already in the
   bottle it disappears into it rather than running over the top of it. Above the
   surface the canvas is transparent and the stream shows through as it falls.
   Board layers, back to front: stream, liquid, bottles. */
.fx{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:visible}

.bottle{
  -webkit-appearance:none; appearance:none; border:0; padding:0; background:none;
  position:relative; width:var(--bw); height:calc(var(--bh) + var(--cap-h));
  cursor:pointer; transform-origin:50% 50%; z-index:3;
  transition:transform .3s cubic-bezier(.4,.1,.3,1);
  will-change:transform; touch-action:manipulation;
}
.bottle:focus-visible{outline:none}
.bottle:focus-visible .glass{box-shadow:0 0 0 2px #fff, 0 0 26px rgba(232,190,110,.55)}
.bottle.lifted{transform:translateY(-20px)}
.bottle.pouring{z-index:60}
.bottle.thunk{animation:thunk .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes thunk{0%{transform:translateY(-5px)}40%{transform:translateY(3px) scaleY(.98)}
  70%{transform:translateY(-1px)}100%{transform:translateY(0)}}

.collar{
  position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:4;
  width:44%; height:calc(var(--cap-h) + 2px); border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#8A7247 0%,#4E3D22 42%,#291F10 100%);
  box-shadow:inset 0 1px 0 rgba(246,226,182,.5), inset -2px 0 3px rgba(0,0,0,.4);
}
.collar::after{content:""; position:absolute; left:14%; top:12%; width:16%; height:70%;
  border-radius:3px; background:rgba(255,255,255,.30)}

.glass{
  position:absolute; left:0; right:0; bottom:0; height:var(--bh);
  border-radius:calc(var(--bw)*.30) calc(var(--bw)*.30) calc(var(--bw)*.17) calc(var(--bw)*.17);
  overflow:hidden;
  background:linear-gradient(180deg, rgba(58,46,30,.40), rgba(20,15,9,.58));
  box-shadow:inset 0 0 0 1.5px var(--glass-line), inset 0 6px 14px rgba(255,232,186,.13),
             0 10px 26px rgba(0,0,0,.55), 0 0 22px rgba(224,177,92,.14);
  transition:box-shadow .4s ease;
}
.fill{position:absolute; inset:0; display:flex; flex-direction:column-reverse}
.band{width:100%; flex:0 0 auto; transition:height .2s ease}
.band.crest{box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 7px 10px rgba(255,255,255,.09)}
.gloss{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  background:linear-gradient(96deg, rgba(255,255,255,0) 0 5%, rgba(255,255,255,.32) 5% 12%,
    rgba(255,255,255,.06) 12% 19%, rgba(255,255,255,0) 19% 74%,
    rgba(255,255,255,.13) 74% 80%, rgba(255,255,255,0) 80% 100%);
}
.gloss::after{content:""; position:absolute; left:6%; top:1.5%; width:52%; height:9%; border-radius:50%;
  background:radial-gradient(ellipse at 35% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%)}
.sheen{
  position:absolute; top:-10%; bottom:-10%; width:62%; left:-95%; z-index:7;
  pointer-events:none; transform:skewX(-14deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
}
.sheen.run{animation:sheen .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sheen{to{left:135%}}

/* cork: the plug is inside the neck, clipped by the glass. It is deliberately
   short. At half the bottle's width it hung well down past the neck and read as
   a long stopper sitting in the wine rather than a cork seated in the mouth. */
.bottle.done .glass{
  box-shadow:inset 0 0 0 1.5px rgba(252,238,208,.8), inset 0 6px 14px rgba(255,226,170,.18),
             0 10px 24px rgba(0,0,0,.5), 0 0 32px rgba(232,190,110,.45);
}
.plug{
  position:absolute; left:50%; top:0; z-index:5;
  width:46%; height:calc(var(--bw)*.30);
  transform:translateX(-50%);
  clip-path:polygon(3% 0, 97% 0, 86% 82%, 78% 100%, 22% 100%, 14% 82%);
  background:
    repeating-linear-gradient(88deg, rgba(108,62,22,.18) 0 1px, rgba(255,238,210,.06) 1px 5px),
    linear-gradient(180deg,#EFCC9C 0%, #C99A5C 42%, #8F6231 100%);
  box-shadow:inset 0 -7px 9px rgba(70,38,10,.5), inset 0 2px 0 rgba(255,246,228,.55);
}
.plug::after{content:""; position:absolute; left:-40%; right:-40%; top:98%; height:12px;
  background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.5), rgba(0,0,0,0) 72%)}
.corktop{
  position:absolute; left:50%; top:calc(var(--bw)*-0.07); z-index:5;
  width:52%; height:calc(var(--bw)*.20);
  transform:translateX(-50%); border-radius:5px 5px 2px 2px;
  background:
    repeating-linear-gradient(87deg, rgba(108,62,22,.14) 0 1px, rgba(255,240,215,.07) 1px 4px),
    linear-gradient(180deg,#F7DEB4 0%, #D8A76D 62%, #B9884C 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,250,238,.95), 0 3px 6px rgba(0,0,0,.55);
}
.plug.pop{animation:plugin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes plugin{
  0%{transform:translateX(-50%) translateY(-150%)}
  58%{transform:translateX(-50%) translateY(7%) scaleY(.88)}
  78%{transform:translateX(-50%) translateY(-3%) scaleY(1.05)}
  100%{transform:translateX(-50%) translateY(0) scaleY(1)}
}
.corktop.pop{animation:capin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes capin{
  0%{transform:translate(-50%,-64px) rotate(-15deg); opacity:0}
  28%{opacity:1}
  58%{transform:translate(-50%,3px) rotate(0deg) scaleY(.78)}
  78%{transform:translate(-50%,-2px) scaleY(1.07)}
  100%{transform:translate(-50%,0) scaleY(1)}
}
.ring{
  position:absolute; left:50%; top:calc(var(--cap-h)); z-index:8;
  width:14px; height:14px; margin-left:-7px; border-radius:50%;
  border:2px solid rgba(255,232,196,.95); pointer-events:none;
  animation:ring .6s ease-out forwards;
}
@keyframes ring{0%{transform:scale(.3);opacity:0}20%{opacity:1}100%{transform:scale(6);opacity:0}}

.bead{
  position:absolute; z-index:1; border-radius:52% 52% 46% 46%; pointer-events:none;
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.25), inset 2px 2px 3px rgba(255,255,255,.45);
}
/* Splash and droplets belong with the stream, behind the liquid: what lands in
   the bottle goes under what is already there, not over it. */
.pool{
  position:absolute; z-index:1; border-radius:50%; pointer-events:none;
  height:7px; opacity:.7; animation:pool .55s ease-out infinite;
}
@keyframes pool{0%{transform:translateX(-50%) scale(.4,.6);opacity:.8}
  100%{transform:translateX(-50%) scale(1.6,1);opacity:0}}
.drop{position:absolute; border-radius:50%; z-index:54; pointer-events:none}

/* --- particle liquid ---
   When the sim is running it draws every bottle's contents onto one canvas over
   the board, so the DOM bands stand down. The glass, collar, sheen and cork are
   still DOM: only the liquid moves to the canvas. */
.board.simulated .fill{opacity:0}
.fluidLayer{
  position:absolute; inset:0; z-index:2;
  pointer-events:none;
}

.gameHeader{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; max-width:520px; gap:8px;
}
.gameHeader .spacer{width:72px}
.hud{display:flex; gap:6px}
.stat{
  min-width:62px; padding:6px 10px 7px; text-align:center;
  border:1px solid rgba(224,177,92,.20); border-radius:11px;
  background:linear-gradient(180deg,rgba(52,38,22,.58),rgba(20,14,9,.48));
  backdrop-filter:blur(6px);
}
.stat b{display:block; font-family:"Cinzel",serif; font-weight:600; font-size:17px; line-height:1.15; color:#fff}
.stat span{color:var(--ink-dim); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase}
.stat.over b{color:#F0894F}
/* the count is the counter now, so this chip carries the weight */
.stat.wide{min-width:132px; padding-top:4px}
/* One number, falling, ending at nothing. The stars underneath say what the
   run is still worth; this says how much of it is left. */
.hudCount{
  font-family:"Cinzel",serif; font-size:27px; line-height:1.05;
  color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.5);
  font-variant-numeric:tabular-nums;
}
.stat.over .hudCount{color:#F0894F}
.stat.spent .hudCount{color:#E4778B}
.hudStars{
  font-family:"Cinzel",serif; font-size:13px; letter-spacing:3px;
  color:var(--gold-lit); line-height:1.15;
  text-shadow:0 1px 8px rgba(224,177,92,.35);
}
.hudStars .dim{color:rgba(239,228,210,.20); text-shadow:none}
/* The last star, then none: the chip warms and then goes out. Scoped to the
   direct child, because the spent stars are spans too and were being coloured
   as though they were the label. */
.stat.over{border-color:rgba(240,137,79,.45)}
.stat.over > span{color:#F0894F}
.stat.spent{border-color:rgba(201,69,94,.5)}
.stat.spent > span{color:#E4778B}

/* --- gold --- */
.purse{
  display:flex; align-items:center; gap:5px; min-width:72px; justify-content:flex-end;
  font-family:"Cinzel",serif; font-weight:600; font-size:15px; color:#F4D9A0;
}
.purse .coin{color:#E0B15C; font-size:11px}
.btn.priced{display:inline-flex; flex-direction:column; align-items:center; gap:1px; line-height:1.1}
.btn.priced small{
  font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:#E0B15C; font-weight:600;
}
.btn.priced:disabled small{color:var(--ink-dim)}
.btn.priced.spent small{text-decoration:line-through}
.payout{display:flex; align-items:baseline; justify-content:center; gap:8px; margin:2px 0 10px}
.payout b{font-family:"Cinzel",serif; font-weight:700; font-size:22px; color:#F4D9A0}
.payout span{color:var(--ink-dim); font-size:9px; letter-spacing:.16em; text-transform:uppercase}

.mapHeader{
  display:flex; align-items:flex-end; justify-content:space-between;
  width:100%; max-width:520px; gap:12px;
}
.mapMeta{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.tally{text-align:right}
.tally b{
  display:block; font-family:"Cinzel",serif; font-weight:900; font-size:26px;
  line-height:1; color:var(--gold-lit);
}
.tally span{font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}

.mapScroll{
  position:relative; flex:1; width:100%; max-width:520px; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(180deg, transparent 0, #000 64px, #000 calc(100% - 24px), transparent 100%);
}
.mapScroll::-webkit-scrollbar{width:0}
.mapCanvas{position:relative; width:100%}
.mapPath{position:absolute; left:0; bottom:0; pointer-events:none}

.chapter{
  position:absolute; left:0; right:0; text-align:center; pointer-events:none;
}
.chapter span{
  display:inline-block; position:relative;
  font-family:"Cinzel",serif; font-weight:600; font-size:14px; letter-spacing:.02em;
  color:var(--tint); padding:0 14px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.chapter span::before,.chapter span::after{
  content:""; position:absolute; top:50%; width:52px; height:1px;
  background:linear-gradient(90deg, transparent, var(--tint));
  opacity:.5;
}
.chapter span::before{right:100%}
.chapter span::after{left:100%; transform:scaleX(-1)}

.node{
  position:absolute; transform:translate(-50%, 50%);
  width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center; gap:0;
  font-family:"Cinzel",serif; font-weight:600; font-size:19px; color:#fff;
  cursor:pointer; padding:0;
  border:1.5px solid rgba(224,177,92,.34);
  background:linear-gradient(180deg, rgba(64,47,27,.82), rgba(26,18,11,.78));
  box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(244,217,160,.22);
  transition:transform .18s cubic-bezier(.3,1.3,.5,1), box-shadow .25s;
}
.node:hover:not(:disabled){transform:translate(-50%,50%) scale(1.08)}
.node .num{line-height:1}
.node .ns{
  position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
  font-size:10px; letter-spacing:1px; color:var(--gold-lit); white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.node .ns i{color:rgba(239,228,210,.20); font-style:normal}

.node.cleared{
  border-color:color-mix(in srgb, var(--tint) 60%, transparent);
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
    linear-gradient(180deg, color-mix(in srgb, var(--tint) 85%, #fff 15%), color-mix(in srgb, var(--tint) 70%, #000 30%));
  box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 22px color-mix(in srgb, var(--tint) 35%, transparent);
  color:#231607;
}
.node.current{
  border-color:rgba(250,232,190,.8);
  background:linear-gradient(180deg,#FBEBC8,var(--gold) 62%,#B8823A);
  color:#2A1B08; font-size:21px;
  box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 34px rgba(224,177,92,.5);
  animation:beacon 2.4s ease-in-out infinite;
}
@keyframes beacon{
  0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 30px rgba(224,177,92,.4)}
  50%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 12px rgba(224,177,92,.05), 0 0 44px rgba(238,197,120,.65)}
}
/* Locked, but still on the shelf. These were faint enough to disappear into the
   road, which loses the sense of a path carrying on past where you have got to.
   They read as unplayable by being cold and flat rather than by being invisible:
   the border stays well under the one an open level gets, the fill stays darker
   than the warm brown, and nothing here glows.

   Ordered before the buyable rules on purpose. A buyable node is a locked node
   too, and at equal weight the later rule wins. */
.node.locked{
  cursor:default; font-size:15px; color:rgba(239,228,210,.52);
  border-color:rgba(224,177,92,.24);

<script id="solverSrc" type="text/js-worker">/* Water-sort solver. Shipped verbatim inside the page as a Web Worker.
   Uses A* with a consistent, admissible heuristic:
     h = (total contiguous color segments) - (number of colors)
   A pour moves one maximal top run, so it merges at most one segment per move.
   Therefore each move lowers the segment count by at most 1, and the goal has
   exactly one segment per color. A* with a consistent heuristic and a closed
   set returns a true minimum. */
var CAP = 4;

function cl(t){ var o=[],i; for(i=0;i<t.length;i++) o.push(t[i].slice()); return o; }
function keyOf(t){ var a=[],i; for(i=0;i<t.length;i++) a.push(t[i].join(',')); a.sort(); return a.join('|'); }
function full(t){ if(t.length!==CAP) return false; for(var i=1;i<t.length;i++) if(t[i]!==t[0]) return false; return true; }
function done(s){ for(var i=0;i<s.length;i++) if(s[i].length && !full(s[i])) return false; return true; }
function segs(s){ var n=0,i,j; for(i=0;i<s.length;i++) for(j=0;j<s[i].length;j++) if(j===0||s[i][j]!==s[i][j-1]) n++; return n; }

/* every move the game itself allows, with no pruning */
function rawMoves(s){
  var out=[],a,b,A,B,top,run,i;
  for(a=0;a<s.length;a++){
    A=s[a]; if(!A.length) continue;
    if(full(A)) continue;
    top=A[A.length-1]; run=1;
    for(i=A.length-2;i>=0&&A[i]===top;i--) run++;
    for(b=0;b<s.length;b++){
      if(a===b) continue;
      B=s[b];
      if(B.length>=CAP) continue;
      if(B.length && B[B.length-1]!==top) continue;
      out.push([a,b,Math.min(run, CAP-B.length)]);
    }
  }
  return out;
}

/* same set, minus moves that cannot change the canonical state:
   - a uniform tube emptied into an empty tube (identical multiset of tubes)
   - duplicate destinations (empty tubes are interchangeable, as are equal tubes) */
function moveList(s){
  var out=[],a,b,A,B,top,run,i,whole,emptySeen,dstSeen,k;
  for(a=0;a<s.length;a++){
    A=s[a]; if(!A.length) continue;
    if(full(A)) continue;
    top=A[A.length-1]; run=1;
    for(i=A.length-2;i>=0&&A[i]===top;i--) run++;
    whole=(run===A.length);
    emptySeen=false; dstSeen={};
    for(b=0;b<s.length;b++){
      if(a===b) continue;
      B=s[b];
      if(B.length>=CAP) continue;
      if(!B.length){
        if(whole) continue;
        if(emptySeen) continue;
        emptySeen=true;
      } else {
        if(B[B.length-1]!==top) continue;
        k=B.join(','); if(dstSeen[k]) continue; dstSeen[k]=1;
      }
      out.push([a,b,Math.min(run, CAP-B.length)]);
    }
  }
  return out;
}
function doMove(s,m){ var i; for(i=0;i<m[2];i++) s[m[1]].push(s[m[0]].pop()); }

function astar(start, colors, nodeCap, msCap){
  var t0 = Date.now();
  var buckets=[], gmap=Object.create(null), remaining=0, f=0, expanded=0;
  function push(fv,st,g){
    if(!buckets[fv]) buckets[fv]=[];
    buckets[fv].push({s:st,g:g});
    remaining++;
  }
  gmap[keyOf(start)]=0;
  push(segs(start)-colors, cl(start), 0);
  while(remaining>0){
    while(f<buckets.length && (!buckets[f] || !buckets[f].length)) f++;
    if(f>=buckets.length) break;
    var node=buckets[f].pop(); remaining--;
    var k=keyOf(node.s);
    if(gmap[k]!==undefined && gmap[k]<node.g) continue;
    if(done(node.s)) return {par:node.g, exact:true, expanded:expanded};
    if(++expanded>nodeCap) return {par:null, exact:false, expanded:expanded};
    if((expanded & 1023)===0 && msCap && Date.now()-t0>msCap) return {par:null, exact:false, expanded:expanded};
    var ms=moveList(node.s), i;
    for(i=0;i<ms.length;i++){
      var nx=cl(node.s); doMove(nx,ms[i]);
      var nk=keyOf(nx), ng=node.g+1;
      if(gmap[nk]!==undefined && gmap[nk]<=ng) continue;
      gmap[nk]=ng;
      push(ng + segs(nx) - colors, nx, ng);
    }
  }
  return {par:null, exact:false, expanded:expanded};
}

/* upper bound when the exact search runs out of budget */
function anySolution(start){
  var stack=[{s:cl(start),d:0}], seen=Object.create(null), n=0;
  while(stack.length){
    if(n++>150000) return null;
    var cur=stack.pop(), k=keyOf(cur.s);
    if(seen[k]) continue; seen[k]=1;
    if(done(cur.s)) return cur.d;
    var ms=moveList(cur.s), i;
    for(i=0;i<ms.length;i++){ var nx=cl(cur.s); doMove(nx,ms[i]); stack.push({s:nx,d:cur.d+1}); }
  }
  return null;
}

self.onmessage = function(e){
  var d=e.data;
  CAP = d.cap;
  var r = astar(d.tubes, d.colors, d.nodeCap||400000, d.msCap||7000);
  if(r.par===null){ r = {par:anySolution(d.tubes), exact:false}; }
  self.postMessage({id:d.id, par:r.par, exact:r.exact});
};

<script>
/* ---- 00-config.js ---- */
/* Tunables that other modules read. Pure data, safe to load anywhere. */
const CONFIG = {
  capacity: 4,
  maxColors: 12,
  minColors: 4,
  /* Bumped whenever a level number starts dealing a different board, which so
     far means regenerating src/js/32-order.js. It invalidates the par a save has
     cached, which belongs to a board that no longer exists. It does not touch
     what a player earned; see 40-progress.js. */
  layout: 5,
  /* Liquid palette, index === colour id, and the only place a liquid colour is
     written down. The --cN custom properties the stylesheets use are published
     from here at boot, so the bands, the pour and the particle sim cannot drift
     apart the way they did when the palette lived in two files.

     Chosen so that no two liquids are close to the eye. The previous set was
     picked by hand and two pairs sat at a CIEDE2000 distance of about 12, which
     is close enough to lose a level to, and seven pairs sat under 20. Every hue
     here is within twelve degrees of the one it replaced, so the family is the
     same; the separation is bought with lightness and chroma instead. The worst
     pair is now about 24. See the test, which measures it. */
  palette: ['#E2546F','#B08016','#32D8B5','#95B9F6','#A36AC4','#36756F',
            '#F1B7D1','#FF9E75','#1A64A6','#629D38','#734555','#D3C9A0'],
  sectionSize: 10,
  sectionNames: ['The Cellar','The Apothecary','The Distillery',
                 'The Conservatory','The Vault','The Observatory'],
  sectionTints: ['#7BC142','#F5B932','#3AA3E3','#9B5DE5','#FF6FA5','#1FC7A8'],
  /* how far past the frontier the map lets you see */
  lookahead: 2,
  solver: { nodeCap: 400000, msCap: 8000 },
  /* Gold is deliberately thin: the only rescue worth buying costs about three
     well-played new levels, and replaying old ones barely pays, so a stockpile
     has to be earned on new boards rather than ground out on cleared ones.
     A good first run pays 14, a replay 6, a sloppy replay 1. */
  economy: {
    startingGold: 86,
    starGold: { 3: 6, 2: 3, 1: 1 },
    firstClear: 8,
    daily: 12,
    vessel: 45,
    freeUndos: 3,
    undoCost: 8,
    /* Every board dealt costs the same, whether it is a new level or another go
       at one you just lost. It is the entry fee that gives a failed run a price:
       without it, failing costs nothing but the time already spent. Small enough
       that the daily draught alone keeps anyone solvent. */
    attempt: 5,
    /* Paying past a board you cannot beat costs twice an attempt, and that covers
       dealing the next one too, so moving on is one decision rather than two
       charges. Derived from the attempt fee so the two cannot drift apart. */
    skipMultiple: 2
  },
  /* Stars are pours over par: par earns three, one over two, two over one, and
     three or more over is a failed run worth nothing. */
  stars: { three: 0, two: 1, one: 2 }
};
globalThis.CONFIG = CONFIG;


/* ---- 10-rng.js ---- */
/* Deterministic RNG. Level N must generate the same puzzle on every device and
   every run, otherwise stars and best scores on the map mean nothing. */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* avalanche so adjacent level numbers give unrelated boards */
function hashSeed(n){
  let h = (2166136261 ^ n) >>> 0;
  h = Math.imul(h, 16777619) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 16777619) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));

  }

}
globalThis.RNG = { mulberry32, hashSeed, shuffleWith };


/* ---- 20-rules.js ---- */
/* The rules of the puzzle, and nothing else. No DOM, no timing, no state. */
const CAP = CONFIG.capacity;

const clone = tubes => tubes.map(t => t.slice());
const isFull = t => t.length === CAP && t.every(c => c === t[0]);
const isSolved = tubes => tubes.every(t => t.length === 0 || isFull(t));
/* canonical key: bottle order does not matter, so sort before comparing */
const keyOf = tubes => tubes.map(t => t.join(',')).sort().join('|');

function runLength(t){
  if (!t.length) return 0;
  let n = 1;
  for (let i = t.length - 2; i >= 0 && t[i] === t[t.length - 1]; i--) n++;
  return n;
}
/* a pour is legal when the source has liquid, is not already finished, and the
   target has room and either matches on top or is empty */
function canPour(tubes, a, b){
  if (a === b) return false;
  const src = tubes[a], dst = tubes[b];
  if (!src || !dst) return false;
  if (!src.length || isFull(src)) return false;
  if (dst.length >= CAP) return false;
  if (!dst.length) return true;
  return dst[dst.length - 1] === src[src.length - 1];

/* the whole top run moves, unless the target runs out of room first */
function pourAmount(tubes, a, b){
  if (!canPour(tubes, a, b)) return 0;
  return Math.min(runLength(tubes[a]), CAP - tubes[b].length);
}
function applyMove(tubes, move){
  for (let i = 0; i < move.n; i++) tubes[move.to].push(tubes[move.from].pop());
  return tubes;
}
function legalMoves(tubes){
  const out = [];
  for (let a = 0; a < tubes.length; a++)
    for (let b = 0; b < tubes.length; b++)
      if (canPour(tubes, a, b)) out.push({ from:a, to:b, n:pourAmount(tubes, a, b) });
  return out;
}
/* depth-first probe, used at generation time to reject dead boards cheaply */
/* The fewest pours that could possibly finish this board: one per contiguous
   run of colour, less the one run per colour that is allowed to remain. A pour
   moves one maximal run and can close at most one, so this can never overstate
   what is left to do. Understating it is fine and expected.

   Being a lower bound is the whole point: if it exceeds the pours a run has
   left, that run cannot be finished, and saying so is a fact rather than a
   guess. isSolvable cannot be used for this, because it returns false when it
   runs out of nodes and would accuse a player of losing a board they could
   still have won. */

  let segments = 0;

  for (const t of tubes){
    for (let i = 0; i < t.length; i++){
      if (i === 0 || t[i] !== t[i - 1]) segments++;
      colours.add(t[i]);
    }

/* Pours left before the run is lost. A run fails one pour past the last one
   that still scores, so this is the number that actually ends it, and from par
   onwards it equals the star count: both reach nothing on the same pour. */
function poursLeft(moves, par, exact){
  if (par == null || !exact) return null;
  return Math.max(0, par + CONFIG.stars.one + 1 - moves);
}

/* Why this run is over, or null while it is still alive.

   Both answers are certain. No legal pour is a dead board, and a lower bound on
   the work left that exceeds the pours left cannot be beaten. Neither can be
   wrong, which matters: the cost of being wrong is ending somebody's run for
   them. isSolvable is not used here for exactly that reason, since it returns
   false when it runs out of nodes and cannot tell that apart from a board that
   genuinely cannot be finished.

   Said as soon as it is true, rather than when the count runs out. Making a
   player keep pouring at a board that cannot be won is worse than losing. */
function lostBecause(tubes, moves, par, exact){
  if (isSolved(tubes)) return null;
  if (!legalMoves(tubes).length) return 'stuck';
  const left = poursLeft(moves, par, exact);
  if (left == null) return null;
  if (left <= 0) return 'over';
  if (minPours(tubes) > left) return 'short';
  return null;
}

function isSolvable(start, nodeCap = 40000){
  const seen = new Set();
  const stack = [clone(start)];
  let nodes = 0;
  while (stack.length){
    if (++nodes > nodeCap) return false;
    const cur = stack.pop();
    const k = keyOf(cur);
    if (seen.has(k)) continue;
    seen.add(k);
    if (isSolved(cur)) return true;
    for (let a = 0; a < cur.length; a++){
      if (!cur[a].length || isFull(cur[a])) continue;
      const uniform = cur[a].every(c => c === cur[a][0]);
      for (let b = 0; b < cur.length; b++){
        if (!canPour(cur, a, b)) continue;
        if (!cur[b].length && uniform) continue;   // relocating a uniform bottle changes nothing
        stack.push(applyMove(clone(cur), { from:a, to:b, n:pourAmount(cur, a, b) }));
      }
    }
  }
  return false;
}
/* Three stars at par, two one over, one two over. Three or more over the minimum
   is a failed run: the bottles are sorted, but not well enough to count.

   An inexact par is an upper bound the search settled for, not the minimum, so
   it cannot decide any bracket, least of all a failing one: it is treated the
   same as no par at all rather than scored as if it were real.

   A bought vessel caps the run at two stars. Par is the minimum for the bottles
   the level deals you, so once an extra one is on the shelf the board is easier
   than the number being scored against, and the third star would be measuring a
   different puzzle from the one par describes. */
function rate(moves, par, exact = true, vesselUsed = false){
  const cap = vesselUsed ? 2 : 3;
  if (par == null || !exact) return cap;
  const over = moves - par;
  const earned = over <= CONFIG.stars.three ? 3
               : over <= CONFIG.stars.two ? 2
               : over <= CONFIG.stars.one ? 1
               : 0;
  return Math.min(earned, cap);
}
globalThis.Rules = { CAP, clone, isFull, isSolved, keyOf, runLength, minPours,
                     canPour, pourAmount, applyMove, legalMoves, isSolvable, rate,

/* ---- 30-levels.js ---- */
/* Level definition. Deterministic in the level number, so level 12 is the same
   puzzle for everyone, forever. */
/* What a level is made of, before ORDER gets a say. Bottle count is always even
   so the board can lay out in two equal rows: the layout only takes row counts
   that divide the bottles exactly. */
function baseShape(level){
  const colors = Math.min(CONFIG.minColors + Math.floor((level - 1) / 2), CONFIG.maxColors);
  const empties = colors % 2 === 0 ? 2 : 3;
  return { colors, empties, bottles: colors + empties };
}
/* A level is `[colours, empties, seed]` in ORDER, or the formula above seeded by
   the level number. The three travel together because all three decide which
   board you are dealt, and splitting them let the par table and the ordering
   disagree about what a level even was.

   ORDER exists because measured difficulty and level number were uncorrelated.
   It is free to swap the two shapes that share a bottle count, so a level can be
   dealt six colours and two empties where the formula said five and three. The
   board is the same size either way, and the empty count turned out to matter
   far more than the colour count: every extra empty adds legal moves, most of
   which are wrong. See tools/order.mjs. */

  const e = globalThis.ORDER && globalThis.ORDER[level];
  return Array.isArray(e) && e.length === 3 && e.every(Number.isInteger) ? e : null;
}
function shape(level){
  const e = entryFor(level);
  if (!e) return baseShape(level);
  return { colors: e[0], empties: e[1], bottles: e[0] + e[1] };
}
function seedFor(level){
  const e = entryFor(level);
  return e ? e[2] : level;
}
/* Deal a board directly. `make` is this with the level number looked up first;
   tools that measure candidate boards call it with shapes no level uses yet. */
function deal(colors, empties, seed){
  const cap = CONFIG.capacity;
  const rng = RNG.mulberry32(RNG.hashSeed(seed));
  for (let attempt = 0; attempt < 200; attempt++){
    const pool = [];
    for (let c = 0; c < colors; c++)
      for (let k = 0; k < cap; k++) pool.push(c);
    RNG.shuffleWith(rng, pool);
    const tubes = [];
    for (let i = 0; i < colors; i++) tubes.push(pool.slice(i * cap, (i + 1) * cap));
    for (let i = 0; i < empties; i++) tubes.push([]);
    if (tubes.some(Rules.isFull)) continue;        // no bottle starts finished
    if (!Rules.isSolvable(tubes)) continue;
    return tubes;
  }

}
function make(level, seed){
  const { colors, empties } = shape(level);
  return deal(colors, empties, seed == null ? seedFor(level) : seed);
}

  const i = sectionOf(level);
  return i < CONFIG.sectionNames.length
    ? CONFIG.sectionNames[i]
    : `Reserve ${i - CONFIG.sectionNames.length + 1}`;
}

globalThis.Levels = { shape, baseShape, deal, make, seedFor, sectionOf, sectionName, sectionTint, isSectionStart };


/* ---- 32-order.js ---- */
/* Generated by `npm run order`. Do not edit by hand.

   What each level deals, as [colours, empties, seed]. The bottle count still
   follows the level number, so the board grows steadily; within a bottle count

/* ---- 45-panel.js ---- */
/* What the end-of-run panel should say, as a decision rather than a pile of DOM
   writes. The app does the writing; this decides.

   Split out because the interesting cases are the ones hardest to reach by hand:
   the last level of the graded game, a failed run with an empty purse, a board
   nobody can crack. Reaching any of them in a browser means actually playing a
   level, and the pours are animated, so a hidden or throttled tab cannot get
   there at all. Everything here is decided from numbers, so the cases can simply
   be asserted. */
function decide(input){
  const {
    level, lastLevel, failed, stars, nextUnlocked,
    canPayFee, canPaySkip, improvedStars, hadStars, par, parExact, moves, best, totalStars,
    reason
  } = input;

  const perfect = stars === 3;
  /* There is nothing past the graded range: a level with no par cannot be
     scored, and rate() awards full marks when it has no bar to measure against,
     so offering one would hand out a run that can neither be failed nor played
     badly. */
  const atEnd = level >= lastLevel;
  const stuck = !atEnd && failed && !nextUnlocked;

  /* A lost run is told what ended it. "Too many pours" is only true of one of
     the three ways to lose, and saying it for a board with nothing left to pour
     would be plainly wrong to anyone looking at the board. */
  const title = !failed ? (perfect ? 'Poured clean' : 'Level cleared')
    : reason === 'stuck' ? 'Nowhere left to pour'
    : reason === 'short' ? 'Not enough pours left'
    : 'Too many pours';

  /* Last writer wins, so the order is the priority order. Being told the game is
     over does not help someone who cannot afford another go, so an empty purse
     outranks it; a new best outranks the standing advice. */
  let hint = '';
  if (failed){
    hint = reason === 'stuck' ? 'No pour is legal from here.'
      : reason === 'short' ? 'What is left needs more pours than the run had.'
      : par != null ? `Clear it in ${par + CONFIG.stars.one} or fewer.` : '';
  }
  if (!failed && improvedStars && hadStars > 0) hint = 'New best for this level.';
  if (atEnd && canPayFee){
    hint = failed
      ? 'The last one. Another go?'
      : `That is the last of them. ${totalStars} stars from ${lastLevel} levels.`;
  }
  if (!canPayFee || (stuck && !canPaySkip)) hint = 'Not enough gold. The daily draught is on the map.';

  /* Matching the minimum is the whole point of the scoring, so say that and stop.
     Quoting the count twice ("sorted in 12 pours, the minimum is 12") makes the
     reader do the comparison the sentence was supposed to make for them. */
  const atPar = !failed && parExact && par != null && moves === par;
  const parLine = par == null ? ''
    : parExact ? ` The minimum is ${par}.`
    : ` The best found is about ${par}.`;
  const bestLine = !failed && best != null && best < moves ? ` Your best here is ${best}.` : '';
  const line = atPar
    ? 'Solved in the minimum moves.'
    : `Sorted in ${moves} pours.${parLine}${bestLine}`;

  return {
    atEnd,
    title,
    line,
    stuck,
    retryHidden: perfect,
    retryPrimary: !perfect,
    retryDisabled: !canPayFee,
    nextHidden: atEnd || (failed && !nextUnlocked),
    nextPrimary: perfect && !atEnd,
    nextDisabled: !canPayFee,
    skipHidden: !stuck,
    skipDisabled: !canPaySkip,
    hint
  };
}

/* Talks to the A* solver. Prefers a real worker so a long search never blocks
   the UI, and degrades to an inline run with a small budget if workers are
   unavailable (some sandboxed embeds). */
const SolverClient = (() => {
  let worker = null, ok = true, nextId = 1;
  const pending = new Map();

  function source(){
    const el = document.getElementById('solverSrc');
    return el ? el.textContent : '';
  }
  function boot(){
    if (worker || !ok) return;
    try {
      const blob = new Blob([source()], { type: 'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = e => {
        const cb = pending.get(e.data.id);
        if (cb){ pending.delete(e.data.id); cb(e.data); }
      };
      worker.onerror = () => { ok = false; worker = null; };
    } catch (e) { ok = false; }
  }
  function inline(payload, cb){
    setTimeout(() => {
      try {
        const stub = {};
        new Function('self', source())(stub);
        stub.postMessage = m => cb(m);
        stub.onmessage({ data: Object.assign({}, payload, { nodeCap: 60000, msCap: 1200 }) });
      } catch (e) { cb({ id: payload.id, par: null, exact: false }); }
    }, 20);
  }
  return {
    solve(tubes, colors, cb){
      boot();
      const id = nextId++;
      const payload = {
        id, tubes: Rules.clone(tubes), cap: Rules.CAP, colors,
        nodeCap: CONFIG.solver.nodeCap, msCap: CONFIG.solver.msCap
      };
      if (worker && ok){ pending.set(id, cb); worker.postMessage(payload); }
      else inline(payload, cb);
      return id;
    }
  };
})();
globalThis.SolverClient = SolverClient;
