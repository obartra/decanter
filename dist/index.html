<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decanter</title>
<meta name="theme-color" content="#1A120A">
<meta name="color-scheme" content="dark">
<meta name="description" content="A water sorting puzzle. Pour until every bottle holds one color.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decanter">
<meta name="build" content="60208f008f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Cinzel';font-style:normal;font-weight:400 700;font-display:swap;src:url(./fonts/cinzel.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:400;font-display:swap;src:url(./fonts/alegreyasans.woff2) format('woff2')}
@font-face{font-family:'Alegreya Sans';font-style:normal;font-weight:700;font-display:swap;src:url(./fonts/alegreyasans-bold.woff2) format('woff2')}
</style>
<style>:root{
  --ink:#EFE4D2; --ink-dim:#A2907A;
  --gold:#E0B15C; --gold-lit:#F4D9A0;
  --glass-line:rgba(246,234,212,.42);
  /* --c0..--c11 are published from CONFIG.palette at boot, see 90-app.js */
  --bw:52px; --bh:calc(var(--bw)*3.3); --cap-h:calc(var(--bw)*.26);
  --cols:3; --units:4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Alegreya Sans",ui-sans-serif,system-ui,sans-serif;
  color:var(--ink); background:#0B0805;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
/* The room is drawn to a canvas behind everything, so it can put its shelf
   exactly where the bottles stand at any size. See 65-backdrop.js. */
.backdrop{position:fixed; inset:0; z-index:0; pointer-events:none}
.view{
  position:relative; z-index:1; height:100dvh; display:none;
  flex-direction:column; align-items:center;
  padding:clamp(10px,2.4vw,20px) 12px calc(12px + env(safe-area-inset-bottom));
  gap:clamp(8px,1.7vh,16px);
}
body[data-view="map"] #mapView,
body[data-view="game"] #gameView{display:flex}

.eyebrow{font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 3px}
/* Cinzel is inscriptional Roman caps, so it wants to be spaced out, not tightened */
.wordmark{
  font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(22px,5.4vw,33px); letter-spacing:.07em; line-height:1; margin:0;
  text-transform:uppercase;
  background:linear-gradient(180deg,#FBEBC8 0%, var(--gold) 52%, #A9762F 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 14px rgba(224,177,92,.28));
}
.wordmark.small{font-size:clamp(18px,4.6vw,24px)}

.btn{
  font-family:inherit; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink); padding:10px 15px; border-radius:999px;
  border:1px solid rgba(224,177,92,.26);
  background:linear-gradient(180deg,rgba(60,44,26,.62),rgba(24,17,10,.52));
  backdrop-filter:blur(5px);
  cursor:pointer; transition:transform .15s, border-color .2s, opacity .2s;
}
.btn:hover{border-color:rgba(244,217,160,.55); transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.3; cursor:default; transform:none}
.btn.off{opacity:.45}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-dim)}
.btn.primary{border-color:rgba(250,232,190,.5); color:#2A1B08;
  background:linear-gradient(180deg,#F6E0B0,var(--gold) 60%,#B8823A);
  box-shadow:0 6px 22px rgba(224,177,92,.35)}
.controls{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}

#confetti{position:fixed; inset:0; z-index:95; pointer-events:none; overflow:hidden}
.conf{position:absolute; border-radius:1px; will-change:transform}

.veil{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:24px;
  background:linear-gradient(180deg,rgba(11,8,5,.90),rgba(6,4,2,.95));
  backdrop-filter:blur(7px); opacity:0; pointer-events:none; transition:opacity .4s ease;
}
.veil.show{opacity:1; pointer-events:auto}
.panel{
  text-align:center; max-width:340px; padding:28px 26px; border-radius:24px;
  border:1px solid rgba(224,177,92,.28);
  background:linear-gradient(180deg,rgba(46,33,19,.86),rgba(18,13,8,.82));
  backdrop-filter:blur(8px); box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.97); transition:transform .45s cubic-bezier(.2,1.2,.4,1);
}
.veil.show .panel{transform:none}
.panel h2{font-family:"Cinzel",serif; font-weight:700; font-size:26px; margin:0 0 8px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--gold-lit)}
.stars{font-size:26px; letter-spacing:6px; margin:2px 0 10px; color:var(--gold-lit)}
.stars .dim{color:rgba(239,228,210,.16)}
.panel p{color:var(--ink-dim); font-size:13px; line-height:1.6; margin:0 0 6px}
.panel .hint{color:var(--gold); font-size:11px; letter-spacing:.04em; min-height:16px; margin-bottom:16px}
.panelBtns{display:flex; gap:8px; justify-content:center; margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.08s !important}}

/* --- a run that failed ---
   A win fades in gently. A failure should not: it arrives, the room goes red,
   and the panel takes a knock, so losing the level is felt rather than read. */
.veil.failed{
  background:linear-gradient(180deg,rgba(38,6,10,.92),rgba(10,2,4,.96));
  transition:opacity .18s ease;
}
.veil.failed .panel{
  border-color:rgba(201,69,94,.5);
  background:linear-gradient(180deg,rgba(46,16,20,.9),rgba(16,6,8,.88));
  box-shadow:0 24px 70px rgba(0,0,0,.7), 0 0 60px rgba(201,69,94,.18);
}
.veil.failed.show .panel{animation:knock .5s cubic-bezier(.2,1.3,.4,1)}
.veil.failed h2{
  color:#E4778B; font-size:32px;
  animation:failIn .45s cubic-bezier(.2,1.4,.4,1);
}
.veil.failed .stars{color:rgba(201,69,94,.34); animation:failIn .5s .06s backwards}
@keyframes failIn{
  0%{transform:scale(1.9); opacity:0; letter-spacing:.4em}
  60%{opacity:1}
  100%{transform:scale(1); opacity:1; letter-spacing:.06em}
}
@keyframes knock{
  0%{transform:translateY(-16px) scale(1.04)}
  35%{transform:translateY(5px) scale(.99)}
  60%{transform:translateX(-6px)}
  75%{transform:translateX(5px)}
  88%{transform:translateX(-2px)}
  100%{transform:none}
}
.btn.priced small{pointer-events:none}
.btn.primary.priced small{color:#5C3F14}

.board{
  position:relative; display:grid;
  grid-template-columns:repeat(var(--cols), var(--bw));
  justify-content:center; align-content:center; place-items:center;
  flex:1; width:100%; min-height:0;
}
.fx{position:absolute; inset:0; z-index:52; pointer-events:none; overflow:visible}

.bottle{
  -webkit-appearance:none; appearance:none; border:0; padding:0; background:none;
  position:relative; width:var(--bw); height:calc(var(--bh) + var(--cap-h));
  cursor:pointer; transform-origin:50% 50%;
  transition:transform .3s cubic-bezier(.4,.1,.3,1);
  will-change:transform; touch-action:manipulation;
}
.bottle:focus-visible{outline:none}
.bottle:focus-visible .glass{box-shadow:0 0 0 2px #fff, 0 0 26px rgba(232,190,110,.55)}
.bottle.lifted{transform:translateY(-20px)}
.bottle.pouring{z-index:60}
.bottle.thunk{animation:thunk .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes thunk{0%{transform:translateY(-5px)}40%{transform:translateY(3px) scaleY(.98)}
  70%{transform:translateY(-1px)}100%{transform:translateY(0)}}

.collar{
  position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:4;
  width:44%; height:calc(var(--cap-h) + 2px); border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,#8A7247 0%,#4E3D22 42%,#291F10 100%);
  box-shadow:inset 0 1px 0 rgba(246,226,182,.5), inset -2px 0 3px rgba(0,0,0,.4);
}
.collar::after{content:""; position:absolute; left:14%; top:12%; width:16%; height:70%;
  border-radius:3px; background:rgba(255,255,255,.30)}

.glass{
  position:absolute; left:0; right:0; bottom:0; height:var(--bh);
  border-radius:calc(var(--bw)*.30) calc(var(--bw)*.30) calc(var(--bw)*.17) calc(var(--bw)*.17);
  overflow:hidden;
  background:linear-gradient(180deg, rgba(58,46,30,.40), rgba(20,15,9,.58));
  box-shadow:inset 0 0 0 1.5px var(--glass-line), inset 0 6px 14px rgba(255,232,186,.13),
             0 10px 26px rgba(0,0,0,.55), 0 0 22px rgba(224,177,92,.14);
  transition:box-shadow .4s ease;
}
.fill{position:absolute; inset:0; display:flex; flex-direction:column-reverse}
.band{width:100%; flex:0 0 auto; transition:height .2s ease}
.band.crest{box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 7px 10px rgba(255,255,255,.09)}
.gloss{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  background:linear-gradient(96deg, rgba(255,255,255,0) 0 5%, rgba(255,255,255,.32) 5% 12%,
    rgba(255,255,255,.06) 12% 19%, rgba(255,255,255,0) 19% 74%,
    rgba(255,255,255,.13) 74% 80%, rgba(255,255,255,0) 80% 100%);
}
.gloss::after{content:""; position:absolute; left:6%; top:1.5%; width:52%; height:9%; border-radius:50%;
  background:radial-gradient(ellipse at 35% 40%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%)}
.sheen{
  position:absolute; top:-10%; bottom:-10%; width:62%; left:-95%; z-index:7;
  pointer-events:none; transform:skewX(-14deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
}
.sheen.run{animation:sheen .8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sheen{to{left:135%}}

/* cork: the plug is inside the neck, clipped by the glass. It is deliberately
   short. At half the bottle's width it hung well down past the neck and read as
   a long stopper sitting in the wine rather than a cork seated in the mouth. */
.bottle.done .glass{
  box-shadow:inset 0 0 0 1.5px rgba(252,238,208,.8), inset 0 6px 14px rgba(255,226,170,.18),
             0 10px 24px rgba(0,0,0,.5), 0 0 32px rgba(232,190,110,.45);
}
.plug{
  position:absolute; left:50%; top:0; z-index:5;
  width:46%; height:calc(var(--bw)*.30);
  transform:translateX(-50%);
  clip-path:polygon(3% 0, 97% 0, 86% 82%, 78% 100%, 22% 100%, 14% 82%);
  background:
    repeating-linear-gradient(88deg, rgba(108,62,22,.18) 0 1px, rgba(255,238,210,.06) 1px 5px),
    linear-gradient(180deg,#EFCC9C 0%, #C99A5C 42%, #8F6231 100%);
  box-shadow:inset 0 -7px 9px rgba(70,38,10,.5), inset 0 2px 0 rgba(255,246,228,.55);
}
.plug::after{content:""; position:absolute; left:-40%; right:-40%; top:98%; height:12px;
  background:radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.5), rgba(0,0,0,0) 72%)}
.corktop{
  position:absolute; left:50%; top:calc(var(--bw)*-0.07); z-index:5;
  width:52%; height:calc(var(--bw)*.20);
  transform:translateX(-50%); border-radius:5px 5px 2px 2px;
  background:
    repeating-linear-gradient(87deg, rgba(108,62,22,.14) 0 1px, rgba(255,240,215,.07) 1px 4px),
    linear-gradient(180deg,#F7DEB4 0%, #D8A76D 62%, #B9884C 100%);
  box-shadow:inset 0 1.5px 0 rgba(255,250,238,.95), 0 3px 6px rgba(0,0,0,.55);
}
.plug.pop{animation:plugin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes plugin{
  0%{transform:translateX(-50%) translateY(-150%)}
  58%{transform:translateX(-50%) translateY(7%) scaleY(.88)}
  78%{transform:translateX(-50%) translateY(-3%) scaleY(1.05)}
  100%{transform:translateX(-50%) translateY(0) scaleY(1)}
}
.corktop.pop{animation:capin .56s cubic-bezier(.28,1.4,.45,1) both}
@keyframes capin{
  0%{transform:translate(-50%,-64px) rotate(-15deg); opacity:0}
  28%{opacity:1}
  58%{transform:translate(-50%,3px) rotate(0deg) scaleY(.78)}
  78%{transform:translate(-50%,-2px) scaleY(1.07)}
  100%{transform:translate(-50%,0) scaleY(1)}
}
.ring{
  position:absolute; left:50%; top:calc(var(--cap-h)); z-index:8;
  width:14px; height:14px; margin-left:-7px; border-radius:50%;
  border:2px solid rgba(255,232,196,.95); pointer-events:none;
  animation:ring .6s ease-out forwards;
}
@keyframes ring{0%{transform:scale(.3);opacity:0}20%{opacity:1}100%{transform:scale(6);opacity:0}}

.bead{
  position:absolute; z-index:53; border-radius:52% 52% 46% 46%; pointer-events:none;
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.25), inset 2px 2px 3px rgba(255,255,255,.45);
}
.pool{
  position:absolute; z-index:51; border-radius:50%; pointer-events:none;
  height:7px; opacity:.7; animation:pool .55s ease-out infinite;
}
@keyframes pool{0%{transform:translateX(-50%) scale(.4,.6);opacity:.8}
  100%{transform:translateX(-50%) scale(1.6,1);opacity:0}}
.drop{position:absolute; border-radius:50%; z-index:54; pointer-events:none}

/* --- particle liquid ---
   When the sim is running it draws every bottle's contents onto one canvas over
   the board, so the DOM bands stand down. The glass, collar, sheen and cork are
   still DOM: only the liquid moves to the canvas. */
.board.simulated .fill{opacity:0}
.fluidLayer{
  position:absolute; inset:0; z-index:0;
  pointer-events:none;
}

.gameHeader{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; max-width:520px; gap:8px;
}
.gameHeader .spacer{width:72px}
.hud{display:flex; gap:6px}
.stat{
  min-width:62px; padding:6px 10px 7px; text-align:center;
  border:1px solid rgba(224,177,92,.20); border-radius:11px;
  background:linear-gradient(180deg,rgba(52,38,22,.58),rgba(20,14,9,.48));
  backdrop-filter:blur(6px);
}
.stat b{display:block; font-family:"Cinzel",serif; font-weight:600; font-size:17px; line-height:1.15; color:#fff}
.stat span{color:var(--ink-dim); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase}
.stat.over b{color:#F0894F}
/* the stars are the counter now, so this chip carries the weight */
.stat.wide{min-width:132px}
.hudStars{
  font-family:"Cinzel",serif; font-size:19px; letter-spacing:4px;
  color:var(--gold-lit); line-height:1.15;
  text-shadow:0 1px 8px rgba(224,177,92,.35);
}
.hudStars .dim{color:rgba(239,228,210,.20); text-shadow:none}
/* The last star, then none: the chip warms and then goes out. Scoped to the
   direct child, because the spent stars are spans too and were being coloured
   as though they were the label. */
.stat.over{border-color:rgba(240,137,79,.45)}
.stat.over > span{color:#F0894F}
.stat.spent{border-color:rgba(201,69,94,.5)}
.stat.spent > span{color:#E4778B}

/* --- gold --- */
.purse{
  display:flex; align-items:center; gap:5px; min-width:72px; justify-content:flex-end;
  font-family:"Cinzel",serif; font-weight:600; font-size:15px; color:#F4D9A0;
}
.purse .coin{color:#E0B15C; font-size:11px}
.btn.priced{display:inline-flex; flex-direction:column; align-items:center; gap:1px; line-height:1.1}
.btn.priced small{
  font-size:8.5px; letter-spacing:.14em; text-transform:uppercase; color:#E0B15C; font-weight:600;
}
.btn.priced:disabled small{color:var(--ink-dim)}
.btn.priced.spent small{text-decoration:line-through}
.payout{display:flex; align-items:baseline; justify-content:center; gap:8px; margin:2px 0 10px}
.payout b{font-family:"Cinzel",serif; font-weight:700; font-size:22px; color:#F4D9A0}
.payout span{color:var(--ink-dim); font-size:9px; letter-spacing:.16em; text-transform:uppercase}

.mapHeader{
  display:flex; align-items:flex-end; justify-content:space-between;
  width:100%; max-width:520px; gap:12px;
}
.mapMeta{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.tally{text-align:right}
.tally b{
  display:block; font-family:"Cinzel",serif; font-weight:900; font-size:26px;
  line-height:1; color:var(--gold-lit);
}
.tally span{font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}

.mapScroll{
  position:relative; flex:1; width:100%; max-width:520px; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(180deg, transparent 0, #000 64px, #000 calc(100% - 24px), transparent 100%);
}
.mapScroll::-webkit-scrollbar{width:0}
.mapCanvas{position:relative; width:100%}
.mapPath{position:absolute; left:0; bottom:0; pointer-events:none}

.chapter{
  position:absolute; left:0; right:0; text-align:center; pointer-events:none;
}
.chapter span{
  display:inline-block; position:relative;
  font-family:"Cinzel",serif; font-weight:600; font-size:14px; letter-spacing:.02em;
  color:var(--tint); padding:0 14px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.chapter span::before,.chapter span::after{
  content:""; position:absolute; top:50%; width:52px; height:1px;
  background:linear-gradient(90deg, transparent, var(--tint));
  opacity:.5;
}
.chapter span::before{right:100%}
.chapter span::after{left:100%; transform:scaleX(-1)}

.node{
  position:absolute; transform:translate(-50%, 50%);
  width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center; gap:0;
  font-family:"Cinzel",serif; font-weight:600; font-size:19px; color:#fff;
  cursor:pointer; padding:0;
  border:1.5px solid rgba(224,177,92,.34);
  background:linear-gradient(180deg, rgba(64,47,27,.82), rgba(26,18,11,.78));
  box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(244,217,160,.22);
  transition:transform .18s cubic-bezier(.3,1.3,.5,1), box-shadow .25s;
}
.node:hover:not(:disabled){transform:translate(-50%,50%) scale(1.08)}
.node .num{line-height:1}
.node .ns{
  position:absolute; bottom:-13px; left:50%; transform:translateX(-50%);
  font-size:10px; letter-spacing:1px; color:var(--gold-lit); white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.node .ns i{color:rgba(239,228,210,.20); font-style:normal}

.node.cleared{
  border-color:color-mix(in srgb, var(--tint) 60%, transparent);
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.42), rgba(255,255,255,0) 58%),
    linear-gradient(180deg, color-mix(in srgb, var(--tint) 85%, #fff 15%), color-mix(in srgb, var(--tint) 70%, #000 30%));
  box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 22px color-mix(in srgb, var(--tint) 35%, transparent);
  color:#231607;
}
.node.current{
  border-color:rgba(250,232,190,.8);
  background:linear-gradient(180deg,#FBEBC8,var(--gold) 62%,#B8823A);
  color:#2A1B08; font-size:21px;
  box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 34px rgba(224,177,92,.5);
  animation:beacon 2.4s ease-in-out infinite;
}
@keyframes beacon{
  0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 6px rgba(224,177,92,.16), 0 0 30px rgba(224,177,92,.4)}
  50%{box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 12px rgba(224,177,92,.05), 0 0 44px rgba(238,197,120,.65)}
}
.node.locked{
  cursor:default; font-size:14px; color:rgba(239,228,210,.32);
  border-color:rgba(224,177,92,.12);
  background:linear-gradient(180deg, rgba(40,29,17,.55), rgba(16,11,7,.5));
  box-shadow:none;
}
.node.locked:nth-of-type(n){opacity:.85}
.mapRoad{position:absolute; left:0; bottom:0; pointer-events:none}
</style>
</head>
<body data-view="map">

<section class="view" id="mapView">
  <header class="mapHeader">
    <div>
      <p class="eyebrow">Chapter</p>
      <h1 class="wordmark" id="mapChapter">The Cellar</h1>
    </div>
    <div class="mapMeta">
      <div class="purse"><span class="coin" aria-hidden="true">&#9670;</span><b id="mapGold">0</b></div>
      <div class="tally"><b id="mapStars">0</b><span>stars earned</span></div>
    </div>
  </header>
  <div class="mapScroll" id="mapScroll"><div class="mapCanvas"></div></div>
  <footer class="controls">
    <button class="btn primary priced" id="mapPlay" type="button">Play<small id="playCost">5</small></button>
    <button class="btn priced" id="daily" type="button">Daily<small id="dailyCost">+12</small></button>
    <button class="btn js-sound" type="button">Sound on</button>
    <button class="btn primary" id="install" type="button" hidden>Install</button>
  </footer>
</section>

<section class="view" id="gameView">
  <header class="gameHeader">
    <button class="btn ghost" id="toMap" type="button">&larr; Map</button>
    <h1 class="wordmark small">Decanter</h1>

  try {
    const probe = '__decanter_probe__';
    globalThis.localStorage.setItem(probe, '1');
    globalThis.localStorage.removeItem(probe);
    return globalThis.localStorage;
  } catch (e) {
    return memoryStorage();
  }
}
/* Where the graded game ends. Published by the par table, because that is what
   decides it: a level with no par cannot be scored, and rate() awards full marks
   when it has no bar to measure against. Letting progression run past the table
   would hand out a level that can neither be failed nor played badly, and pay for
   it every time. Falls back to a huge number so a missing table cannot silently
   lock the game to level one. */
const lastLevel = () => (Number.isInteger(globalThis.LAST_LEVEL) ? globalThis.LAST_LEVEL : Infinity);

function blank(){
  return {
    version:1, layout: CONFIG.layout, unlocked:1, stars:{}, best:{}, pars:{}, sound:true,
    gold: CONFIG.economy.startingGold,
    /* levels whose one-time first-clear bonus has already been paid */
    claimed:{},
    /* the day the last daily draught was drawn, as a local YYYY-MM-DD */
    dailyOn: null
  };
}
function createProgress(storage){
  const store = storage || safeStorage();
  let state = blank();
  try {
    const raw = store.getItem(SAVE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') state = Object.assign(blank(), parsed);
    }
  } catch (e) { state = blank(); }
  if (!Number.isInteger(state.unlocked) || state.unlocked < 1) state.unlocked = 1;
  if (state.unlocked > lastLevel()) state.unlocked = lastLevel();
  /* a save written before gold existed still deserves a starting purse */
  if (!Number.isFinite(state.gold) || state.gold < 0) state.gold = CONFIG.economy.startingGold;
  if (!state.claimed || typeof state.claimed !== 'object') state.claimed = {};
  /* The boards moved, so a rating recorded against a level number is a rating of
     a board this save will never be dealt again, and a best move count could sit
     below the new par and read as impossible. Those go. Gold, how far the player
     got, and which first-clear bonuses were already paid all survive, because
     none of them describes a particular board. */
  if (state.layout !== CONFIG.layout){
    state.layout = CONFIG.layout;
    state.stars = {}; state.best = {}; state.pars = {};
  }

  function save(){
    try { store.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  return {
    get raw(){ return state; },
    get unlocked(){ return state.unlocked; },
    get sound(){ return state.sound !== false; },
    setSound(on){ state.sound = !!on; save(); },
    starsFor: level => state.stars[level] || 0,
    bestFor: level => (level in state.best ? state.best[level] : null),
    parFor: level => (level in state.pars ? state.pars[level] : null),
    rememberPar(level, par, exact){
      if (exact && Number.isInteger(par)) { state.pars[level] = par; save(); }
    },
    totalStars(){
      return Object.values(state.stars).reduce((a, b) => a + b, 0);
    },
    isUnlocked: level => level <= state.unlocked && level <= lastLevel(),
    get lastLevel(){ return lastLevel(); },
    /* the graded game is over, and there is nothing further to open */
    get finished(){ return state.unlocked >= lastLevel() && (state.stars[lastLevel()] || 0) > 0; },

    /* ---- gold ---- */
    get gold(){ return state.gold; },
    /* spending is all-or-nothing: a partial debit would leave the player paying
       for a rescue they did not get */
    spend(cost){
      if (!Number.isInteger(cost) || cost < 0 || state.gold < cost) return false;
      state.gold -= cost;
      save();
      return true;
    },
    canAfford: cost => state.gold >= cost,
    /* the draught is once per local day, and the day is passed in so this stays
       testable and so a clock that jumps cannot pay twice for the same date */
    dailyReady: today => state.dailyOn !== today,
    claimDaily(today){
      if (state.dailyOn === today) return 0;
      state.dailyOn = today;
      state.gold += CONFIG.economy.daily;
      save();
      return CONFIG.economy.daily;
    },

    /* Paying past a board opens the next one and nothing else. No stars, no
       best, and the first-clear bonus is left unclaimed, so coming back later
       and actually beating it still pays what it always would have. */
    buyUnlock(level, cost){
      if (level >= lastLevel()) return false;         /* nothing past the last one to open */
      if (state.unlocked > level) return false;       /* already past it */
      if (!Number.isInteger(cost) || cost < 0 || state.gold < cost) return false;
      state.gold -= cost;
      state.unlocked = level + 1;
      save();
      return true;
    },

    /* replaying a level can raise a score but never lower it. Star gold is paid
       every time, the first-clear bonus only ever once, which is what keeps a
       cleared level from being farmable. */
    complete(level, moves, stars){
      /* A failed run sorted the bottles but not well enough to count, so it
         banks nothing: no gold, no best, no first-clear bonus, and the next
         level stays shut. Nothing is taken away either, so an earlier clear of
         the same level keeps whatever it earned. */
      if (stars <= 0){
        return { failed: true, improvedStars: false, improvedBest: false,
                 firstClear: false, starGold: 0, bonus: 0, earned: 0 };
      }
      const prevStars = state.stars[level] || 0;
      if (stars > prevStars) state.stars[level] = stars;
      const prevBest = level in state.best ? state.best[level] : Infinity;
      if (moves < prevBest) state.best[level] = moves;
      if (level >= state.unlocked) state.unlocked = Math.min(level + 1, lastLevel());

      const firstClear = !state.claimed[level];
      const starGold = CONFIG.economy.starGold[stars] || 0;
      const bonus = firstClear ? CONFIG.economy.firstClear : 0;
      state.claimed[level] = true;
      state.gold += starGold + bonus;

      save();
      return {
        failed: false,
        improvedStars: stars > prevStars,
        improvedBest: moves < prevBest,
        firstClear,
        starGold,
        bonus,
        earned: starGold + bonus
      };
    },
    reset(){ state = blank(); save(); }
  };
}
globalThis.Progress = { SAVE_KEY, createProgress, memoryStorage, blank };


/* ---- 45-panel.js ---- */
/* What the end-of-run panel should say, as a decision rather than a pile of DOM
   writes. The app does the writing; this decides.

   Split out because the interesting cases are the ones hardest to reach by hand:
   the last level of the graded game, a failed run with an empty purse, a board
   nobody can crack. Reaching any of them in a browser means actually playing a
   level, and the pours are animated, so a hidden or throttled tab cannot get
   there at all. Everything here is decided from numbers, so the cases can simply
   be asserted. */
function decide(input){
  const {
    level, lastLevel, failed, stars, nextUnlocked,
    canPayFee, canPaySkip, improvedStars, hadStars, par, parExact, moves, best, totalStars
  } = input;

  const perfect = stars === 3;
  /* There is nothing past the graded range: a level with no par cannot be
     scored, and rate() awards full marks when it has no bar to measure against,
     so offering one would hand out a run that can neither be failed nor played
     badly. */
  const atEnd = level >= lastLevel;
  const stuck = !atEnd && failed && !nextUnlocked;

  /* Last writer wins, so the order is the priority order. Being told the game is
     over does not help someone who cannot afford another go, so an empty purse
     outranks it; a new best outranks the standing advice. */
  let hint = failed && par != null ? `Clear it in ${par + CONFIG.stars.one} or fewer.` : '';
  if (!failed && improvedStars && hadStars > 0) hint = 'New best for this level.';
  if (atEnd && canPayFee){
    hint = failed
      ? 'The last one. Another go?'
      : `That is the last of them. ${totalStars} stars from ${lastLevel} levels.`;
  }
  if (!canPayFee || (stuck && !canPaySkip)) hint = 'Not enough gold. The daily draught is on the map.';

  /* Matching the minimum is the whole point of the scoring, so say that and stop.
     Quoting the count twice ("sorted in 12 pours, the minimum is 12") makes the
     reader do the comparison the sentence was supposed to make for them. */
  const atPar = !failed && parExact && par != null && moves === par;
  const parLine = par == null ? ''
    : parExact ? ` The minimum is ${par}.`
    : ` The best found is about ${par}.`;
  const bestLine = !failed && best != null && best < moves ? ` Your best here is ${best}.` : '';
  const line = atPar
    ? 'Solved in the minimum moves.'
    : `Sorted in ${moves} pours.${parLine}${bestLine}`;

  return {
    atEnd,
    line,
    stuck,
    retryHidden: perfect,
    retryPrimary: !perfect,
    retryDisabled: !canPayFee,
    nextHidden: atEnd || (failed && !nextUnlocked),
    nextPrimary: perfect && !atEnd,
    nextDisabled: !canPayFee,
    skipHidden: !stuck,
    skipDisabled: !canPaySkip,
    hint
  };
}
globalThis.Panel = { decide };


/* ---- 50-audio.js ---- */
/* All sound is synthesised at runtime, so the app ships with no audio files.
   The pour is broadband noise shaped by two resonant peaks that rise in pitch
   as the receiving bottle fills, which is the cue an ear uses to hear "filling". */
const Audio = (() => {
  let ctx, master, noise, pourNode, on = true;

  function init(){
    if (ctx) return;
    const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.45;
    master.connect(ctx.destination);
    const len = ctx.sampleRate * 1.5;
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone({ f = 440, f2, type = 'sine', dur = 0.15, gain = 0.2, delay = 0 }){
    if (!on) return; init();
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur * 0.85);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function burst({ freq = 1200, q = 1, dur = 0.09, gain = 0.2, delay = 0, type = 'bandpass' }){
    if (!on) return; init();
    const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }
  return {
    get enabled(){ return on; },
    unlock(){ try { init(); if (ctx.state === 'suspended') ctx.resume(); } catch(e){} },
    setEnabled(v){ on = !!v; if (!on) this.pourEnd(); return on; },
    toggle(){ return this.setEnabled(!on); },
    lift(){ tone({ f:660, f2:880, dur:0.09, gain:0.14 }); },
    drop(){ tone({ f:520, f2:340, dur:0.1, gain:0.11 }); },
    deny(){ tone({ f:150, f2:90, type:'triangle', dur:0.14, gain:0.15 }); },
    tick(){ tone({ f:880, f2:1320, dur:0.07, gain:0.1 }); },
    pourStart(){
      if (!on) return; init();
      if (pourNode) return;
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 380;
      const air = ctx.createBiquadFilter(); air.type = 'bandpass'; air.frequency.setValueAtTime(1500, t); air.Q.value = 0.6;
      const r1 = ctx.createBiquadFilter(); r1.type = 'peaking'; r1.frequency.setValueAtTime(360, t); r1.Q.value = 9; r1.gain.value = 17;
      const r2 = ctx.createBiquadFilter(); r2.type = 'peaking'; r2.frequency.setValueAtTime(720, t); r2.Q.value = 6; r2.gain.value = 10;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
      s.connect(hp).connect(air).connect(r1).connect(r2).connect(g).connect(master);
      s.start();
      g.gain.linearRampToValueAtTime(0.085, t + 0.1);
      pourNode = { s, g, air, r1, r2 };
      burst({ freq:2600, q:1, dur:0.13, gain:0.06 });
    },
    pourAt(p){
      if (!pourNode || !ctx) return;
      const t = ctx.currentTime + 0.06;
      pourNode.r1.frequency.linearRampToValueAtTime(360 + 540 * p, t);
      pourNode.r2.frequency.linearRampToValueAtTime(720 + 900 * p, t);
      pourNode.air.frequency.linearRampToValueAtTime(1500 + 650 * p, t);
    },
    pourEnd(){
      if (!pourNode || !ctx) return;
      const { s, g } = pourNode, t = ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.16);
      try { s.stop(t + 0.22); } catch(e){}
      pourNode = null;
    },
    glug(p){
      const base = (290 + 250 * p) * (0.9 + Math.random() * 0.2);
      tone({ f:base * 1.7, f2:base * 0.72, dur:0.1, gain:0.12 });
      burst({ freq:base * 3.2, q:2.6, dur:0.045, gain:0.05 });
    },
    cork(){
      burst({ freq:2600, q:0.8, dur:0.03, gain:0.15 });
      tone({ f:940, f2:170, dur:0.085, gain:0.4, delay:0.008 });
      tone({ f:145, f2:75, type:'triangle', dur:0.24, gain:0.2, delay:0.03 });
      burst({ freq:520, q:3, dur:0.16, gain:0.06, delay:0.02 });
    },
    win(){
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        tone({ f, type:'triangle', dur:0.45, gain:0.15, delay:i * 0.11 }));
    },
    unlock2(){ [659.25, 987.77].forEach((f,i) => tone({ f, type:'triangle', dur:0.5, gain:0.13, delay:i*0.13 })); }
  };
})();
globalThis.Audio = Audio;


/* ---- 60-solver-client.js ---- */
/* Talks to the A* solver. Prefers a real worker so a long search never blocks
   the UI, and degrades to an inline run with a small budget if workers are
   unavailable (some sandboxed embeds). */
const SolverClient = (() => {
  let worker = null, ok = true, nextId = 1;
  const pending = new Map();

  function source(){
    const el = document.getElementById('solverSrc');
    return el ? el.textContent : '';
  }
  function boot(){
    if (worker || !ok) return;
    try {
      const blob = new Blob([source()], { type: 'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = e => {
        const cb = pending.get(e.data.id);
        if (cb){ pending.delete(e.data.id); cb(e.data); }
      };
      worker.onerror = () => { ok = false; worker = null; };
    } catch (e) { ok = false; }
  }
  function inline(payload, cb){
    setTimeout(() => {
      try {
        const stub = {};
        new Function('self', source())(stub);
        stub.postMessage = m => cb(m);
        stub.onmessage({ data: Object.assign({}, payload, { nodeCap: 60000, msCap: 1200 }) });
      } catch (e) { cb({ id: payload.id, par: null, exact: false }); }
    }, 20);
  }
  return {
    solve(tubes, colors, cb){
      boot();
      const id = nextId++;
      const payload = {
        id, tubes: Rules.clone(tubes), cap: Rules.CAP, colors,
        nodeCap: CONFIG.solver.nodeCap, msCap: CONFIG.solver.msCap
      };
      if (worker && ok){ pending.set(id, cb); worker.postMessage(payload); }
      else inline(payload, cb);
      return id;
    }
  };
})();
globalThis.SolverClient = SolverClient;


/* ---- 65-backdrop.js ---- */
/* The room, drawn rather than photographed.

   The painted backdrops this replaces were a fixed size, so their shelf line
   landed wherever the viewport put it and the bottles stood in front of it
   rather than on it. Here the board reports where every row of bottles ended up
   and the shelving is built under them, so it is aligned at any size by
   construction rather than by luck.

   Colours are sampled from the reference art before it was deleted: near black
   at the top, warm brown through the middle, a glow at the base, candlelight at
   #D59738. The moss behind the map comes from the same source, #151A0B to
   #868552.

   Depth is the other job. The bottles being played have to read as standing in
   front of the room, so the room steps back directly behind them and each bottle
   is given a contact shadow on the plank it stands on. Without those the clutter
   behind shows through the glass and the whole shelf flattens into one plane. */
const Backdrop = (() => {
  const CELLAR = {
    sky: ['#040507', '#0B0805', '#150F08', '#1E1509', '#0A0704'],
    glow: '213,151,56', wood: ['#8A5A22', '#5A3612', '#2E1C0A'],
    silhouette: '#0B0805', rim: '255,214,150'
  };
  const MOSS = {
    sky: ['#0A0E06', '#141A0A', '#252D14', '#31391B', '#10150A'],
    glow: '134,133,82', wood: ['#4A4A28', '#33351A', '#1A1C0D'],
    silhouette: '#0C1107', rim: '200,214,150'
  };

  let cv = null, ctx = null, W = 0, H = 0, dpr = 1;
  let kind = 'cellar', rows = [], drawn = '';

  function mount(){
    if (cv) return;
    cv = document.createElement('canvas');
    cv.className = 'backdrop';
    ctx = cv.getContext('2d');
    document.body.insertBefore(cv, document.body.firstChild);
    /* The room has to follow the window. Without this it drew once at whatever
       size the page happened to be during boot, which on a first paint can be
       nothing at all, and then never again. */
    addEventListener('resize', render);
    addEventListener('orientationchange', render);
  }

  const rand = seed => RNG.mulberry32(RNG.hashSeed(seed));

  function sky(p){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    p.sky.forEach((c, i) => g.addColorStop(i / (p.sky.length - 1), c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* the back wall is boards, which is what stops it reading as a gradient */
  function panelling(p){
    const r = rand('boards');
    const step = Math.max(46, W / 11);
    for (let x = step * r(); x < W; x += step * (0.7 + r() * 0.6)){
      ctx.fillStyle = `rgba(0,0,0,${0.16 + r() * 0.2})`;
      ctx.fillRect(x, 0, 1.4, H);
      ctx.fillStyle = `rgba(${p.rim},${0.02 + r() * 0.03})`;
      ctx.fillRect(x + 1.4, 0, 1, H);
    }
  }

  function candle(p){
    const g = ctx.createRadialGradient(W * 0.32, H * 0.30, 0, W * 0.32, H * 0.30, Math.max(W, H) * 0.6);
    g.addColorStop(0, `rgba(${p.glow},.15)`);
    g.addColorStop(0.4, `rgba(${p.glow},.05)`);
    g.addColorStop(1, `rgba(${p.glow},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* jars and demijohns standing further back */
  function clutter(p, baseY, seed){
    const r = rand('clutter' + seed);
    const n = Math.round(W / 70) + 5;
    for (let i = 0; i < n; i++){
      const squat = r() < 0.42;
      const bw = W * (squat ? 0.035 + r() * 0.05 : 0.02 + r() * 0.032);
      const bh = bw * (squat ? 0.9 + r() * 0.8 : 2.1 + r() * 2.6);
      const x = r() * (W + bw) - bw / 2;
      const y = baseY - bh;
      const neck = bw * (0.2 + r() * 0.2);
      ctx.globalAlpha = 0.34 + r() * 0.24;
      ctx.fillStyle = p.silhouette;
      ctx.beginPath();
      const rad = squat ? bw * 0.48 : bw * 0.3;
      if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, [rad, rad, bw * 0.16, bw * 0.16]);
      else ctx.rect(x, y, bw, bh);
      ctx.fill();
      ctx.fillRect(x + (bw - neck) / 2, y - bh * 0.13, neck, bh * 0.15);
      if (r() < 0.5) ctx.fillRect(x + (bw - neck * 1.5) / 2, y - bh * 0.17, neck * 1.5, bh * 0.05);
      ctx.globalAlpha = 0.05 + r() * 0.07;             /* one lit edge */
      ctx.fillStyle = `rgb(${p.rim})`;
      ctx.fillRect(x + bw * 0.14, y + bh * 0.12, Math.max(1, bw * 0.045), bh * 0.72);
      ctx.globalAlpha = 1;
    }
  }

  /* Directly behind the bottles being played the room steps back, so nothing
     behind them shows through the glass and competes for the same plane. */
  function pocket(row){
    if (!row.spots || !row.spots.length) return;
    const x0 = Math.min(...row.spots.map(s => s[0])) - 34;
    const x1 = Math.max(...row.spots.map(s => s[1])) + 34;
    const top = (row.top == null ? row.y - 150 : row.top) - 26;
    const g = ctx.createLinearGradient(0, top, 0, row.y);
    g.addColorStop(0, 'rgba(0,0,0,.10)');
    g.addColorStop(0.5, 'rgba(0,0,0,.42)');
    g.addColorStop(1, 'rgba(0,0,0,.54)');
    ctx.fillStyle = g;
    ctx.fillRect(x0, top, x1 - x0, row.y - top);
  }

  function cobweb(p, x, y, size, flip){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -1 : 1, 1);
    ctx.strokeStyle = `rgba(${p.rim},.035)`;
    ctx.lineWidth = 0.7;
    for (let i = 1; i <= 4; i++){
      ctx.beginPath();
      ctx.arc(0, 0, (size / 4) * i, 0.06, 1.51);
      ctx.stroke();
    }
    for (let a = 0.1; a < 1.5; a += 0.34){
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* A plank with an edge to it, brackets under, and a shadow cast by whatever
     stands on it. The contact shadows are what put the bottles on the shelf
     rather than in front of a picture of one. */
  function shelfUnit(p, row, seed, last){
    const y = row.y;
    const t = Math.min(32, Math.max(14, H * 0.038));
    const r = rand('shelf' + seed);

    ctx.save();
    ctx.beginPath(); ctx.rect(0, y, W, H - y); ctx.clip();
    const under = ctx.createLinearGradient(0, y, 0, y + t * 3.4);
    under.addColorStop(0, 'rgba(0,0,0,.66)');
    under.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = under;
    ctx.fillRect(0, y, W, t * 3.4);
    ctx.restore();

    /* brackets, drawn before the plank so the plank sits on them */
    const bn = Math.max(2, Math.round(W / 320));
    for (let i = 0; i <= bn; i++){
      const bx = (W / bn) * i;
      const bwid = t * 0.55, bhgt = t * 2.6;
      ctx.fillStyle = 'rgba(18,11,4,.78)';
      ctx.beginPath();
      ctx.moveTo(bx - bwid, y + t);
      ctx.lineTo(bx + bwid, y + t);
      ctx.lineTo(bx + bwid * 0.5, y + t + bhgt);
      ctx.lineTo(bx - bwid * 0.5, y + t + bhgt);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = `rgba(${p.rim},.05)`;
      ctx.fillRect(bx - bwid, y + t, bwid * 2, 1);
    }

    /* on the plank, under each bottle */
    (row.spots || []).forEach(([x0, x1]) => {
      const cx = (x0 + x1) / 2, wid = x1 - x0;
      const g = ctx.createRadialGradient(cx, y, 0, cx, y, wid * 0.9);
      g.addColorStop(0, 'rgba(0,0,0,.72)');
      g.addColorStop(0.55, 'rgba(0,0,0,.28)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, y + t * 0.22, wid * 0.85, t * 0.6, 0, 0, 6.283);
      ctx.fill();
    });

    const face = ctx.createLinearGradient(0, y, 0, y + t);
    face.addColorStop(0, p.wood[0]);
    face.addColorStop(0.28, p.wood[1]);
    face.addColorStop(1, p.wood[2]);
    ctx.fillStyle = face;
    ctx.fillRect(0, y, W, t);

    ctx.fillStyle = `rgba(${p.rim},.13)`;
    ctx.fillRect(0, y, W, 1.3);
    ctx.fillStyle = 'rgba(0,0,0,.34)';
    ctx.fillRect(0, y + t * 0.62, W, 1);
    ctx.fillStyle = `rgba(${p.rim},.05)`;
    ctx.fillRect(0, y + t * 0.66, W, 1);

      ctx.lineWidth = 0.6 + r() * 1.2;

      const dx = r() * W, dl = t * (0.5 + r() * 2.6);
      ctx.fillStyle = `rgba(138,90,34,${0.14 + r() * 0.2})`;
      ctx.fillRect(dx, y + t, 1 + r() * 2, dl);
    }
    cobweb(p, 4, y - 3, t * 1.7, false);
    if (seed % 2 === 0) cobweb(p, W - 4, y - 3, t * 1.4, true);

    if (last){
      const below = ctx.createLinearGradient(0, y + t, 0, H);
      below.addColorStop(0, 'rgba(4,3,2,.70)');
      below.addColorStop(0.45, 'rgba(6,4,3,.85)');
      below.addColorStop(1, 'rgba(2,1,1,.93)');
      ctx.fillStyle = below;
      ctx.fillRect(0, y + t, W, H - y - t);
    }
  }

  function blotches(p){
    const r = rand('moss');
    const n = Math.round((W * H) / 17000) + 10;
    for (let i = 0; i < n; i++){
      const x = r() * W, y = r() * H;
      const rad = Math.min(W, H) * (0.02 + r() * 0.075);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      const light = r() < 0.42;
      g.addColorStop(0, light ? `rgba(${p.glow},.14)` : 'rgba(3,5,2,.16)');
      g.addColorStop(1, light ? `rgba(${p.glow},0)` : 'rgba(3,5,2,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad * (0.5 + r() * 0.5), r() * 3.14, 0, 6.283);
      ctx.fill();
    }
  }

  function motes(p){
    const r = rand('motes');
    const n = Math.round(W / 26);
    for (let i = 0; i < n; i++){
      const x = r() * W, y = r() * H * 0.8, rad = 0.6 + r() * 1.6;
      ctx.fillStyle = `rgba(${p.rim},${0.04 + r() * 0.10})`;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, 6.283);
      ctx.fill();
    }
  }

  function vignette(strong){
    const g = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.24,
                                       W / 2, H * 0.46, Math.max(W, H) * 0.80);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, `rgba(0,0,0,${strong ? .32 : .20})`);
    g.addColorStop(1, `rgba(0,0,0,${strong ? .88 : .66})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function grain(){
    const r = rand('grain');
    const n = Math.round((W * H) / 900);
    ctx.globalAlpha = 0.045;
    for (let i = 0; i < n; i++){
      ctx.fillStyle = r() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(r() * W, r() * H, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  const key = () => `${kind}|${W}|${H}|` +
    rows.map(r => `${r.y}:${(r.spots || []).map(s => s.join('-')).join(',')}`).join('|');

  function render(){
    if (!cv) return;
    const w = Math.round(innerWidth), h = Math.round(innerHeight);
    if (w < 8 || h < 8) return;              /* no viewport yet: wait to be asked again */
    W = w; H = h;
    const k = key();
    if (k === drawn) return;                 /* nothing moved, nothing to redraw */
    drawn = k;

    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);

    const p = kind === 'moss' ? MOSS : CELLAR;
    sky(p);
    if (kind === 'cellar') panelling(p);
    candle(p);
    if (rows.length){
      rows.forEach((row, i) => {
        clutter(p, row.y + 2, i);
        pocket(row);
        shelfUnit(p, row, i, i === rows.length - 1);
      });
      motes(p);
    } else {
      blotches(p);
      motes(p);
    }
    vignette(rows.length > 0);
    grain();
  }

  return {
    mount,
    set kind(k){ if (k !== kind){ kind = k; drawn = ''; render(); } },
    get kind(){ return kind; },
    /* Every row the bottles stand on: { y, top, spots: [[x0,x1], ...] } in
       viewport pixels. Plain numbers are accepted for a bare shelf. */
    setShelf(next){
      rows = (next == null ? [] : [].concat(next))
        .map(r => (typeof r === 'number' ? { y: Math.round(r) } : { ...r, y: Math.round(r.y) }))
        .filter(r => Number.isFinite(r.y))
        .sort((a, b) => a.y - b.y);
      render();
    },
    render
  };
})();
globalThis.Backdrop = Backdrop;

/* Everything that draws bottles and animates a pour. Owns the *view* state,
   which trails the logical state while queued animations catch up. */
const Board = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let root = null, fx = null, fluidOn = false;
  let view = [], selected = null;
  let onTap = () => {};

  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

     before the screen locks would otherwise never finish, and the queue waiting
     on it would never drain. Timers still fire when hidden, so one is kept as a
     floor: the animation jumps to its end state rather than hanging. */
  function frames(ms, onFrame){
    return new Promise(res => {
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        onFrame(1);
        res();
      };
      const bail = setTimeout(finish, ms + 500);
      (function step(now){
        if (done) return;
        const p = Math.min(1, (now - t0) / ms);
        if (p < 1){ onFrame(p); requestAnimationFrame(step); }
        else finish();
      })(t0);
    });
  }
  const el = i => root.querySelector(`.bottle[data-i="${i}"]`);
  const colorVar = c => `var(--c${c})`;

     yields the largest bottles for the space available --- */

    const W = root.clientWidth || window.innerWidth - 24;
    const H = root.clientHeight || 360;
    let best = null;
    for (let rows = 1; rows <= 4; rows++){
      if (n % rows) continue;
      const cols = n / rows;
      const gx = cols > 6 ? 7 : 11, gy = rows > 2 ? 12 : 20;
      const bw = Math.min((W - (cols - 1) * gx) / cols, ((H - (rows - 1) * gy) / rows) / 3.62, 58);
      if (!best || bw > best.bw) best = { bw, rows, cols, gx, gy };
    }
    if (!best) best = { bw:30, rows:1, cols:n, gx:8, gy:14 };
    document.documentElement.style.setProperty('--bw', Math.max(22, best.bw).toFixed(1) + 'px');
    root.style.setProperty('--cols', best.cols);
    root.style.columnGap = best.gx + 'px';

    const out = [];
    for (const c of tube){

      if (last && last.c === c) last.n++; else out.push({ c, n:1 });
    }
    return out;
  }
  const bandHeight = n => `calc(var(--bh) / var(--units) * ${n})`;

  function render(){
    layout(view.length);
    root.innerHTML = '';
    view.forEach((tube, i) => {
      const b = document.createElement('button');
      b.className = 'bottle';
      b.dataset.i = i;
      b.type = 'button';
      b.setAttribute('aria-label', `Bottle ${i + 1}, ${tube.length} of ${Rules.CAP} full`);
      const full = Rules.isFull(tube);
      if (full) b.classList.add('done');
      if (selected === i) b.classList.add('lifted');
      b.innerHTML = '<div class="collar"></div>';
      const glass = document.createElement('div'); glass.className = 'glass';
      const fill = document.createElement('div'); fill.className = 'fill';
      const bands = bandsOf(tube);
      bands.forEach((bd, idx) => {

        d.style.background = colorVar(bd.c);
        d.style.height = bandHeight(bd.n);

      if (full){ const p = document.createElement('div'); p.className = 'plug'; glass.appendChild(p); }
      const sheen = document.createElement('div'); sheen.className = 'sheen'; glass.appendChild(sheen);
      const gloss = document.createElement('div'); gloss.className = 'gloss'; glass.appendChild(gloss);
      b.appendChild(glass);

  /* --- stream geometry: a tapering ribbon along a quadratic arc --- */
  function qpoint(p0, c, p1, t){

    return { x: m*m*p0.x + 2*m*t*c.x + t*t*p1.x, y: m*m*p0.y + 2*m*t*c.y + t*t*p1.y };

  function ribbon(p0, c, p1, w0, w1, t0, t1, off){
    const N = 18, L = [], R = [];
    for (let i = 0; i <= N; i++){
      const u = t0 + (t1 - t0) * (i / N);
      const p = qpoint(p0, c, p1, u);
      const dx = 2*(1-u)*(c.x-p0.x) + 2*u*(p1.x-c.x);
      const dy = 2*(1-u)*(c.y-p0.y) + 2*u*(p1.y-c.y);
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      const w = (w0 + (w1 - w0) * u) / 2;

      L.push([(p.x + nx*(w+o)).toFixed(1), (p.y + ny*(w+o)).toFixed(1)]);
      R.push([(p.x - nx*(w-o)).toFixed(1), (p.y - ny*(w-o)).toFixed(1)]);

    const src = el(move.from), dst = el(move.to);
    if (!src || !dst) return;
    const w = src.offsetWidth, h = src.offsetHeight;
    const glassH = src.querySelector('.glass').offsetHeight;
    const unitH = glassH / Rules.CAP, capH = h - glassH;
    const raw = CONFIG.palette[move.color];
    const dir = dst.offsetLeft > src.offsetLeft ? 1 : -1;

    const dy = (lipY + (h/2) * Math.cos(rad)) - (src.offsetTop + h/2);

    await sleep(200);
    src.style.transition = 'transform .3s cubic-bezier(.35,.05,.3,1)';
    src.style.transform = `translate(${dx}px, ${dy}px) rotate(${ang}deg)`;
    await sleep(280);

    const startFill = view[move.to].length;
    const impactX = dst.offsetLeft + w/2;
    const surfaceY = k => dst.offsetTop + capH + glassH - k * unitH;
    const P0 = { x: lipX, y: lipY };

    const ctrl = () => ({ x: P0.x + (P1.x - P0.x) * 0.78, y: P0.y + (P1.y - P0.y) * 0.10 });
    const w0 = w * 0.30, w1 = w * 0.15;

    const shine = document.createElementNS(NS, 'path');

    pool.style.width = (w*0.5) + 'px';

      d.style.background = color;

        { transform:`translate(${ux}px,${6 + Math.random()*8}px)`, opacity:0 }

    get view(){ return view; },
    set view(v){ view = v; },
    get selected(){ return selected; },
    /* lifting a bottle moves its glass, so the liquid has to be told to follow */
    set selected(v){ selected = v; if (fluidOn) Fluid.wake(); },
    set onTap(fn){ onTap = fn; },
    el, render, animate, seal, nudge, reduce
  };
})();

/* ---- 72-fluid.js ---- */
/* The liquid.

   This draws the contents of every bottle onto one canvas behind the glass. It
   is a mask, not a simulation, which is how liquid in a container is normally
   done: the shape of the glass is the clip, and the surface is a line in world
   space. A tilting bottle turns its clip and leaves the line alone, so the
   liquid stays level while the glass rotates, without that having to be
   arranged. See docs/design/06-bottles.md for what this replaced and why.

   Everything follows from the clip. Liquid is only ever drawn through a glass,
   so liquid outside a glass is not a thing this code can express: it is not
   guarded against, it has no representation. */
const Fluid = (() => {
  function supported(){
    try { return !!document.createElement('canvas').getContext('2d'); }
    catch (e) { return false; }
  }

  let root = null, cv = null, ctx = null;
  let W = 0, H = 0, dpr = 1;
  let bottles = [];        /* geometry, measured from the DOM */
  let state = [];          /* per bottle: bands bottom to top, units may be fractional */
  let anim = null;         /* the pour being animated, if any */
  let running = false, raf = 0, last = 0, idle = 0;

  const colorOf = c => CONFIG.palette[c] || '#888';

  function mount(el){
    root = el;
    cv = document.createElement('canvas');
    cv.className = 'fluidLayer';
    ctx = cv.getContext('2d');
  }
  /* render() rebuilds the board with innerHTML, so the canvas is put back as the
     first child: behind the bottles, where the glass and its sheen sit over the
     liquid rather than under it. */
  function attach(){
    if (root && cv.parentNode !== root) root.insertBefore(cv, root.firstChild);
  }

  /* Offsets, not bounding rects: offsets are layout values and ignore
     transforms, so this is the glass at rest even if a bottle is lifted or
     mid-bounce right now. */
  function measure(){
    if (!root) return false;
    attach();
    const box = root.getBoundingClientRect();
    if (box.width < 8 || box.height < 8) return false;
    W = Math.round(box.width);
    H = Math.round(box.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);

    bottles = [];
    root.querySelectorAll('.bottle').forEach((b, i) => {
      const glass = b.querySelector('.glass');
      if (!glass) return;
      const bx = b.offsetLeft, by = b.offsetTop;
      const gx = bx + glass.offsetLeft, gy = by + glass.offsetTop;
      const gw = glass.offsetWidth, gh = glass.offsetHeight;
      const cs = getComputedStyle(glass);
      const r = k => Math.max(0, (parseFloat(cs[k]) || 0) - 1);
      bottles[i] = {
        i, el: b,
        x0: gx + 1, x1: gx + gw - 1,
        yTop: gy + 1, yBot: gy + gh - 1,
        radii: [r('borderTopLeftRadius'), r('borderTopRightRadius'),
                r('borderBottomRightRadius'), r('borderBottomLeftRadius')],
        cx: bx + b.offsetWidth / 2,
        cy: by + b.offsetHeight / 2,
        m: null
      };
    });
    return bottles.length > 0;
  }

  /* Any transform on a bottle moves its glass: pouring tips it, selecting lifts
     it, sealing bounces it. All of them have to move the liquid with it. */
  function readTransforms(){
    for (let i = 0; i < bottles.length; i++){
      const b = bottles[i];
      if (!b || !b.el) continue;
      const t = getComputedStyle(b.el).transform;
      if (!t || t === 'none' || t === 'matrix(1, 0, 0, 1, 0, 0)'){ b.m = null; continue; }
      try { b.m = new DOMMatrixReadOnly(t); } catch (e) { b.m = null; }
    }
  }
  function toWorld(b, x, y){
    if (!b.m) return { x, y };
    const p = b.m.transformPoint(new DOMPoint(x - b.cx, y - b.cy));
    return { x: p.x + b.cx, y: p.y + b.cy };
  }
  const corners = b => [[b.x0, b.yTop], [b.x1, b.yTop], [b.x1, b.yBot], [b.x0, b.yBot]]
    .map(([x, y]) => toWorld(b, x, y));

  /* ---- where the surface sits ----

     For an upright bottle the fill line is simple arithmetic. For a tipped one
     the glass is a rotated quad and the line is still horizontal, so the level
     is whichever height leaves the right *area* underneath it. That is solved by
     bisection: a dozen polygon clips, which is nothing next to what a particle
     solver cost, and it is exact rather than approximated. */
  function polyArea(p){
    let a = 0;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++)
      a += (p[j].x + p[i].x) * (p[j].y - p[i].y);
    return Math.abs(a / 2);
  }
  /* the part of a convex polygon at or below a horizontal line */
  function clipBelow(poly, y){
    const out = [];
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
      const a = poly[j], b = poly[i];
      const ain = a.y >= y, bin = b.y >= y;
      if (ain !== bin){
        const t = (y - a.y) / (b.y - a.y);
        out.push({ x: a.x + (b.x - a.x) * t, y });
      }
      if (bin) out.push(b);
    }
    return out;
  }
  function levelFor(b, quad, frac){
    if (frac <= 0) return b.m ? Math.max(...quad.map(p => p.y)) : b.yBot;
    if (frac >= 1) return b.m ? Math.min(...quad.map(p => p.y)) : b.yTop;
    if (!b.m) return b.yBot - (b.yBot - b.yTop) * frac;      /* upright: no search needed */
    let lo = Math.min(...quad.map(p => p.y)), hi = Math.max(...quad.map(p => p.y));
    const want = polyArea(quad) * frac;
    for (let k = 0; k < 18; k++){
      const mid = (lo + hi) / 2;
      if (polyArea(clipBelow(quad, mid)) > want) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }

  /* ---- contents ---- */
  const bandsOf = tube => {
    const out = [];
    for (const c of tube){
      const last = out[out.length - 1];
      if (last && last.c === c) last.units++; else out.push({ c, units: 1 });
    }
    return out;
  };
  const clone = bands => bands.map(x => ({ c: x.c, units: x.units }));

  function shrinkTop(bands, amount){
    const out = clone(bands);
    let left = amount;
    for (let i = out.length - 1; i >= 0 && left > 0; i--){
      const take = Math.min(out[i].units, left);
      out[i].units -= take; left -= take;
      if (out[i].units <= 1e-6) out.splice(i, 1);
    }
    return out;
  }
  function growTop(bands, c, amount){
    const out = clone(bands);
    const last = out[out.length - 1];
    if (last && last.c === c) last.units += amount;
    else if (amount > 1e-6) out.push({ c, units: amount });
    return out;
  }

  let retry = 0;
  function sync(view){
    clearTimeout(retry);
    if (!measure()){ retry = setTimeout(() => sync(view), 120); return; }
    state = view.map(bandsOf);
    anim = null;
    readTransforms();
    draw();
  }

  /* ---- drawing ---- */
  function glassPath(b){
    ctx.save();
    if (b.m){
      ctx.translate(b.cx, b.cy);
      ctx.transform(b.m.a, b.m.b, b.m.c, b.m.d, b.m.e, b.m.f);
      ctx.translate(-b.cx, -b.cy);
    }
    const w = b.x1 - b.x0, h = b.yBot - b.yTop;
    if (ctx.roundRect) ctx.roundRect(b.x0, b.yTop, w, h, b.radii);
    else ctx.rect(b.x0, b.yTop, w, h);
    ctx.restore();
  }

  function drawBottle(b, bands){
    if (!b || !bands || !bands.length) return;
    const quad = corners(b);
    ctx.save();
    ctx.beginPath();
    glassPath(b);
    ctx.clip();

    let below = 0;
    bands.forEach(band => {
      const f0 = below / Rules.CAP;
      const f1 = (below + band.units) / Rules.CAP;
      below += band.units;
      const yLo = levelFor(b, quad, f0);
      const yHi = levelFor(b, quad, f1);
      if (yLo - yHi < 0.2) return;
      ctx.fillStyle = colorOf(band.c);
      ctx.fillRect(-4, yHi, W + 8, yLo - yHi);
      /* a brighter line where one liquid meets the next, so the layers read as
         surfaces rather than as stacked blocks */
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(-4, yHi, W + 8, Math.min(2.5, yLo - yHi));
    });

    /* lit on the left, shaded on the right, only where there is liquid */
    const g = ctx.createLinearGradient(b.x0, 0, b.x1, 0);
    g.addColorStop(0, 'rgba(28,17,7,.20)');
    g.addColorStop(0.24, 'rgba(255,240,206,.15)');
    g.addColorStop(0.6, 'rgba(255,224,170,.05)');
    g.addColorStop(1, 'rgba(8,5,10,.26)');
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = g;
    ctx.fillRect(-4, 0, W + 8, H);
    ctx.restore();
  }

  function draw(){
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < bottles.length; i++) drawBottle(bottles[i], state[i]);
  }

  /* ---- the pour ----
     One number moving, not a stream: the source's level falls while the target's
     rises. The stream between them is drawn by the scripted ribbon, which is how
     games draw a pour. */
  function transfer(move){
    return new Promise(resolve => {
      const src = bottles[move.from], dst = bottles[move.to];
      if (!src || !dst || !state[move.from]){ resolve(); return; }
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(bail);
        anim = null;
        resolve();
      };
      anim = {
        from: move.from, to: move.to, c: move.color, n: move.n,
        src: clone(state[move.from]), dst: clone(state[move.to] || []),
        t: 0, dur: 0.16 * move.n + 0.34, done: finish
      };
      /* timers still fire in a tab that is not painting, so a pour cannot hang
         the queue waiting on a frame that never comes */
      const bail = setTimeout(finish, 1200 + 400 * move.n);
      wake();
    });
  }

  function step(dt){
    readTransforms();
    if (!anim) return;
    anim.t += dt;
    const p = Math.min(1, anim.t / anim.dur);
    const moved = anim.n * p;
    state[anim.from] = shrinkTop(anim.src, moved);
    state[anim.to] = growTop(anim.dst, anim.c, moved);
    if (p >= 1){ const fin = anim.done; anim = null; fin(); }
  }

  const anyMoved = () => bottles.some(b => b && b.m);

  function loop(){
    if (!running) return;
    raf = requestAnimationFrame(loop);
    const now = performance.now();
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    step(dt);
    draw();
    if (!anim && !anyMoved()){ if (++idle > 20) stop(); } else idle = 0;
  }
  function wake(){ idle = 0; start(); }
  function start(){ if (running) return; running = true; last = performance.now(); loop(); }
  function stop(){ running = false; cancelAnimationFrame(raf); }

  return {
    supported, mount, sync, transfer, draw, wake,
    resize(){ if (root && bottles.length) measure(); },
    get mounted(){ return !!root; }
  };
})();
globalThis.Fluid = Fluid;

/* Paper bits. Two flavours: a small burst when one bottle is corked, and a
   full screen fall when a level is finished. */
const Confetti = (() => {
  let layer = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ensure = () => (layer = layer || document.getElementById('confetti'));
  return {
    burst(cx, cy, count, palette, power){
      if (reduce || !ensure()) return;
      for (let i = 0; i < count; i++){
        const p = document.createElement('div');
        p.className = 'conf';
        const thin = Math.random() < 0.4;
        p.style.width = (thin ? 3 : 6) + 'px';
        p.style.height = (thin ? 9 : 6) + 'px';
        p.style.background = palette[i % palette.length];
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        const a = -Math.PI/2 + (Math.random() - 0.5) * 1.9;
        const v = power * (0.55 + Math.random() * 0.65);
        const ux = Math.cos(a) * v, uy = Math.sin(a) * v;
        p.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:`translate(${ux*0.6}px,${uy}px) rotate(${(Math.random()*540-270)|0}deg)`, opacity:1, offset:0.42 },
          { transform:`translate(${ux}px,${uy+90+Math.random()*70}px) rotate(${(Math.random()*900-450)|0}deg)`, opacity:0 }
        ], { duration: 900 + Math.random()*600, easing:'cubic-bezier(.15,.6,.4,1)' })
         .onfinish = () => p.remove();
        layer.appendChild(p);
      }
    },
    rain(palette){
      if (reduce || !ensure()) return;
      const cols = palette.concat(['#F7DEB4', '#D8A76D', '#FFFFFF']);
      for (let i = 0; i < 90; i++){
        const p = document.createElement('div');
        p.className = 'conf';
        const thin = Math.random() < 0.45;
        p.style.width = (thin ? 3 : 7) + 'px';
        p.style.height = (thin ? 11 : 7) + 'px';
        p.style.background = cols[(Math.random() * cols.length) | 0];
        p.style.left = (Math.random() * innerWidth) + 'px';
        p.style.top = '-20px';
        const sway = (Math.random() - 0.5) * 180;
        p.animate([
          { transform:'translate(0,0) rotate(0deg)', opacity:1 },
          { transform:`translate(${sway*0.5}px,${innerHeight*0.5}px) rotate(${(Math.random()*720-360)|0}deg)`, offset:0.5 },
          { transform:`translate(${sway}px,${innerHeight+40}px) rotate(${(Math.random()*1200-600)|0}deg)`, opacity:0.9 }
        ], { duration: 2000 + Math.random()*1600, delay: Math.random()*700, easing:'cubic-bezier(.25,.5,.5,1)' })
         .onfinish = () => p.remove();
        layer.appendChild(p);
      }
    }
  };
})();

/* ---- 80-map.js ---- */
/* The journey map. Pure geometry lives in MapGeom so it can be tested without
   a browser; MapView only turns those numbers into elements. */
const MapGeom = (() => {
  /* Levels climb from the bottom. x follows a slow sine so the path winds
     without ever leaving the column. */
  const STEP = 0.72;
  function nodes(count, width, opts){
    const o = Object.assign({ spacing:96, margin:52, bottom:90 }, opts || {});
    const amp = Math.max(0, Math.min(width * 0.30, width / 2 - o.margin));
    const cx = width / 2;
    const out = [];
    for (let i = 0; i < count; i++){
      out.push({ level: i + 1, x: cx + Math.sin(i * STEP) * amp, y: o.bottom + i * o.spacing });
    }
    return out;
  }
  const height = (count, opts) => {
    const o = Object.assign({ spacing:96, bottom:90, top:140 }, opts || {});
    return o.bottom + Math.max(0, count - 1) * o.spacing + o.top;
  };
  /* Catmull-Rom through the node centres, converted to cubic beziers */
  function pathThrough(points, flipY){
    if (points.length < 2) return '';
    const P = points.map(p => ({ x: p.x, y: flipY ? flipY - p.y : p.y }));
    let d = `M ${P[0].x.toFixed(1)} ${P[0].y.toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++){
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }
  /* what the player is allowed to see: everything cleared, the frontier, and a
     short glimpse of what is coming */
  /* The lookahead shows what is coming, so it must not show levels that are not
     coming: past the graded range there is nothing to deal. */
  const visibleCount = (unlocked, lookahead, last) => {
    const ahead = unlocked + (lookahead == null ? CONFIG.lookahead : lookahead);
    const cap = Number.isInteger(last) ? last : (Number.isInteger(globalThis.LAST_LEVEL) ? globalThis.LAST_LEVEL : Infinity);
    return Math.min(ahead, cap);
  };
  return { nodes, height, pathThrough, visibleCount, STEP };
})();
globalThis.MapGeom = MapGeom;

const MapView = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let scroll = null, canvas = null, svg = null, road = null, onPick = () => {};
  let lastFocus = 1;

  /* The road, laid stone by stone along the very spline the nodes sit on. It is
     sampled from the path itself rather than recomputed, so it cannot drift off
     the medallions, and it is drawn to a canvas inside the scrolling map so it
     travels with them. Strokes alone read as a ribbon; cobbles read as a road. */
  function drawRoad(d, width, H, spacing){
    if (!road) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    road.width = Math.ceil(width * dpr); road.height = Math.ceil(H * dpr);
    road.style.width = width + 'px'; road.style.height = H + 'px';
    const g = road.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.scale(dpr, dpr);
    g.clearRect(0, 0, width, H);

    const shape = new Path2D(d);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#090C05'; g.lineWidth = 60; g.globalAlpha = .75; g.stroke(shape);
    g.strokeStyle = '#1A1F0E'; g.lineWidth = 50; g.globalAlpha = .9;  g.stroke(shape);
    g.strokeStyle = '#2C3018'; g.lineWidth = 43; g.globalAlpha = 1;   g.stroke(shape);

    /* a path element is the only honest way to walk a curve, so borrow one */
    const probe = document.createElementNS(NS, 'path');
    probe.setAttribute('d', d);
    probe.setAttribute('fill', 'none');
    svg.appendChild(probe);
    let len = 0;
    try { len = probe.getTotalLength(); } catch (e) { len = 0; }
    if (!len){ probe.remove(); return; }

    const r = RNG.mulberry32(RNG.hashSeed('road'));
    /* Fade out along the last stretch of the path, not at a fixed height: the
       map scrolls, so an absolute cutoff sits off screen and the road just stops
       dead wherever the ghost points ran out. */
    const FADE_FROM = 0.72;
    const step = 11;
    let row = 0;
    for (let t = 4; t < len; t += step, row++){
      const a = probe.getPointAtLength(t);
      const b = probe.getPointAtLength(Math.min(len, t + 2));
      const tx = b.x - a.x, ty = b.y - a.y;
      const L = Math.hypot(tx, ty) || 1;
      const nx = -ty / L, ny = tx / L;
      const ang = Math.atan2(ty, tx);
      const prog = t / len;
      const fade = prog < FADE_FROM ? 1 : Math.max(0, 1 - (prog - FADE_FROM) / (1 - FADE_FROM));
      if (fade <= 0.02) continue;

      const cols = 4;
      for (let c = 0; c < cols; c++){
        const jitter = (r() - 0.5) * 3.4;
        const off = ((c + 0.5) / cols - 0.5) * 38 + (row % 2 ? 4.4 : -4.4) + jitter;
        const x = a.x + nx * off, y = a.y + ny * off;
        const w = 9 + r() * 4.5, h = 7.5 + r() * 3;
        const lum = 26 + r() * 18;
        g.save();
        g.translate(x, y);
        g.rotate(ang + (r() - 0.5) * 0.35);
        g.globalAlpha = fade * (0.82 + r() * 0.18);
        g.fillStyle = `hsl(${58 + r() * 26},${9 + r() * 12}%,${lum}%)`;
        g.beginPath();
        if (g.roundRect) g.roundRect(-w / 2, -h / 2, w, h, 2.6 + r() * 1.6);
        else g.rect(-w / 2, -h / 2, w, h);
        g.fill();
        g.globalAlpha = fade * 0.16;                 /* a lit top edge on each */
        g.fillStyle = '#F2E8C8';
        g.fillRect(-w / 2 + 1, -h / 2, w - 2, 1.1);
        g.globalAlpha = fade * 0.22;                 /* and a seam under it */
        g.fillStyle = '#05070 3'.replace(' ', '');
        g.fillRect(-w / 2, h / 2 - 1, w, 1.1);
        g.restore();
      }

      /* moss creeping in from the verges, and the odd loose pebble */
      if (row % 3 === 0){
        for (const side of [-1, 1]){
          const off = side * (20 + r() * 7);
          const x = a.x + nx * off, y = a.y + ny * off;
          g.globalAlpha = fade * (0.22 + r() * 0.3);
          g.fillStyle = `hsl(${72 + r() * 24},${18 + r() * 16}%,${11 + r() * 9}%)`;
          g.beginPath();
          g.ellipse(x, y, 5 + r() * 7, 3 + r() * 4, r() * 3.14, 0, 6.283);
          g.fill();
        }
      }
      if (r() < 0.16){
        const off = (r() - 0.5) * 54;
        g.globalAlpha = fade * 0.5;
        g.fillStyle = `hsl(64,10%,${30 + r() * 14}%)`;
        g.beginPath();
        g.ellipse(a.x + nx * off, a.y + ny * off, 1.6 + r() * 2, 1.2 + r() * 1.6, 0, 0, 6.283);
        g.fill();
      }
      g.globalAlpha = 1;
    }
    probe.remove();

    /* Erase the far end so the bed goes with its stones. Fading the stones alone
       left the earth under them ending in a hard cap, which read as the road
       having been cut off rather than running out of sight. */
    g.globalCompositeOperation = 'destination-out';
    const out = g.createLinearGradient(0, 0, 0, H * 0.34);
    out.addColorStop(0, 'rgba(0,0,0,1)');
    out.addColorStop(0.55, 'rgba(0,0,0,.55)');
    out.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = out;
    g.fillRect(0, 0, width, H * 0.34);
    g.globalCompositeOperation = 'source-over';
  }

  function starRow(n){
    return `<span class="ns">${[0,1,2].map(i => i < n ? '★' : '<i>★</i>').join('')}</span>`;
  }
  function render(progress){
    const unlocked = progress.unlocked;
    const count = MapGeom.visibleCount(unlocked);
    const width = scroll.clientWidth || 360;
    const opts = { spacing: Math.min(104, Math.max(80, scroll.clientHeight / 5.4)) };
    const pts = MapGeom.nodes(count + 3, width, opts);   // 3 ghost points continue the path
    const H = MapGeom.height(count + 3, opts);
    canvas.style.height = H + 'px';

    svg.setAttribute('width', width);
    svg.setAttribute('height', H);
    /* A road, laid along the very spline the nodes sit on, so it cannot drift
       off them the way a painted one did. Built up in strokes: a bed of earth,
       the stone surface, a lit crown, then dashes across it for cobbles. */
    const d = MapGeom.pathThrough(pts, H);
    const fade = `${(count / (count + 3)).toFixed(2)}`;
    svg.innerHTML = `
      <defs>
        <linearGradient id="pathFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E0B15C" stop-opacity=".55"/>
          <stop offset="${fade}" stop-color="#E0B15C" stop-opacity=".28"/>
          <stop offset="1" stop-color="#E0B15C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${d}" fill="none" stroke="url(#pathFade)"
            stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>`;

    drawRoad(d, width, H, opts.spacing);

    canvas.querySelectorAll('.node,.chapter').forEach(n => n.remove());

    for (let i = 0; i < count; i++){
      const p = pts[i], level = p.level;
      if (Levels.isSectionStart(level)){
        const tag = document.createElement('div');
        tag.className = 'chapter';
        tag.style.bottom = (p.y + 46) + 'px';
        tag.style.setProperty('--tint', Levels.sectionTint(level));

      const stars = progress.starsFor(level);
      const cleared = stars > 0;
      const current = level === unlocked;
      const locked = level > unlocked;

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'node' + (cleared ? ' cleared' : '') + (current ? ' current' : '') + (locked ? ' locked' : '');
      b.style.left = p.x + 'px';
      b.style.bottom = p.y + 'px';
      b.style.setProperty('--tint', Levels.sectionTint(level));
      b.dataset.level = level;
