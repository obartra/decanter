/* ---- 80-map.js ---- */
/* The journey map. Pure geometry lives in MapGeom so it can be tested without
   a browser; MapView only turns those numbers into elements. */
const MapGeom = (() => {
  /* Levels climb from the bottom. x follows a slow sine so the path winds
     without ever leaving the column. */
  const STEP = 0.72;
  function nodes(count, width, opts){
    const o = Object.assign({ spacing:96, margin:52, bottom:90 }, opts || {});
    const amp = Math.max(0, Math.min(width * 0.30, width / 2 - o.margin));
    const cx = width / 2;
    const out = [];
    for (let i = 0; i < count; i++){
      out.push({ level: i + 1, x: cx + Math.sin(i * STEP) * amp, y: o.bottom + i * o.spacing });
    }
    return out;
  }
  const height = (count, opts) => {
    const o = Object.assign({ spacing:96, bottom:90, top:140 }, opts || {});
    return o.bottom + Math.max(0, count - 1) * o.spacing + o.top;
  };
  /* Catmull-Rom through the node centres, converted to cubic beziers */
  function pathThrough(points, flipY){
    if (points.length < 2) return '';
    const P = points.map(p => ({ x: p.x, y: flipY ? flipY - p.y : p.y }));
    let d = `M ${P[0].x.toFixed(1)} ${P[0].y.toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++){
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }
  /* what the player is allowed to see: everything cleared, the frontier, and a
     short glimpse of what is coming */
  const visibleCount = (unlocked, lookahead) => unlocked + (lookahead == null ? CONFIG.lookahead : lookahead);
  return { nodes, height, pathThrough, visibleCount, STEP };
})();
globalThis.MapGeom = MapGeom;

const MapView = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  let scroll = null, canvas = null, svg = null, road = null, onPick = () => {};
  let lastFocus = 1;

  /* The road, laid stone by stone along the very spline the nodes sit on. It is
     sampled from the path itself rather than recomputed, so it cannot drift off
     the medallions, and it is drawn to a canvas inside the scrolling map so it
     travels with them. Strokes alone read as a ribbon; cobbles read as a road. */
  function drawRoad(d, width, H, spacing){
    if (!road) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    road.width = Math.ceil(width * dpr); road.height = Math.ceil(H * dpr);
    road.style.width = width + 'px'; road.style.height = H + 'px';
    const g = road.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.scale(dpr, dpr);
    g.clearRect(0, 0, width, H);

    const shape = new Path2D(d);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#090C05'; g.lineWidth = 60; g.globalAlpha = .75; g.stroke(shape);
    g.strokeStyle = '#1A1F0E'; g.lineWidth = 50; g.globalAlpha = .9;  g.stroke(shape);
    g.strokeStyle = '#2C3018'; g.lineWidth = 43; g.globalAlpha = 1;   g.stroke(shape);

    /* a path element is the only honest way to walk a curve, so borrow one */
    const probe = document.createElementNS(NS, 'path');
    probe.setAttribute('d', d);
    probe.setAttribute('fill', 'none');
    svg.appendChild(probe);
    let len = 0;
    try { len = probe.getTotalLength(); } catch (e) { len = 0; }
    if (!len){ probe.remove(); return; }

    const r = RNG.mulberry32(RNG.hashSeed('road'));
    /* Fade out along the last stretch of the path, not at a fixed height: the
       map scrolls, so an absolute cutoff sits off screen and the road just stops
       dead wherever the ghost points ran out. */
    const FADE_FROM = 0.72;
    const step = 11;
    let row = 0;
    for (let t = 4; t < len; t += step, row++){
      const a = probe.getPointAtLength(t);
      const b = probe.getPointAtLength(Math.min(len, t + 2));
      const tx = b.x - a.x, ty = b.y - a.y;
      const L = Math.hypot(tx, ty) || 1;
      const nx = -ty / L, ny = tx / L;
      const ang = Math.atan2(ty, tx);
      const prog = t / len;
      const fade = prog < FADE_FROM ? 1 : Math.max(0, 1 - (prog - FADE_FROM) / (1 - FADE_FROM));
      if (fade <= 0.02) continue;

      const cols = 4;
      for (let c = 0; c < cols; c++){
        const jitter = (r() - 0.5) * 3.4;
        const off = ((c + 0.5) / cols - 0.5) * 38 + (row % 2 ? 4.4 : -4.4) + jitter;
        const x = a.x + nx * off, y = a.y + ny * off;
        const w = 9 + r() * 4.5, h = 7.5 + r() * 3;
        const lum = 26 + r() * 18;
        g.save();
        g.translate(x, y);
        g.rotate(ang + (r() - 0.5) * 0.35);
        g.globalAlpha = fade * (0.82 + r() * 0.18);
        g.fillStyle = `hsl(${58 + r() * 26},${9 + r() * 12}%,${lum}%)`;
        g.beginPath();
        if (g.roundRect) g.roundRect(-w / 2, -h / 2, w, h, 2.6 + r() * 1.6);
        else g.rect(-w / 2, -h / 2, w, h);
        g.fill();
        g.globalAlpha = fade * 0.16;                 /* a lit top edge on each */
        g.fillStyle = '#F2E8C8';
        g.fillRect(-w / 2 + 1, -h / 2, w - 2, 1.1);
        g.globalAlpha = fade * 0.22;                 /* and a seam under it */
        g.fillStyle = '#05070 3'.replace(' ', '');
        g.fillRect(-w / 2, h / 2 - 1, w, 1.1);
        g.restore();
      }

      /* moss creeping in from the verges, and the odd loose pebble */
      if (row % 3 === 0){
        for (const side of [-1, 1]){
          const off = side * (20 + r() * 7);
          const x = a.x + nx * off, y = a.y + ny * off;
          g.globalAlpha = fade * (0.22 + r() * 0.3);
          g.fillStyle = `hsl(${72 + r() * 24},${18 + r() * 16}%,${11 + r() * 9}%)`;
          g.beginPath();
          g.ellipse(x, y, 5 + r() * 7, 3 + r() * 4, r() * 3.14, 0, 6.283);
          g.fill();
        }
      }
      if (r() < 0.16){
        const off = (r() - 0.5) * 54;
        g.globalAlpha = fade * 0.5;
        g.fillStyle = `hsl(64,10%,${30 + r() * 14}%)`;
        g.beginPath();
        g.ellipse(a.x + nx * off, a.y + ny * off, 1.6 + r() * 2, 1.2 + r() * 1.6, 0, 0, 6.283);
        g.fill();
      }
      g.globalAlpha = 1;
    }
    probe.remove();

    /* Erase the far end so the bed goes with its stones. Fading the stones alone
       left the earth under them ending in a hard cap, which read as the road
       having been cut off rather than running out of sight. */
    g.globalCompositeOperation = 'destination-out';
    const out = g.createLinearGradient(0, 0, 0, H * 0.34);
    out.addColorStop(0, 'rgba(0,0,0,1)');
    out.addColorStop(0.55, 'rgba(0,0,0,.55)');
    out.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = out;
    g.fillRect(0, 0, width, H * 0.34);
    g.globalCompositeOperation = 'source-over';
  }

  function starRow(n){
    return `<span class="ns">${[0,1,2].map(i => i < n ? '★' : '<i>★</i>').join('')}</span>`;
  }
  function render(progress){
    const unlocked = progress.unlocked;
    const count = MapGeom.visibleCount(unlocked);
    const width = scroll.clientWidth || 360;
    const opts = { spacing: Math.min(104, Math.max(80, scroll.clientHeight / 5.4)) };
    const pts = MapGeom.nodes(count + 3, width, opts);   // 3 ghost points continue the path
    const H = MapGeom.height(count + 3, opts);
    canvas.style.height = H + 'px';

    svg.setAttribute('width', width);
    svg.setAttribute('height', H);
    /* A road, laid along the very spline the nodes sit on, so it cannot drift
       off them the way a painted one did. Built up in strokes: a bed of earth,
       the stone surface, a lit crown, then dashes across it for cobbles. */
    const d = MapGeom.pathThrough(pts, H);
    const fade = `${(count / (count + 3)).toFixed(2)}`;
    svg.innerHTML = `
      <defs>
        <linearGradient id="pathFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E0B15C" stop-opacity=".55"/>
          <stop offset="${fade}" stop-color="#E0B15C" stop-opacity=".28"/>
          <stop offset="1" stop-color="#E0B15C" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${d}" fill="none" stroke="url(#pathFade)"
            stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>`;

    drawRoad(d, width, H, opts.spacing);

    canvas.querySelectorAll('.node,.chapter').forEach(n => n.remove());

    for (let i = 0; i < count; i++){
      const p = pts[i], level = p.level;
      if (Levels.isSectionStart(level)){
        const tag = document.createElement('div');
        tag.className = 'chapter';
        tag.style.bottom = (p.y + 46) + 'px';
        tag.style.setProperty('--tint', Levels.sectionTint(level));
        tag.innerHTML = `<span>${Levels.sectionName(level)}</span>`;
        canvas.appendChild(tag);
      }
      const stars = progress.starsFor(level);
      const cleared = stars > 0;
      const current = level === unlocked;
      const locked = level > unlocked;

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'node' + (cleared ? ' cleared' : '') + (current ? ' current' : '') + (locked ? ' locked' : '');
      b.style.left = p.x + 'px';
      b.style.bottom = p.y + 'px';
      b.style.setProperty('--tint', Levels.sectionTint(level));
      b.dataset.level = level;
      b.disabled = locked;
      b.setAttribute('aria-label', locked
        ? `Level ${level}, locked`
        : `Level ${level}${cleared ? `, ${stars} of 3 stars` : ''}`);
      b.innerHTML = locked
        ? '<span class="num">🔒</span>'
        : `<span class="num">${level}</span>${cleared ? starRow(stars) : ''}`;
      if (!locked) b.addEventListener('click', () => onPick(level));
      canvas.appendChild(b);
    }
    document.getElementById('mapStars').textContent = progress.totalStars();
    document.getElementById('mapChapter').textContent = Levels.sectionName(unlocked);
    lastFocus = unlocked;
  }
  function scrollToCurrent(smooth){
    const node = canvas.querySelector(`.node[data-level="${lastFocus}"]`);
    if (!node) return;
    const target = node.offsetTop - scroll.clientHeight * 0.58 + node.offsetHeight;
    scroll.scrollTo({ top: Math.max(0, target), behavior: smooth ? 'smooth' : 'auto' });
  }
  return {
    mount(scrollEl){
      scroll = scrollEl;
      canvas = scrollEl.querySelector('.mapCanvas');
      road = document.createElement('canvas');
      road.className = 'mapRoad';
      canvas.appendChild(road);
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'mapPath');
      canvas.appendChild(svg);
    },
    set onPick(fn){ onPick = fn; },
    render, scrollToCurrent
  };
})();
globalThis.MapView = MapView;


/* ---- 90-app.js ---- */
/* Glue: routing between the map and a level, the move queue, and the win flow. */
const App = (() => {
  const progress = Progress.createProgress();
  const S = {
    level: 1, tubes: [], moves: 0,
    history: [], queue: [], running: false,
    par: null, parExact: false, parRequest: 0,
    undosUsed: 0, vesselUsed: false
  };
  const $ = id => document.getElementById(id);

  /* ---------- routing ---------- */
  /* The stylesheets colour bands with var(--cN), the pour and the particle sim
     read CONFIG.palette. Publishing one from the other keeps a single source:
     when the palette moved to jewel tones and the CSS did not, the sim poured
     the old colours into the new bottles. */
  function publishPalette(){
    const s = document.documentElement.style;
    CONFIG.palette.forEach((hex, i) => s.setProperty(`--c${i}`, hex));
  }

  /* local calendar day, so the draught refreshes on the player's midnight */
  function today(){
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function paintMap(){
    $('mapGold').textContent = progress.gold;
    const ready = progress.dailyReady(today());
    $('daily').disabled = !ready;
    $('dailyCost').textContent = ready ? `+${CONFIG.economy.daily}` : 'drawn';
  }
  function showMap(scrollSmooth){
    document.body.dataset.view = 'map';
    Backdrop.kind = 'moss';
    Backdrop.setShelf(null);
    MapView.render(progress);
    MapView.scrollToCurrent(!!scrollSmooth);
    paintMap();
  }
  function showGame(level){
    document.body.dataset.view = 'game';
    Backdrop.kind = 'cellar';
    start(level);
  }

  /* ---------- a level ---------- */
  /* Restarting keeps a vessel the player already paid for, so a restart cannot
     be used to launder the purchase back into a three-star run. Leaving the
     level and coming back deals a clean board, and costs the gold again. */
  function start(level, keepVessel){
    S.level = level;
    S.tubes = Levels.make(level);
    if (keepVessel) S.tubes.push([]);
    S.vesselUsed = !!keepVessel;
    S.undosUsed = 0;
    S.moves = 0;
    S.history = [];
    S.queue = [];
    S.running = false;
    /* the baked table is exact, and so is anything progress kept */
    S.par = PARS[level] ?? progress.parFor(level);
    S.parExact = S.par != null;
    Board.view = Rules.clone(S.tubes);
    Board.selected = null;
    $('veil').classList.remove('show');
    Board.render();
    paintHud();
    if (S.par == null) askPar();
  }
  function askPar(){
    const id = ++S.parRequest;
    const level = S.level;
    $('statPar').textContent = '…';
    SolverClient.solve(S.tubes, Levels.shape(level).colors, res => {
      if (id !== S.parRequest) return;
      S.par = res.par;
      S.parExact = !!res.exact;
      progress.rememberPar(level, res.par, res.exact);
      paintHud();
    });
  }
  const undoIsFree = () => S.undosUsed < CONFIG.economy.freeUndos;
  const undoPrice = () => (undoIsFree() ? 0 : CONFIG.economy.undoCost);

  function paintHud(){
    const busy = S.queue.length > 0 || S.running;
    const par = S.par == null ? '—' : (S.parExact ? S.par : '~' + S.par);
    $('statLevel').textContent = S.level;
    $('statMoves').textContent = S.moves;
    $('statPar').textContent = par;
    $('pourLabel').textContent = `Pours · Par ${par}`;
    $('statLeft').textContent = S.tubes.filter(t => t.length && !Rules.isFull(t)).length;
    $('movesStat').classList.toggle('over', S.par != null && S.moves > S.par);
    $('gold').textContent = progress.gold;

    const freeLeft = Math.max(0, CONFIG.economy.freeUndos - S.undosUsed);
    $('undoCost').textContent = freeLeft ? `${freeLeft} free` : `${CONFIG.economy.undoCost}`;
    $('undo').disabled = !S.history.length || busy ||
      (!undoIsFree() && !progress.canAfford(CONFIG.economy.undoCost));

    $('vesselCost').textContent = CONFIG.economy.vessel;
    $('vessel').disabled = busy || S.vesselUsed || !progress.canAfford(CONFIG.economy.vessel);
    $('vessel').classList.toggle('spent', S.vesselUsed);

    $('restart').disabled = (!S.history.length && !S.moves) || busy;
  }

  /* ---------- input ---------- */
  /* Logic resolves on tap. Animation trails behind in a queue, so a player can
     keep pouring without waiting for the bottle to finish tipping. */
  function tap(i){
    Audio.unlock();
    const sel = Board.selected;
    if (sel === null){
      if (!S.tubes[i].length || Rules.isFull(S.tubes[i])){ Board.nudge(i); Audio.deny(); return; }
      Board.selected = i;
      Board.el(i)?.classList.add('lifted');
      Audio.lift();
      return;
    }
    if (sel === i){
      Board.el(i)?.classList.remove('lifted');
      Board.selected = null;
      Audio.drop();
      return;
    }
    if (Rules.canPour(S.tubes, sel, i)){
      Board.el(sel)?.classList.remove('lifted');
      Board.selected = null;
      commit(sel, i);
    } else {
      Board.nudge(i);
      Audio.deny();
      Board.el(sel)?.classList.remove('lifted');
      Board.selected = null;
    }
  }
  function commit(from, to){
    const move = { from, to, n: Rules.pourAmount(S.tubes, from, to), color: S.tubes[from][S.tubes[from].length - 1] };
    S.history.push({ tubes: Rules.clone(S.tubes), moves: S.moves });
    Rules.applyMove(S.tubes, move);
    S.moves++;
    S.queue.push(move);
    paintHud();
    drain().catch(() => {});   /* drain's finally has already restored the state */
  }
  /* The view trails the logic here, so this loop owes the player two things: it
     must always let go of `running`, and it must always leave the view where the
     logic already is. Undo and Restart are disabled while a pour is in flight,
     so a drain that dies halfway strands the level with no way out but a reload. */
  async function drain(){
    if (S.running) return;
    S.running = true;
    try {
      while (S.queue.length){
        const move = S.queue.shift();
        try {
          await Board.animate(move);
        } catch {
          /* a dropped animation still owes the board its result */
        }
        Rules.applyMove(Board.view, move);
        Board.render();
        if (Rules.isFull(Board.view[move.to])) Board.seal(move.to);
      }
    } finally {
      S.running = false;
      paintHud();
    }
    if (Rules.isSolved(S.tubes)) finish();
  }

  /* ---------- finishing ---------- */
  function finish(){
    const stars = Rules.rate(S.moves, S.par, S.parExact, S.vesselUsed);
    const before = progress.starsFor(S.level);
    const result = progress.complete(S.level, S.moves, stars);
    const perfect = stars === 3;

    $('stars').innerHTML = [0,1,2].map(i => i < stars ? '★' : '<span class="dim">★</span>').join('');
    $('winTitle').textContent = perfect ? 'Poured clean' : 'Level cleared';
    const parLine = S.par == null
      ? ''
      : ` ${S.parExact ? 'The minimum is' : 'The best found is about'} ${S.par}.`;
    const bestLine = progress.bestFor(S.level) != null && progress.bestFor(S.level) < S.moves
      ? ` Your best here is ${progress.bestFor(S.level)}.` : '';
    $('winLine').textContent = `Sorted in ${S.moves} pours.${parLine}${bestLine}`;

    /* say where the gold came from, so the thin payouts read as earned */
    const parts = [`${stars}★`];
    if (result.firstClear) parts.push('first clear');
    $('goldEarned').textContent = `+${result.earned}`;
    $('goldWhy').textContent = `Gold · ${parts.join(' + ')}`;

    $('winHint').textContent = S.vesselUsed
      ? 'A bought vessel caps the run at two stars. Clear it unaided for the third.'
      : (perfect ? '' : 'Par or one over earns the third star.');
    $('retry').hidden = perfect;
    $('retry').classList.toggle('primary', !perfect);
    $('next').classList.toggle('primary', perfect);
    if (result.improvedStars && before > 0) $('winHint').textContent = 'New best for this level.';

    setTimeout(() => {
      Audio.win();
      Confetti.rain(CONFIG.palette.slice(0, Levels.shape(S.level).colors));
      $('veil').classList.add('show');
    }, 700);
  }

  /* ---------- wiring ---------- */
  function paintSound(on){
    document.querySelectorAll('.js-sound').forEach(b => {
      b.textContent = on ? 'Sound on' : 'Sound off';
      b.classList.toggle('off', !on);
    });
  }
  function bind(){
    Board.mount($('board'));
    Board.onTap = tap;
    MapView.mount($('mapScroll'));
    MapView.onPick = level => { Audio.unlock(); Audio.tick(); showGame(level); };

    $('undo').onclick = () => {
      if (S.queue.length || S.running || !S.history.length) return;
      /* charge before rolling back, so a refused payment changes nothing */
      if (!undoIsFree() && !progress.spend(CONFIG.economy.undoCost)){ Audio.deny(); return; }
      S.undosUsed++;
      const prev = S.history.pop();
      S.tubes = prev.tubes;
      S.moves = prev.moves;
      Board.view = Rules.clone(prev.tubes);
      Board.selected = null;
      Audio.drop();
      Board.render();
      paintHud();
    };
    $('vessel').onclick = () => {
      if (S.queue.length || S.running || S.vesselUsed) return;
      if (!progress.spend(CONFIG.economy.vessel)){ Audio.deny(); return; }
      S.vesselUsed = true;
      S.tubes.push([]);
      Board.view.push([]);
      /* the shelf changed shape, so the snapshots behind us no longer describe
         this board and undoing into one would quietly take the vessel back */
      S.history = [];
      Board.selected = null;
      Audio.lift();
      Board.render();
      paintHud();
    };
    $('restart').onclick = () => {
      if (S.queue.length || S.running) return;
      start(S.level, S.vesselUsed);
    };
    $('toMap').onclick = () => { Audio.tick(); showMap(false); };
    $('winMap').onclick = () => { $('veil').classList.remove('show'); showMap(true); };
    $('retry').onclick = () => { $('veil').classList.remove('show'); start(S.level); };
    $('next').onclick = () => { $('veil').classList.remove('show'); showGame(S.level + 1); };
    document.querySelectorAll('.js-sound').forEach(btn => {
      btn.onclick = () => {
        Audio.unlock();
        paintSound(Audio.toggle());
        progress.setSound(Audio.enabled);
        if (Audio.enabled) Audio.lift();
      };
    });
    $('mapPlay').onclick = () => { Audio.unlock(); showGame(progress.unlocked); };
    $('daily').onclick = () => {
      Audio.unlock();
      if (!progress.claimDaily(today())){ Audio.deny(); return; }
      Audio.lift();
      paintMap();
    };

    let rt;
    addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        if (document.body.dataset.view === 'map') MapView.render(progress);
        else if (!S.running && !S.queue.length) Board.render();
      }, 120);
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.dataset.view === 'game') showMap(false);
    });
  }
  return {
    boot(){
      publishPalette();
      Backdrop.mount();
      bind();
      Audio.setEnabled(progress.sound);
      paintSound(progress.sound);
      showMap(false);
    },
    /* exposed for debugging in the console */
    _state: S, _progress: progress
  };
})();
globalThis.App = App;
document.addEventListener('DOMContentLoaded', () => App.boot());


/* ---- 95-pwa.js ---- */
/* Install prompt and service worker registration. */
(() => {
  let deferred = null;
  const btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (btn) btn.hidden = false;
  });
  if (btn){
    btn.onclick = async () => {
      if (!deferred) return;
      btn.hidden = true;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    };
  }
  addEventListener('appinstalled', () => { if (btn) btn.hidden = true; deferred = null; });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
