<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble</title>
<meta name="theme-color" content="#0C1020">
<meta name="color-scheme" content="dark">
<meta name="description" content="A bubble shooter. Match three to clear the board.">
<!-- Inline rather than a file in ./icons/, because this page is served from its
     own directory and is meant to open off disk as well as off a server, so any
     path here is wrong somewhere. A page that declares no icon at all is not
     neutral: the browser asks for /favicon.ico by itself, and on a build that
     does not ship one at the root the 404 lands in the console. That is what
     made bubble.spec.js flaky — whether the error arrived before the assertion
     was a race — and a failure nobody can reproduce twice is worse than a
     missing icon. Costs no request at all. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23E2546F'/%3E%3Ccircle cx='11.5' cy='11.5' r='3.6' fill='%23fff' opacity='.45'/%3E%3C/svg%3E">
<!--BUILD-->
<!--FONTS-->
<style><!--CSS--></style>
</head>
<body data-only="bubble">
<header class="bubbleBar">
  <span class="mark">Bubble</span>
  <span class="bubHud">
    <b id="bubbleLive">0</b>
    <span class="runStars" id="bubbleRunStars"></span>
    <small id="bubbleDrop">drops in 10</small>
  </span>
  <span class="acts">
    <button class="bubBtn" id="bubbleSound" type="button" aria-pressed="true">Sound</button>
    <button class="bubBtn" id="bubbleAgain" type="button">New</button>
  </span>
</header>
<main class="stage">
  <canvas id="bubbleCanvas"></canvas>
  <p class="rule" id="bubbleRule">Match three of a colour to bring them down.<br>Clear the board to win. If the bubbles reach the line, you lose.</p>
</main>
<!-- What the run is allowed to lean on. The first three leave it gradeable;
     picking a colour does not, and says so where it is pressed. -->
<div class="tools">
  <button class="bubBtn tool" id="bubbleUndo" type="button">Undo</button>
  <button class="bubBtn tool" id="bubbleHint" type="button">Hint</button>
  <button class="bubBtn tool" id="bubbleSwap" type="button">Swap</button>
  <button class="bubBtn tool" id="bubblePick" type="button" aria-expanded="false">Colour</button>
  <button class="bubBtn tool" id="bubbleBomb" type="button">Bomb</button>
</div>
<div class="palette" id="bubblePalette" hidden></div>
<div class="bubVeil" id="bubbleVeil">
  <div class="card">
    <h2 id="bubbleResult">Board cleared</h2>
    <p class="why" id="bubbleWhy"></p>
    <p class="stars" id="bubbleStars"></p>
    <p class="score"><b id="bubbleScore">0</b><span>points</span></p>
    <p class="note" id="bubbleNote"></p>
    <button class="bubBtn primary" id="bubbleRetry" type="button">Play again</button>
  </div>
</div>
<script><!--JS--></script>
</body>
</html>
