<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="the-measure">The Measure</title>
<meta name="theme-color" content="#150E08">
<meta name="color-scheme" content="dark">
<meta name="description" content="A decanting puzzle. Pour between vessels until one holds the target exactly.">
<!--BUILD-->
<!--HEAD-->
<!--FONTS-->
<!--CSS-->
</head>
<body data-only="measure">
<header class="msrBar">
  <span data-t="measure" class="msrMark">Measure</span>
  <span class="msrHud">
    <span class="msrCount"><b id="msrMoves">0</b><span data-t="of-3" id="msrPar">of 3</span></span>
    <span class="msrStars" id="msrStars"></span>
    <small data-t="bench" class="msrWhich">Bench <span id="msrLevel">1</span> &middot; measure <span id="msrTarget">2</span></small>
  </span>
  <span class="msrActs">
    <button data-t="sound" class="msrBtn" id="msrSound" type="button" aria-pressed="true">Sound</button>
    <button data-t="next" class="msrBtn" id="msrSkip" type="button">Next</button>
  </span>
</header>
<main class="msrStage">
  <canvas id="msrCanvas"></canvas>
</main>
<!-- Undo and hint both cap the run at two stars, and the page does not say so
     here: the panel says it at the moment it costs something, which is the only
     moment anybody reads it. A warning on the button is read once and then
     becomes furniture. -->
<div class="msrTools">
  <button data-t="undo" class="msrBtn" id="msrUndo" type="button">Undo</button>
  <button data-t="hint" class="msrBtn" id="msrHint" type="button">Hint</button>
  <button data-t="restart" class="msrBtn" id="msrRestart" type="button">Restart</button>
</div>
<div class="msrVeil" id="msrVeil">
  <div class="msrCard">
    <h2 data-t="measured" id="msrResult">Measured</h2>
    <p class="msrWhy" id="msrWhy"></p>
    <p class="msrStars" id="msrStarsOut"></p>
    <p class="msrNote" id="msrNote"></p>
    <button data-t="next-bench" class="msrBtn msrPrimary" id="msrNext" type="button">Next bench</button>
  </div>
</div>
<!--JS-->
</body>
</html>
